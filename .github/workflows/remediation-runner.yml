name: Remediation runner

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
  merge_group:
  pull_request:
    paths:
      - 'automation/langflow/**'
      - 'Makefile'
      - '.github/workflows/remediation-runner.yml'
  push:
    branches: [main]
    paths:
      - 'automation/langflow/**'
      - 'Makefile'
      - '.github/workflows/remediation-runner.yml'

permissions:
  contents: read

jobs:
  runner:
    name: Langflow runner tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/langflow/pyproject.toml
      - name: Install pinned workflow engine
        run: python -m pip install './automation/langflow[flows]'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify runner through the shared local target
        run: make verify-runner
