name: CI

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      full:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete browser matrix
        type: boolean
        default: true
  pull_request:
  # The merge queue runs the suite on its temporary branch before merging, so
  # a pull request that went green on a stale base still has to pass on top
  # of the current main.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main and merge-queue
# runs always finish so every commit on main keeps a completed status and the
# queue gets the result it is waiting for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Validation selection
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          FORCE_FULL: ${{ inputs.full || false }}
          REVIEWED_VALIDATION_POLICY_SHA: ${{ vars.REVIEWED_VALIDATION_POLICY_SHA }}
        run: python3 scripts/ci/plan-validation.py
      - name: Retain the selected profile and reasons
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/validation-plan.json
          if-no-files-found: error
      - name: Assess documentation impact for this PR or merged commit
        run: python3 scripts/ci/plan-documentation.py
      - name: Retain documentation impact for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-impact-${{ github.run_id }}
          path: ${{ runner.temp }}/documentation-impact.json
          if-no-files-found: error

  hygiene:
    name: Repository hygiene
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Require a valid selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Size guard and e2e runner self-test
        run: make verify-hygiene

  migrations:
    needs: plan
    uses: ./.github/workflows/migrations.yml
    with:
      revision: ${{ inputs.revision || github.sha }}

  backend:
    name: Backend (build, vet, test)
    needs: [plan, migrations]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    services:
      db:
        image: ${{ (needs.plan.outputs.profile == 'aeo' || needs.plan.outputs.profile == 'auth' || needs.plan.outputs.profile == 'transaction' || needs.plan.outputs.profile == 'auth-persistence' || needs.plan.outputs.profile == 'full') && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: transaction-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptransaction-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Require a valid selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Require SQL migration and SQLite upgrade coverage
        env:
          MIGRATION_RESULT: ${{ needs.migrations.result }}
        run: test "$MIGRATION_RESULT" = success
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Every profile: api/ must match a fresh `make swagger` and document
      # every route (scripts/ci/check-api-docs.py).
      - name: API reference is current and complete
        run: make verify-api-docs
      # The Makefile and shared profile checkers own the commands used both
      # locally and in CI.
      - name: Build, vet, test
        if: needs.plan.outputs.profile != 'mailer' && needs.plan.outputs.profile != 'aeo' && needs.plan.outputs.profile != 'runner' && needs.plan.outputs.profile != 'auth' && needs.plan.outputs.profile != 'auth-persistence' && needs.plan.outputs.profile != 'transaction' && needs.plan.outputs.profile != 'migration'
        run: make verify-backend
      - name: SMTP transport and mail caller regressions
        if: needs.plan.outputs.profile == 'mailer'
        run: python3 scripts/ci/check-go.py mailer
      - name: AEO runtime and persistence regressions on SQLite and MySQL
        if: needs.plan.outputs.profile == 'aeo'
        env:
          TEST_MYSQL_DSN: root:transaction-test-password@tcp(127.0.0.1:3306)/
        run: python3 scripts/ci/check-go.py aeo
      - name: Auth API build, vet and race regressions
        if: needs.plan.outputs.profile == 'auth'
        env:
          TEST_MYSQL_DSN: root:transaction-test-password@tcp(127.0.0.1:3306)/
        run: python3 scripts/ci/check-auth.py
      - name: Auth persistence on SQLite and MySQL
        if: needs.plan.outputs.profile == 'auth-persistence'
        env:
          TEST_MYSQL_DSN: root:transaction-test-password@tcp(127.0.0.1:3306)/
        run: python3 scripts/ci/check-auth.py --persistence
      - name: Transaction boundaries and affected callers
        if: needs.plan.outputs.profile == 'transaction'
        env:
          TEST_MYSQL_DSN: root:transaction-test-password@tcp(127.0.0.1:3306)/
        run: python3 scripts/ci/check-go.py transaction
      - name: Auth persistence and full validation transaction boundaries
        if: needs.plan.outputs.profile == 'full' || needs.plan.outputs.profile == 'auth-persistence'
        env:
          TEST_MYSQL_DSN: root:transaction-test-password@tcp(127.0.0.1:3306)/
          VALIDATION_PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          if [ "$VALIDATION_PROFILE" = full ]; then
            python3 scripts/ci/check-go.py transaction
          else
            python3 scripts/ci/check-go.py transaction --storage-only
          fi
      - name: Migration-profile API build and vet
        if: needs.plan.outputs.profile == 'migration'
        run: |
          go build ./cmd/...
          go vet ./cmd/migrate ./internal/models
      - name: Runner-only API build and affected Go probe checks
        if: needs.plan.outputs.profile == 'runner'
        run: |
          go build ./cmd/...
          go vet ./automation/langflow/probes/mysql
          go test ./automation/langflow/probes/mysql

  frontend:
    name: Frontend (build, lint, test)
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Require a valid selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gocrm-ui/package-lock.json
      # npm ci, the production build (tsc -b plus vite), lint and Vitest.
      - name: Install, build, lint, test
        if: needs.plan.outputs.profile != 'mailer' && needs.plan.outputs.profile != 'aeo' && needs.plan.outputs.profile != 'runner' && needs.plan.outputs.profile != 'auth' && needs.plan.outputs.profile != 'auth-persistence' && needs.plan.outputs.profile != 'transaction' && needs.plan.outputs.profile != 'migration'
        run: make verify-frontend
      - name: Frontend build health check
        if: needs.plan.outputs.profile == 'mailer' || needs.plan.outputs.profile == 'runner' || needs.plan.outputs.profile == 'aeo' || needs.plan.outputs.profile == 'auth' || needs.plan.outputs.profile == 'auth-persistence' || needs.plan.outputs.profile == 'transaction' || needs.plan.outputs.profile == 'migration'
        working-directory: gocrm-ui
        run: npm ci && npm run build

  e2e:
    # One leg per database engine: MySQL 8; MariaDB 10.11, which is what
    # production runs; and SQLite, a supported production backend since 1.2.0.
    # Required jobs always run the selected smoke/feature specs on all engines.
    # Release calls force the complete browser suite before publication.
    name: E2E (Playwright on ${{ matrix.db.name }})
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MySQL 8
            id: mysql8
            driver: mysql
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -pe2e-root-password
          - name: MariaDB 10.11
            id: mariadb1011
            driver: mysql
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
          # No server: the runner skips a service whose image is empty, and
          # run.sh gives the backend a new SQLite file instead.
          - name: SQLite
            id: sqlite
            driver: sqlite
            image: ''
            health: ''
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # The MariaDB image accepts the MYSQL_* names as well.
          MYSQL_ROOT_PASSWORD: e2e-root-password
          MYSQL_DATABASE: gocrm_e2e
          MYSQL_USER: gophercrm
          MYSQL_PASSWORD: e2e-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      E2E_DB_DRIVER: ${{ matrix.db.driver }}
      # A throwaway database in a service container; these are not secrets.
      # The sqlite leg ignores them.
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: gophercrm
      DB_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Require a valid selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gocrm-ui/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: gocrm-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: AEO runtime and persistence regressions on MariaDB
        if: needs.plan.outputs.profile == 'aeo' && matrix.db.id == 'mariadb1011'
        env:
          TEST_MYSQL_DSN: root:e2e-root-password@tcp(127.0.0.1:3306)/
        run: python3 scripts/ci/check-go.py aeo
      - name: Auth persistence on MariaDB
        if: needs.plan.outputs.profile == 'auth-persistence' && matrix.db.id == 'mariadb1011'
        env:
          TEST_MYSQL_DSN: root:e2e-root-password@tcp(127.0.0.1:3306)/
        run: python3 scripts/ci/check-auth.py --persistence
      - name: Transaction boundaries on MariaDB
        if: (needs.plan.outputs.profile == 'transaction' || needs.plan.outputs.profile == 'auth-persistence' || needs.plan.outputs.profile == 'full') && matrix.db.id == 'mariadb1011'
        env:
          TEST_MYSQL_DSN: root:e2e-root-password@tcp(127.0.0.1:3306)/
          VALIDATION_PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          if [ "$VALIDATION_PROFILE" = full ]; then
            python3 scripts/ci/check-go.py transaction
          else
            python3 scripts/ci/check-go.py transaction --storage-only
          fi
      - name: Generate a per-run JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      # The same script as `make e2e` locally: reset gocrm_e2e (or, on the
      # sqlite leg, use a new SQLite file), start the backend on a free port,
      # run Playwright with no retries, always stop the backend.
      - name: Run e2e
        env:
          SELECTED_SPECS: ${{ needs.plan.outputs.specs }}
          VALIDATION_PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          echo "Browser profile: $VALIDATION_PROFILE"
          make e2e SPECS="$SELECTED_SPECS"
      - name: Upload Playwright report and backend log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.db.id }}
          path: |
            gocrm-ui/playwright-report/
            gocrm-ui/test-results/
          retention-days: 14
