name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main always finish so
# every commit on main keeps a completed status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject large tracked files
        run: make verify-hygiene

  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Makefile owns the package lists and the exact commands, so a
      # local `make verify` and CI cannot drift apart.
      - name: Build, vet, test
        run: make verify-backend

  frontend:
    name: Frontend (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gocrm-ui/package-lock.json
      # npm ci, the production build (tsc -b plus vite), lint and Vitest.
      - name: Install, build, lint, test
        run: make verify-frontend
