name: CI

on:
  pull_request:
  # The merge queue runs the suite on its temporary branch before merging, so
  # a pull request that went green on a stale base still has to pass on top
  # of the current main.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main and merge-queue
# runs always finish so every commit on main keeps a completed status and the
# queue gets the result it is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Size guard and e2e runner self-test
        run: make verify-hygiene

  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Makefile owns the package lists and the exact commands, so a
      # local `make verify` and CI cannot drift apart.
      - name: Build, vet, test
        run: make verify-backend

  frontend:
    name: Frontend (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gocrm-ui/package-lock.json
      # npm ci, the production build (tsc -b plus vite), lint and Vitest.
      - name: Install, build, lint, test
        run: make verify-frontend

  e2e:
    # One leg per database engine: MySQL 8; MariaDB 10.11, which is what
    # production runs; and SQLite, a supported production backend since 1.2.0.
    # The MySQL and MariaDB legs are required checks, so nothing reaches main
    # (and the automated deploy) without passing on production's own engine.
    name: E2E (Playwright on ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MySQL 8
            id: mysql8
            driver: mysql
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -pe2e-root-password
          - name: MariaDB 10.11
            id: mariadb1011
            driver: mysql
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
          # No server: the runner skips a service whose image is empty, and
          # run.sh gives the backend a new SQLite file instead.
          - name: SQLite
            id: sqlite
            driver: sqlite
            image: ''
            health: ''
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # The MariaDB image accepts the MYSQL_* names as well.
          MYSQL_ROOT_PASSWORD: e2e-root-password
          MYSQL_DATABASE: gocrm_e2e
          MYSQL_USER: gophercrm
          MYSQL_PASSWORD: e2e-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      E2E_DB_DRIVER: ${{ matrix.db.driver }}
      # A throwaway database in a service container; these are not secrets.
      # The sqlite leg ignores them.
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: gophercrm
      DB_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gocrm-ui/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: gocrm-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate a per-run JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      # The same script as `make e2e` locally: reset gocrm_e2e (or, on the
      # sqlite leg, use a new SQLite file), start the backend on a free port,
      # run Playwright with no retries, always stop the backend.
      - name: Run e2e
        run: make e2e
      - name: Upload Playwright report and backend log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ matrix.db.id }}
          path: |
            gocrm-ui/playwright-report/
            gocrm-ui/test-results/
          retention-days: 14
