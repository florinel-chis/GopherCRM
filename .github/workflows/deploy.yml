name: Deploy

# Deploy the artifact from a successful, published full Release workflow.
# Rehearsals do not deploy. Rollback and status retain the existing server protocol.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy the latest validated release, roll back, or report status
        type: choice
        options: [deploy, rollback, status]
        default: status
      release_tag:
        description: Published stable tag required for manual deploy, for example v1.3.0
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# One production change at a time, never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    # The server's address and SSH user are secrets, read only by the steps
    # that need them: job-level env is printed in every step's log header, and
    # this repository's logs are public.
    steps:
      - name: Check that production is configured
        id: configured
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$PRODUCTION_HOST" ] || [ -z "$PRODUCTION_URL" ] || [ -z "$PRODUCTION_SSH_USER" ]; then
            echo "::notice::Production deploy is not configured yet (run scripts/deploy/bootstrap.sh once); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve published release artifact
        id: current
        if: steps.configured.outputs.ready == 'true' && env.ACTION == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [ -n "$RELEASE_RUN" ]; then
            count=$(python3 scripts/release/release.py publication-status --run-id "$RELEASE_RUN")
            if [ "$count" = 0 ]; then
              echo "No publication receipt: rehearsal completed; no deployment."
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            args+=(--run-id "$RELEASE_RUN")
          else
            args+=(--tag "$RELEASE_TAG")
          fi
          python3 scripts/release/release.py download "${args[@]}"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.configured.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship and activate
        if: steps.current.outputs.deploy == 'true'
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" "deploy $REVISION" < release-artifacts/gophercrm-linux-amd64.tgz

      # Through Cloudflare, as visitors reach it: the public /health must report
      # the commit that was just deployed. The server already verified it
      # locally, so a failure here (a CDN challenge against runner addresses,
      # say) turns the run red without rolling back: check, then roll back by
      # hand with the manual trigger if production really is broken.
      - name: Verify from outside
        if: steps.current.outputs.deploy == 'true'
        run: |
          for attempt in $(seq 1 24); do
            body=$(curl -fsS --max-time 10 "$PRODUCTION_URL/health?check=$REVISION-$attempt" || true)
            if printf '%s' "$body" | grep -q "\"revision\":\"$REVISION\""; then
              echo "Production serves $REVISION."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PRODUCTION_URL/health does not report $REVISION: $body"
          exit 1

      - name: Roll back or report status
        if: steps.configured.outputs.ready == 'true' && env.ACTION != 'deploy'
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" "$ACTION" < /dev/null
