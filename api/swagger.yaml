            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Revoke an API key
      tags:
      - api-keys
    get:
      description: Fetch one API key owned by the authenticated user. Scoped to the
        caller's own keys — a key belonging to another user is rejected with 403,
        and there is no admin override. Neither the stored hash nor the plaintext
        key is ever returned; only the prefix, so a key can be identified without
