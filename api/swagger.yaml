info:
  contact: {}
  description: CRM API for managing users, leads, customers, tickets, tasks and API
    keys.
  title: GopherCRM API
  version: "1.0"
paths:
  /aeo/citations:
    get:
      description: 'Which sources the answers cite over the requested window: the
        owned-domain citation rate, the per-company citation and brand-mention rates
        (the brand first, then each competitor in profile order) and the twenty most
        cited domains, ordered by citation count descending. Windows are 7, 30 or
        90 days; anything else falls back to 30.'
      parameters:
      - default: 30
        description: Reporting window in days (7, 30 or 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Citation report retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitationsReport'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - Admin, sales or support role required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: The brand profile has not been configured yet
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Too many requests - rate limit exceeded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: AEO citation report
      tags:
      - aeo
  /aeo/dashboard:
    get:
      description: 'Aggregated visibility over the requested window: the overall percentage
        of non-error answers mentioning the brand, the same figure per provider, a
        daily timeline with one entry per day in range (days without answers are present
        with an overall of 0 and no per-provider entries), the share of voice across
        the brand and its competitors, and the competitor timeline. Windows are 7,
        30 or 90 days; anything else falls back to 30. The upper bound is exclusive
        and is the start of tomorrow in UTC.'
      parameters:
      - default: 30
        description: Reporting window in days (7, 30 or 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEODashboard'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - Admin, sales or support role required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
