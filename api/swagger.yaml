        type: integer
      description:
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TicketPriority'
        enum:
        - low
        - medium
        - high
        - urgent
      resolution:
        type: string
