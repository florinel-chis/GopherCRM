  internal_handler.UpdateTaskRequest:
    properties:
      assigned_to_id:
        type: integer
      customer_id:
        type: integer
      description:
        type: string
      due_date:
        type: string
      label_ids:
        description: |-
          LabelIDs is a POINTER so the two cases stay distinguishable: an absent
          field (nil) leaves the label set alone, while a present one — including an
          empty array — replaces it wholesale. When present it is capped at 100 ids,
          exactly as on create.
        items:
          type: integer
        maxItems: 100
        type: array
      lead_id:
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskPriority'
        enum:
        - low
        - medium
        - high
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskStatus'
        enum:
        - pending
        - in_progress
        - completed
        - cancelled
      title:
        type: string
    type: object
  internal_handler.UpdateTicketRequest:
    properties:
