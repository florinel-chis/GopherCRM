  /quotes/{id}/lines:
    post:
      consumes:
      - application/json
      description: 'Add a line priced from a product (admin and sales roles; sales
        users only their own quotes). The product must be live and active (400 INVALID_REFERENCE
        otherwise) and priced in the quote''s currency (400 VALIDATION_ERROR). The
        product''s name and price are copied onto the line unless description or unit_price_cents
        override them; a later change to the product never alters the line. quantity
        is 1 to 1000000, discount_bp 0 to 10000 (basis points: 1250 is 12.5%), unit_price_cents
        0 to 1000000000000; quantity × unit_price_cents and the resulting quote total
        may not exceed 1000000000000, and a quote holds at most 100 lines (all 400
        VALIDATION_ERROR, nothing written). One transaction: a locking read of the
        quote (FOR UPDATE on MySQL), the draft check, the insert, the totals recomputed
        from the lines and written WHERE status = ''draft''. A quote that is not a
        draft is a 409 CONFLICT.'
