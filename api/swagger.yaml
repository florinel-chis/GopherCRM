basePath: /api/v1
definitions:
  github_com_florinel-chis_gophercrm_internal_models.AEOAnswer:
    properties:
      answer_text:
        type: string
      attempt:
        type: integer
      brand_mentioned:
        type: boolean
      citations:
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitation'
        type: array
      competitor_mentions:
        additionalProperties:
          type: integer
        type: object
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      error:
        type: string
      first_mention_pos:
        description: |-
          FirstMentionPos is the rune index of the earliest brand hit, -1 when the
          brand is absent. It deliberately carries NO `default:-1` tag: GORM
          substitutes a literal column default whenever the Go field holds its zero
          value (callbacks.ConvertToCreateValues), so a brand named in the very
          first rune of an answer — a common case — would be persisted as -1.
          Writers must always set this field explicitly.
        type: integer
      id:
        type: integer
      latency_ms:
        type: integer
      model:
        type: string
      prompt_id:
        type: integer
      provider:
        type: string
