              type: object
      summary: Report whether public registration is open
      tags:
      - auth
  /automation/rules:
    get:
      description: 'One page of live (not deleted) rules with their steps. Roles:
        admin only. Filters: entity_type and enabled; an unknown entity_type or a
        non-boolean enabled is 400. sort_by must be one of the listed columns (anything
        else is 400). An absent sort_by sorts by created_at descending and then ignores
        sort_order; with a sort_by, sort_order is asc or desc and anything else means
        desc. Ties are broken by id in the same direction. Pagination: page (1-based)
        overrides offset when greater than 0; limit defaults to 20 and is clamped
        to 100; the checks run before any query, sort first.'
      parameters:
      - description: Page number (1-based); overrides offset when greater than 0
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; non-positive values fall back to 20, larger values
          are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Only rules of this entity type
        enum:
        - lead
        - deal
        in: query
        name: entity_type
        type: string
      - description: Only enabled (true) or disabled (false) rules; any value strconv.ParseBool
          accepts (1, t, TRUE, 0, f, ...)
        in: query
        name: enabled
        type: boolean
      - description: Sort column; created_at when absent, anything outside the list
          is 400
        enum:
        - id
        - name
        - entity_type
        - trigger_type
        - enabled
        - version
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction, honoured only with sort_by; anything else means
          desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of rules; meta carries page, per_page, total and total_pages
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationRule'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: BAD_REQUEST - sort_by is not an allowed column (message Invalid
            sort column), entity_type is not lead or deal, or enabled is not a boolean
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            invalid, expired or revoked credentials
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - admin role required (route guard)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: TOO_MANY_REQUESTS - per-IP rate limit for authenticated traffic
            exceeded; error.details.retry_after is 60s
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; details are logged, never
            returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List automation rules
      tags:
      - automation
    post:
      consumes:
      - application/json
      description: 'Create a follow-up automation rule with its ordered steps. Roles:
        admin only. entity_type is lead or deal; trigger_type is lead_created, lead_updated,
        lead_status_changed, deal_created, deal_updated, deal_stage_changed or schedule;
        trigger carries from/to for a status or stage change and hour_utc, filters
        and stale_days for a schedule. Steps are wait, condition, create_task, assign_owner,
        send_email and notify, numbered 1..n in the given order. Validation (nothing
        is written when it fails): name required, at most 200 characters; description
        at most 65535 bytes; an invalid trigger or step config, more than 20 steps,
        more than 90 days of waits, a backward or out-of-range else_position or an
        unknown placeholder is 400 INVALID_INPUT; an unknown, inactive or customer
        user id is 400 INVALID_REFERENCE when it is the first refusal. Every refused
        field is listed in error.details.fields as {field, code, message}: field is
        a path into the body (name, trigger.hour_utc, steps[i].config.title with i
        counted from zero), code one of required, too_long, line_break, invalid_value,
        out_of_range, not_applicable, unknown_placeholder, too_many, unknown_reference;
        error.message and error.code are those of the first refused field. An unknown
        entity_type stops the checks, an unknown trigger_type skips the trigger checks,
        and no steps or more than 20 skips the step checks. Defaults are stored: recipient
        owner, else stop. A new rule is version 1, records the caller as created_by_id,
        and is disabled unless enabled is true. Runs are started by the background
        worker, which matches each event against the rules that are enabled when it
        dispatches the event.'
      parameters:
      - description: The rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AutomationRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Rule created with its steps
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationRule'
              type: object
        "400":
          description: INVALID_INPUT - the rule body was refused (error.details.fields
            lists every refused field; error.message and error.code are those of the
            first); INVALID_REFERENCE - the same, when the first refusal is an unknown,
            deactivated or customer user_id; BAD_REQUEST (message Invalid request
            format) when the body is not valid JSON or a value has the wrong JSON
            type
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  allOf:
                  - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
                  - properties:
                      details:
                        $ref: '#/definitions/internal_handler.AutomationRuleErrorDetails'
                    type: object
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            invalid, expired or revoked credentials
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - admin role required (route guard)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: TOO_MANY_REQUESTS - per-IP rate limit for authenticated traffic
            exceeded; error.details.retry_after is 60s
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; details are logged, never
            returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Create an automation rule
      tags:
      - automation
