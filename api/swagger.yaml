  /customers/export:
    get:
      description: |-
        Download every customer matching the optional filters as a CSV file. ADMIN ROLE ONLY, and deliberately narrower than the list endpoint, which sales and support can also read: a single request here egresses the personal data of the entire customer base in a form that leaves the application, so the GDPR data-minimisation principle puts it out of reach of the roles that only need to work one record at a time.

        The response is NOT the utils.APIResponse envelope. It is the raw CSV body — Content-Type text/csv; charset=utf-8, Content-Disposition attachment; filename=customers-export.csv — because the client saves it as a file. Errors before the file starts are still reported through the ordinary JSON envelope.

        Columns, in order: id, first_name, last_name, email, phone, company, address, notes, assigned_to_id, created_at, updated_at. Timestamps are RFC3339. An unassigned customer exports an empty assigned_to_id cell. Fields that a spreadsheet would treat as a formula are prefixed with an apostrophe.

        The export is not paginated: every matching row is included. Soft-deleted (erased) customers are excluded.
      parameters:
      - description: Free-text search across first name, last name, email, company,
          phone and notes
        in: query
        name: search
        type: string
      - description: Sort column; ignored unless one of the allowed values
        enum:
        - created_at
        - updated_at
        - first_name
        - last_name
        - email
        - company
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; ignored unless sort_by is supplied
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV file of customers (raw body, not the API envelope)
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - Admin role required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Too many requests - rate limit exceeded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Export customers as CSV
      tags:
      - customers
  /dashboard/activities:
    get:
      description: 'Recent activity the caller may see, newest first, as a bare array.
        There is no activity or audit table in this schema, so entries are synthesised
        from the rows themselves: leads created (lead_created) and converted (lead_converted),
        tickets created (ticket_created) and resolved or closed (ticket_resolved),
        and tasks completed (task_completed). Each source is narrowed to the caller''s
        visibility inside its query, before its limit: lead events cover every lead
        for admin, only the caller''s own leads for sales and no lead at all for support;
        ticket events cover every ticket for admin and sales and only the tickets
        assigned to the caller for support; task events cover every task for admin
        and only the tasks assigned to the caller for every other role. Hidden records
        therefore never appear and never crowd out permitted ones. Each source contributes
        at most `limit` candidates; they are merged, sorted by event time descending
        (ties broken by type, then by record id descending) and truncated to `limit`.
        Events with no dedicated timestamp column use updated_at as the event time,
        so a later edit moves the entry. Each id is stable and of the form "lead-42-created".
        The user is the lead''s owner or the ticket''s or task''s assignee, with username
        carrying the account''s email address because there is no username column;
        when the record has no assignee the user object is present but zero-valued.
        Restricted to the admin, sales and support roles; customer-role callers receive
        403.'
      parameters:
      - default: 10
        description: Maximum entries to return, capped at 50
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Activity feed retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_handler.Activity'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - Admin, sales or support role required
