  /aeo/runs:
    get:
      description: |-
        One page of the run history with the trigger, status and query counters of each run.
        Pagination: offset (default 0) and limit (default 20, capped at 100; non-positive or unparseable values fall back to the default). meta carries page, per_page, total and total_pages.
        Sorting: sort_by is one of id, status, trigger, started_at, completed_at, created_at; any other value is answered with 400 BAD_REQUEST ("Invalid sort column: <value>"). sort_order is asc or desc; anything else means desc. Without sort_by the order is created_at descending whatever sort_order says. Ties are broken by id in the same direction.
        Roles: admin, sales, support.
      parameters:
      - default: 0
        description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Page size, capped at 100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 'Sort column (unknown value: 400)'
        enum:
        - id
        - status
        - trigger
        - started_at
        - completed_at
        - created_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction; ignored without sort_by
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
