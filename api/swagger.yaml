  /customers:
    get:
      description: |-
        Admin, sales and support (checked in the handler; customer gets 403). All three roles see the same unfiltered set of live customers; there is no ownership narrowing. data holds customers and total; meta repeats the pagination (page, per_page, total, total_pages, each omitted when 0). Without sort_by the rows come in ascending id order; with an allowed sort_by they are ordered by that column, then id, in the requested direction. search matches a substring (SQL LIKE) of first_name, last_name, email, company, phone or notes and combines with the sort. The embedded user (the customer's login) is loaded only for the default listing without search and sort_by.
        Pagination: limit defaults to 20 and is capped at 100 (a missing, non-numeric or non-positive value gives 20); offset defaults to 0; page, when a positive integer, overrides offset with (page - 1) * limit. An unknown sort_by is ignored rather than rejected.
      parameters:
      - description: 1-based page number; a positive value overrides offset
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of rows to skip, ignored when page is given
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; capped at 100, non-positive or invalid values give
          20
        in: query
        name: limit
        type: integer
      - description: Sort column; any other value is ignored (ascending id order)
        enum:
        - created_at
        - updated_at
        - first_name
        - last_name
        - email
        - company
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; any other value falls back to asc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Substring matched against first_name, last_name, email, company,
          phone and notes
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A page of customers
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.CustomerListResponse'
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
