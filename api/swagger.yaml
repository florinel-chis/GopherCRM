  /customers/{id}:
    delete:
      description: 'Admin only (route guard, repeated in the handler). A GDPR Article
        17 erasure, not an archive: in one transaction every personal field (names,
        email, phone, company, website, position, postal address, notes) is overwritten
        in place, the email becoming an unrelated random address in the reserved .invalid
        domain, and the row is soft-deleted so references from tickets, tasks and
        deals still resolve. The same person is erased everywhere in that transaction:
        every lead converted into the customer (with its linked form submissions scrubbed)
        and, when user_id names a customer-role account, that login (credentials purged)
        and its other customer records. A staff account in user_id, the account manager
        (assigned_to_id), company_id and deals are left as they are. Any failure before
        the commit rolls the whole erasure back. A failed COMMIT is the exception:
        its outcome is ambiguous (the erasure may have been applied), so read the
        record again before retrying.'
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Erased; no body
        "400":
          description: 'BAD_REQUEST: Invalid customer ID'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
