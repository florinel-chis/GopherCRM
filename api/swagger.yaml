  /customers/{id}/deals:
    get:
      description: |-
        One page of the live deals linked to the customer, newest first (created_at descending, then id), with their associations. Roles: admin (every deal) and sales (only the deals it owns; filtered in the query, so meta.total counts only those). Support and customer roles are refused. lead_id and lead appear only when the caller may see the linked lead (admins every lead, sales users the leads they own), decided on every read.
        data is the array of deals; meta carries request_id, page (offset / limit + 1, rounded down), per_page and, when not zero, total and total_pages (both are omitted for an empty result).
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      - description: 1-based page number; when greater than 0 it overrides offset
          (offset = (page-1) x limit). Non-numeric values are ignored
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of rows to skip; negative or non-numeric values fall back
          to 0
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; 0, negative or non-numeric values fall back to 20,
          values above 100 are clamped to 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: One page of deals
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
