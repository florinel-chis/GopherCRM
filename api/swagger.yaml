    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleSales
    - RoleSupport
    - RoleCustomer
  github_com_florinel-chis_gophercrm_internal_service.PublicFormDefinition:
    properties:
      challenge:
        description: |-
          Signed time-trap token minted for this response. Send it back unchanged
          as challenge with the submission; a submission sent less than 3 seconds
          or more than 24 hours after it was issued is filed as spam.
        example: MTc2MTgxNTYwMA.4e3b9a0c5d7f21e8b6a4c3d2f1e0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2
        type: string
      consent_text:
        description: |-
          Consent statement to show with a checkbox; when present the submission
          must carry consent=true. Omitted when the form has none.
        example: I agree to be contacted about my enquiry.
        type: string
      fields:
        description: |-
          Ordered field definitions; max_length is the limit the submission
          validator enforces. Always an array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormFieldDef'
        type: array
      honeypot_field:
        description: |-
          Name of the decoy input the renderer must include and hide from people;
          always "website_url_confirm". A non-empty value in the submission files
          it as spam.
        example: website_url_confirm
        type: string
      name:
        description: Form name, for the heading the renderer shows.
        example: Website contact form
        type: string
      public_id:
        description: Public identifier of the form (the {key} of the public URLs).
        example: q3VZr0n8TjK1bWcY5xL2aQ
        type: string
      recaptcha_site_key:
        description: |-
          reCAPTCHA v3 site key the renderer loads; present only when the form
          enables reCAPTCHA and the server has both keys configured.
        example: 6LcExampleSiteKey000000000000000000000000
        type: string
      submit_action:
        description: |-
          What to do after submitting: show a message or redirect. Defaults to
          message.
        enum:
        - message
        - redirect
        example: message
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_service.PublicSubmissionRequest:
    properties:
      captcha_token:
        description: |-
          reCAPTCHA v3 token; needed only when the definition carried
          recaptcha_site_key. Missing or failing tokens file the submission as
          spam.
        example: ""
        type: string
      challenge:
        description: |-
          The challenge from the definition response, unchanged. Required: a
          missing or blank one is 400 VALIDATION_ERROR.
        example: MTc2MTgxNTYwMA.4e3b9a0c5d7f21e8b6a4c3d2f1e0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2
        type: string
      consent:
        description: |-
          Whether the visitor accepted the consent text; must be true when the
          form has consent text, ignored otherwise.
        example: true
        type: boolean
      page_url:
        description: |-
          URL of the page the form was submitted from, stored as the submission's
          referrer (cut to 512 characters). Not verified.
        example: https://www.example.com/pricing
        type: string
      values:
        additionalProperties:
          type: string
        description: |-
          Submitted values keyed by field name. Only fields the definition
          declares are allowed; missing optional fields count as empty. Values are
          trimmed; checkbox values true, 1, on, yes or checked (any case) mean
          ticked, anything else unticked.
        type: object
      website_url_confirm:
        description: |-
          Honeypot input; must be absent or empty. A non-empty value files the
          submission as spam.
        example: ""
        type: string
    required:
    - challenge
    type: object
  github_com_florinel-chis_gophercrm_internal_service.RuleFieldError:
    description: One refused field of an automation rule body.
    properties:
      code:
        description: 'Why it was refused: required (missing or blank), too_long, line_break
          (a title or subject with a line break), invalid_value (not an allowed value),
          out_of_range (a number outside its bounds, or waits adding up to more than
          90 days), not_applicable (set where it does not apply), unknown_placeholder,
          too_many (more than 20 steps) or unknown_reference (an unknown, deactivated
          or customer user).'
        enum:
        - required
        - too_long
        - line_break
        - invalid_value
        - out_of_range
        - not_applicable
        - unknown_placeholder
        - too_many
        - unknown_reference
        example: required
        type: string
      field:
        description: 'Path of the refused field in the request body: name, description,
          entity_type, trigger_type, trigger.from, trigger.to, trigger.hour_utc, trigger.stale_days,
          trigger.filters, trigger.filters.status, trigger.filters.stage, steps, steps[i].step_type
          or steps[i].config.<name>, with i the zero-based index in the steps array.'
        example: steps[0].config.title
        type: string
      message:
        description: Human-readable explanation; it may quote the refused value.
        example: title is required
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_service.SubmitOutcome:
    properties:
      action:
        description: |-
          The form's submit action: show message in place, or redirect to
          redirect_url.
        enum:
        - message
        - redirect
        example: message
        type: string
      message:
        description: |-
          Text to show for the message action: the form's thank-you message, or a
          default ("check your inbox" for double opt-in forms). Omitted for the
          redirect action.
        example: Thank you. Your submission has been received.
        type: string
      pending_confirmation:
        description: |-
          True when the form uses double opt-in, so a confirmation mail has been
          sent (also reported for submissions filed as spam, which get no mail).
        example: false
        type: boolean
      redirect_url:
        description: Where to send the browser for the redirect action; omitted otherwise.
        example: https://www.example.com/thank-you
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_utils.APIError:
    description: Error object of a failed request. code is the stable value to branch
      on; message is for people and may change.
    properties:
      code:
        description: |-
          Stable machine-readable error code. Shared codes: VALIDATION_ERROR,
          BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT,
          TOO_MANY_REQUESTS, INTERNAL_ERROR, MAIL_DELIVERY_FAILED; operations
          document their own additional codes (for example INVALID_REFERENCE,
          SESSION_STALE, SESSION_REFRESH_UNAVAILABLE).
        example: VALIDATION_ERROR
        type: string
      details:
        description: |-
          Optional context; its JSON type depends on the code and the operation,
          so the schema leaves it open. Usually an object: a binding failure
          (VALIDATION_ERROR) maps each failed field to a message, keyed by the
          server-side Go field name (for example "Email", "FirstName"), not the
          JSON name; TOO_MANY_REQUESTS carries {"retry_after": "60s"}. Some
          operations send another shape (for example a plain string on POST
          /aeo/prompts/{id}/run with an invalid id) and document it; many errors
          omit it.
      message:
        description: 'Human-readable explanation. Not stable: do not parse it.'
        example: Validation failed
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_utils.APIMeta:
    description: Response metadata. request_id is always present; the pagination fields
      appear only on paginated list responses and, like every zero value here, are
      omitted when 0.
    properties:
      page:
        description: 1-based page number of this response (paginated lists only; omitted
          when 0).
        example: 1
        type: integer
      per_page:
        description: Page size used for this response (paginated lists only; omitted
          when 0).
        example: 20
        type: integer
      request_id:
        description: |-
          Correlation id of the request: the client's X-Request-ID header when
          sent, otherwise a server-generated UUID. Also returned in the
          X-Request-ID response header.
        example: 3b1f8c2e-6d4a-4f0e-9a51-2c7d9e8b1a40
        type: string
      total:
        description: |-
          Total number of matching records (paginated lists only; omitted when
          0, so an empty result carries no total).
        example: 57
        type: integer
      total_pages:
        description: Number of pages at per_page (paginated lists only; omitted when
          0).
        example: 3
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_utils.APIResponse:
    description: Envelope of every JSON response (the CSV export and the public form
      pages are the exceptions). success tells the outcome; data carries the payload
      on success, error the failure on error; meta is always present.
    properties:
      data:
        description: |-
          Operation-specific payload on success (each operation documents its
          shape). Absent on errors and on successes without a payload.
      error:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
        description: Failure details; present only when success is false.
      meta:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
        description: |-
          Request metadata, present on every enveloped response, with pagination
          fields on paginated lists.
      success:
        description: True for a 2xx response, false when error is set.
        example: true
        type: boolean
    type: object
  internal_handler.AEOCompetitorRequest:
    properties:
      aliases:
        description: |-
          Alternative spellings counted as mentions of this competitor: at most 20,
          each at most 120 characters. Trimmed, blanks dropped and de-duplicated
          case-insensitively on save.
        example:
        - Globex
        - Globex Corporation
        items:
          type: string
        maxItems: 20
        type: array
      domain:
        description: |-
          Competitor website, at most 255 characters. Any form is accepted
          ("https://www.Globex.example/about") and stored as a bare lower-case host
          without scheme, path or leading "www.".
        example: globex.example
        maxLength: 255
        type: string
      name:
        description: |-
          Competitor name; required, at most 120 characters. Trimmed on save; an
          entry whose name is only whitespace is silently dropped.
        example: Globex CRM
        maxLength: 120
        type: string
    required:
    - name
    type: object
  internal_handler.Activity:
    description: One entry of the recent-activity feed, synthesised from lead, ticket
      and task rows (there is no activity table).
    properties:
      created_at:
        description: 'Event time (RFC 3339): created_at for lead_created and ticket_created,
          otherwise the record''s updated_at, so a later edit moves the entry.'
        example: "2026-10-30T09:12:00Z"
        type: string
      description:
        description: For lead events "First Last (Company) was added as a lead" or
          "... was converted to a customer" (Unnamed lead when the names are empty);
          for ticket and task events the record's title.
        example: Ana Popescu (Acme SRL) was added as a lead
        type: string
      id:
        description: Stable id {entity}-{record id}-{event}, e.g. lead-42-created.
        example: lead-42-created
        type: string
      title:
        description: 'Fixed title per type: New lead, Lead converted, New ticket,
          Ticket resolved, Task completed.'
        example: New lead
        type: string
      type:
        description: Event kind.
        enum:
        - lead_created
        - lead_converted
        - ticket_created
        - ticket_resolved
        - task_completed
        example: lead_created
        type: string
      user:
        allOf:
        - $ref: '#/definitions/internal_handler.ActivityUser'
        description: The lead's owner or the ticket's or task's assignee.
    type: object
  internal_handler.ActivityUser:
    description: 'Account shown against an activity entry: the lead''s owner or the
      ticket''s or task''s assignee. Always present; every field is zero-valued (id
      0, empty strings) when the record has no such account.'
    properties:
      first_name:
        description: Given name; "" when there is no account.
        example: Sam
        type: string
      id:
        description: User id; 0 when there is no account.
        example: 7
        type: integer
      last_name:
        description: Family name; "" when there is no account.
        example: Seller
        type: string
      username:
        description: The account's email address (there is no username column); ""
          when there is no account.
        example: sam.sales@example.com
        type: string
    type: object
  internal_handler.AssignCustomerRequest:
    description: Body of POST /customers/{id}/assign.
    properties:
      user_id:
        description: |-
          ID of the new account manager: an existing, active admin or sales user.
          Required and non-zero.
        example: 7
        minimum: 1
        type: integer
    required:
    - user_id
    type: object
  internal_handler.AuthResponse:
    description: Session credentials returned by login, refresh and registration.
    properties:
      refresh_token:
        description: |-
          Opaque single-use refresh token (43 URL-safe base64 characters) for
          POST /auth/refresh, valid for REFRESH_TOKEN_EXPIRY_DAYS (30 days by
          default). Absent on registration, and on a login whose refresh token could
          not be stored (the login then succeeds with the access token only).
        example: Jx3k9QeV0m2b5sT8wY1zA4cD7fG0hJ3kL6nP9qR2tU5
        type: string
      token:
        description: |-
          Access token: an HS256-signed JWT (claims user_id, email, role, exp) valid
          for JWT_EXPIRY_HOURS (24 hours by default). Send it as
          `Authorization: Bearer <token>`. It cannot be revoked before it expires.
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjo0Mn0.c2lnbmF0dXJl
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: The authenticated account.
    type: object
  internal_handler.AutomationDraftDryRunRequest:
    description: 'Body of POST /automation/rules/dry-run: an unsaved rule and the
      record to simulate it against.'
    properties:
      entity_id:
        description: ID of the live lead or deal to simulate against (404 when it
          does not exist).
        example: 12
        minimum: 1
        type: integer
      entity_type:
        description: Kind of the record to simulate against; must match rule.entity_type
          (400 INVALID_INPUT otherwise).
        enum:
        - lead
        - deal
        example: lead
        type: string
      rule:
        allOf:
        - $ref: '#/definitions/internal_handler.AutomationRuleRequest'
        description: The unsaved rule body, as for POST /automation/rules (enabled
          is ignored).
    required:
    - entity_id
    - entity_type
    - rule
    type: object
  internal_handler.AutomationDryRunRequest:
    description: 'Body of POST /automation/rules/{id}/dry-run: the record to simulate
      the saved rule against.'
    properties:
      entity_id:
        description: ID of the live lead or deal to simulate against (404 when it
          does not exist).
        example: 12
        minimum: 1
        type: integer
      entity_type:
        description: Kind of the record to simulate against; must match the rule's
          entity_type (400 INVALID_INPUT otherwise).
        enum:
        - lead
        - deal
        example: lead
        type: string
    required:
    - entity_id
    - entity_type
    type: object
  internal_handler.AutomationRuleErrorDetails:
    description: error.details of a refused automation rule body.
    properties:
      fields:
        description: Every refused field, in the order the checks ran; each field
          appears once, with its first refusal.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_service.RuleFieldError'
        type: array
    type: object
  internal_handler.AutomationRuleRequest:
    description: Body of POST /automation/rules and PUT /automation/rules/{id}, and
      the rule of a draft dry run. Validated by the service (400 INVALID_INPUT or
      INVALID_REFERENCE with error.details.fields), not by binding rules.
    properties:
      description:
        description: Optional description, at most 65535 bytes.
        example: Creates a call-back task for every lead from the website.
        type: string
      enabled:
        description: Whether the rule starts runs. On create, absent or null means
          false; on update, absent or null keeps the stored value. Ignored by the
          draft dry run.
        example: true
        type: boolean
      entity_type:
        description: Kind of record the rule runs on. Required; any other value is
          refused (invalid_value) and stops the remaining checks.
        enum:
        - lead
        - deal
        example: lead
        type: string
      name:
        description: 'Rule name. Required: trimmed, 1 to 200 characters (refused with
          required or too_long).'
        example: Welcome new web leads
        maxLength: 200
        type: string
      steps:
        description: The ordered steps, 1 to 20; they are numbered 1..n in this order.
          Missing or more than 20 skips the per-step checks.
        items:
          $ref: '#/definitions/internal_handler.AutomationStepRequest'
        maxItems: 20
        minItems: 1
        type: array
      trigger:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationTrigger'
        description: 'Trigger configuration: from and to for a status or stage change,
          hour_utc, filters and stale_days for a schedule.'
      trigger_type:
        description: What starts a run. Required. Lead rules take lead_created, lead_updated,
          lead_status_changed or schedule; deal rules deal_created, deal_updated,
          deal_stage_changed or schedule (anything else is invalid_value and skips
          the trigger checks).
        enum:
        - lead_created
        - lead_updated
        - lead_status_changed
        - deal_created
        - deal_updated
        - deal_stage_changed
        - schedule
        example: lead_created
        type: string
    required:
    - entity_type
    - name
    - steps
    - trigger_type
    type: object
  internal_handler.AutomationStepRequest:
    description: One step of an automation rule body.
    properties:
      config:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationStepConfig'
        description: The step configuration; only the fields of the step type apply,
          and a field set where it does not apply may be refused (not_applicable).
      step_type:
        description: What the step does; see models.AutomationStepConfig for the fields
          each type takes. An unknown type is refused (invalid_value).
        enum:
        - wait
        - condition
        - create_task
        - assign_owner
        - send_email
        - notify
        example: create_task
        type: string
    type: object
  internal_handler.BulkLeadStatusRequest:
    description: Body of POST /leads/bulk/status.
    properties:
      lead_ids:
        description: IDs of the leads to update, 1 to 100, each positive. A repeated
          id is updated once.
        example:
        - 12
        - 15
        - 19
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
      status:
        description: 'The status to set on every listed lead. converted passes the
          binding but is always refused (400 VALIDATION_ERROR, details.field status),
          so it is not listed among the accepted values: conversion goes through POST
          /leads/{id}/convert.'
        enum:
        - new
        - contacted
        - qualified
        - unqualified
        example: contacted
        type: string
    required:
    - lead_ids
    - status
    type: object
  internal_handler.BulkTaskStatusRequest:
    description: Body of POST /tasks/bulk/status.
    properties:
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskStatus'
        description: The status to set on every listed task. A completed task cannot
          be moved to another status.
        enum:
        - pending
        - in_progress
        - completed
        - cancelled
        example: completed
      task_ids:
        description: IDs of the tasks to update, 1 to 100, each positive. A repeated
          id is updated once.
        example:
        - 4
        - 9
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - status
    - task_ids
    type: object
  internal_handler.BulkTicketStatusRequest:
    description: Body of POST /tickets/bulk/status.
    properties:
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TicketStatus'
        description: The status to set on every listed ticket. A closed ticket cannot
          be moved to another status.
        enum:
        - open
        - in_progress
        - resolved
        - closed
        example: resolved
      ticket_ids:
        description: IDs of the tickets to update, 1 to 100, each positive. A repeated
          id is updated once.
        example:
        - 18
        - 21
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - status
    - ticket_ids
    type: object
  internal_handler.ChangePasswordRequest:
    description: Body of POST /auth/change-password.
    properties:
      current_password:
        description: The account's current password; a wrong value is a 400.
        example: Str0ng!Passw0rd
        type: string
      new_password:
        description: |-
          New password: at least 10 characters with an uppercase letter, a
          lowercase letter, a digit and a special character. More than 72 bytes
          fails with 500 (bcrypt limit).
        example: N3w!Passw0rd2026
        minLength: 10
        type: string
      refresh_token:
        description: |-
          Optional: the caller's current refresh token. With bearer
          authentication it renews that session (the response then carries new
          credentials); it must be a live refresh token of the caller or the
          request fails with 409 SESSION_STALE. Ignored for API-key requests.
        example: Jx3k9QeV0m2b5sT8wY1zA4cD7fG0hJ3kL6nP9qR2tU5
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_handler.ChangePasswordResponse:
    description: Result of POST /auth/change-password. token, refresh_token and user
      are present only when the current session was renewed.
    properties:
      message:
        description: Confirmation text, always "Password changed successfully".
        example: Password changed successfully
        type: string
      refresh_token:
        description: Replacement refresh token; present only when the session was
          renewed.
        example: Vb7n1Mq4We8rT2yU6iO0pA3sD9fG5hJ1kL4zX7cV0bN
        type: string
      token:
        description: Replacement access token (JWT); present only when the session
          was renewed.
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjo0Mn0.c2lnbmF0dXJl
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: The account; present only when the session was renewed.
    type: object
  internal_handler.ChartData:
    description: 'Chart payload of the distribution and time-series widgets: category
      labels and a single dataset of counts.'
    properties:
      datasets:
        description: Exactly one dataset whose data is index-aligned with labels;
          never null.
        items:
          $ref: '#/definitions/internal_handler.ChartDataset'
        type: array
      labels:
        description: Category labels (statuses, priorities or time buckets) in display
          order; never null.
        example:
        - new
        - contacted
        - qualified
        - unqualified
        - converted
        items:
          type: string
        type: array
    type: object
  internal_handler.ChartDataset:
    description: 'One series of a chart: a label and one count per chart label.'
    properties:
      data:
        description: Counts, index-aligned with the chart's labels; never null.
        example:
        - 12
        - 30
        - 9
        - 4
        - 20
        items:
          type: integer
        type: array
      label:
        description: 'Series name, fixed per endpoint: Leads, Tickets, Tasks or Conversions.'
        example: Leads
        type: string
    type: object
  internal_handler.CompanyRequest:
    properties:
      address:
        description: Street address, at most 255 characters.
        example: 1 Industrial Way
        maxLength: 255
        type: string
      city:
        description: City, at most 100 characters.
        example: Springfield
        maxLength: 100
        type: string
      country:
        description: Country, at most 100 characters.
        example: USA
        maxLength: 100
        type: string
      domain:
        description: |-
          Domain or URL; stored normalised (lower case, scheme, path, query,
          fragment, a leading "www." and a trailing dot removed). What remains
          may hold only letters, digits, dots and hyphens (400 otherwise) and
          must not be used by another live company (409). At most 255
          characters as sent. Absent or empty clears it on update.
        example: https://www.acme.com/about
        maxLength: 255
        type: string
      employee_range:
        description: Head-count band; absent or empty stores no band.
        enum:
        - 1-10
        - 11-50
        - 51-200
        - 201-500
        - 501-1000
        - 1000+
        example: 51-200
        type: string
      industry:
        description: Industry, at most 100 characters.
        example: Manufacturing
        maxLength: 100
        type: string
      name:
        description: |-
          Company name, required; trimmed, it must not be empty. At most 200
          characters.
        example: Acme Corporation
        maxLength: 200
        type: string
      notes:
        description: Free-text notes, at most 65535 bytes (UTF-8 bytes, not characters).
        example: Key account; renewal in Q3.
        type: string
      owner_id:
        description: |-
          Account manager. Create: a sales user may send only its own id and
          gets itself when it is absent or 0; an admin may name any user, or
          leave the company unowned. Update: absent keeps the owner, 0 clears it
          (admin only), another id sets it (sales: its own id only). An id that
          names no live user is 400 INVALID_REFERENCE.
        example: 7
        type: integer
      phone:
        description: Phone number, at most 50 characters.
        example: +1 555 0100
        maxLength: 50
        type: string
      postal_code:
        description: Postal code, at most 20 characters.
        example: "62701"
        maxLength: 20
        type: string
      state:
        description: State or region, at most 100 characters.
        example: IL
        maxLength: 100
        type: string
      website:
        description: |-
          Website: an http or https URL with a host, trimmed (400 otherwise). At
          most 255 characters. Absent or empty clears it on update.
        example: https://www.acme.com
        maxLength: 255
        type: string
    required:
    - name
    type: object
  internal_handler.ConfigurationListResponse:
    description: A list of configuration entries.
    properties:
      configurations:
        description: The entries, never null (an empty list is []).
        items:
          $ref: '#/definitions/internal_handler.ConfigurationResponse'
        type: array
    type: object
  internal_handler.ConfigurationResponse:
    description: A configuration entry as the API returns it. A sensitive entry (is_sensitive)
      always carries an empty value; is_set tells whether one is stored.
    properties:
      category:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.ConfigurationCategory'
        description: Category the entry is listed under. Seeded, read-only.
        example: security
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      default_value:
        description: |-
          Value that POST /configurations/{key}/reset restores, in the same text
          form as value. Empty for sensitive entries. Seeded, read-only.
        example: "false"
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: Human-readable explanation of the setting. Seeded, read-only.
        example: Whether the public /auth/register endpoint accepts new sign-ups
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      is_read_only:
        description: |-
          True when the entry cannot be changed through the API: PUT and reset
          answer 400. The synthetic entries of GET /configurations/ui carry true.
          Seeded, read-only.
        example: false
        type: boolean
      is_sensitive:
        description: |-
          True for a secret (the AEO provider API keys). The value is encrypted at
          rest, read back only through the service's GetSecret and never included
          in an API response: reads report whether it is set (is_set), not what it
          is. Seeded, read-only.
        example: false
        type: boolean
      is_set:
        description: |-
          Whether the entry currently holds a non-empty value, computed before
          masking. For a sensitive entry it is the only evidence of its content.
          Read-only.
        example: true
        readOnly: true
        type: boolean
      is_system:
        description: |-
          Marks an entry the application itself seeds and relies on.
          Informational: the API has no delete operation. Seeded, read-only.
        example: true
        type: boolean
      key:
        description: |-
          Unique dotted key, "<category>.<name>". Seeded by the server; the API
          cannot create, rename or delete entries. Read-only.
        example: security.allow_public_registration
        readOnly: true
        type: string
      type:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.ConfigurationType'
        description: Declared type of the value. Seeded, read-only.
        example: boolean
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      valid_values:
        description: |-
          JSON array text listing the allowed values, or "" for no constraint. For
          an array entry every element must be listed. A list that does not parse
          as JSON imposes no constraint. Seeded, read-only.
        example: '[1, 8, 24, 48, 72, 168]'
        type: string
      value:
        description: |-
          Current value in its stored text form: "true"/"false" for boolean, a
          decimal for integer, JSON text for float, json and array, the raw text for
          string. Always "" for a sensitive entry in API responses (see is_set).
        example: "false"
        type: string
    type: object
  internal_handler.ConvertLeadRequest:
    properties:
      address:
        description: Postal address stored on the new customer.
        example: 12 St James's Square, London
        type: string
      company_name:
        description: |-
          Company name for the new customer; empty or absent takes the lead's
          free-text company.
        example: Analytical Engines Ltd
        type: string
      notes:
        description: |-
          Notes stored on the new customer. Required (not blank) when the
          leads.conversion.require_notes setting is on: 400 VALIDATION_ERROR
          with details.field "notes".
        example: Converted after the pilot.
        type: string
      website:
        description: |-
          Website stored on the new customer: trimmed, at most 255 characters,
          an http or https URL with a host (400 BAD_REQUEST otherwise). May be
          empty.
        example: https://engines.example.com
        type: string
    type: object
  internal_handler.CreateAEOPromptsRequest:
    properties:
      prompts:
        description: |-
          Prompt texts to track: 1 to 25 entries, each non-empty and at most 500
          characters. Entries are trimmed; a whitespace-only entry, a repeat within
          the request (case-insensitive) or a text matching a live prompt rejects
          the whole batch.
        example:
        - What is the best self-hosted CRM for a small sales team?
        - Which CRM tools support embeddable lead-capture forms?
        items:
          type: string
        maxItems: 25
        minItems: 1
        type: array
    required:
    - prompts
    type: object
  internal_handler.CreateAPIKeyRequest:
    description: Body of POST /api-keys.
    properties:
      expires_at:
        description: |-
          Optional expiry as an RFC 3339 timestamp, which must lie in the future.
          Omitted or empty: the key never expires.
        example: "2026-12-31T23:59:59Z"
        format: date-time
        type: string
      name:
        description: Label for the key, 3 to 100 characters. Names need not be unique.
        example: CI pipeline
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  internal_handler.CreateAPIKeyResponse:
    description: 'Result of POST /api-keys: the plaintext key, shown only this once,
      and the stored record.'
    properties:
      api_key:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.APIKey'
        description: The stored key record (prefix, expiry, active flag).
      key:
        description: |-
          The plaintext key: gcrm_ followed by 64 hexadecimal characters. Returned
          only here; store it now, it cannot be retrieved later.
        example: gcrm_3f9a1c2b7d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8
        type: string
    type: object
  internal_handler.CreateCustomerRequest:
    description: Body of POST /customers. Text fields other than the names and email
      are optional free text.
    properties:
      address:
        description: Street address.
        example: Strada Exemplu 1
        type: string
      city:
        description: City.
        example: Cluj-Napoca
        type: string
      company:
        description: Free-text company name; independent of company_id.
        example: Acme SRL
        type: string
      company_id:
        description: |-
          Optional link to a live company record; 0 or absent means no link. An id
          matching no live company is 400 INVALID_REFERENCE.
        example: 3
        type: integer
      country:
        description: Country, free text.
        example: Romania
        type: string
      email:
        description: |-
          Email address; required, valid, and not used by any customer, erased
          ones included (409).
        example: ana.popescu@example.com
        format: email
        type: string
      first_name:
        description: Given name; required, non-empty.
        example: Ana
        type: string
      last_name:
        description: Family name; required, non-empty.
        example: Popescu
        type: string
      notes:
        description: Free-text notes.
        example: Met at the trade fair.
        type: string
      phone:
        description: Phone number, free text.
        example: +40 721 000 000
        type: string
      position:
        description: Job title.
        example: Purchasing manager
        type: string
      postal_code:
        description: Postal code.
        example: "400000"
        type: string
      state:
        description: State, county or region.
        example: Cluj
        type: string
      website:
        description: |-
          Optional web site: an absolute http or https URL with a host, at most 255
          characters after trimming.
        example: https://acme.example
        maxLength: 255
        type: string
    required:
    - email
    - first_name
    - last_name
    type: object
  internal_handler.CreateFormRequest:
    properties:
      allowed_domains:
        description: |-
          Origin allowlist of bare host names with optional port (no scheme, no
          path), lower-cased on save; empty allows every origin. At most 20, each
          at most 255 characters.
        example:
        - www.example.com
        items:
          type: string
        maxItems: 20
        type: array
      captcha_enabled:
        description: |-
          Require a reCAPTCHA v3 token; ignored unless the server has both
          reCAPTCHA keys.
        example: false
        type: boolean
      confirmation_body:
        description: |-
          Confirmation mail body (plain text) with an optional {confirmation_link}
          placeholder; the link is appended when the placeholder is missing.
        example: 'Hello, please confirm your address: {confirmation_link}'
        type: string
      confirmation_subject:
        description: |-
          Confirmation mail subject, at most 255 characters; empty means a
          built-in subject.
        example: Please confirm your email address
        maxLength: 255
        type: string
      consent_text:
        description: |-
          Consent statement; when non-empty every submission must carry
          consent=true.
        example: I agree to be contacted about my enquiry.
        type: string
      content_url:
        description: Link substituted for {content_link}, at most 512 characters.
        example: https://www.example.com/files/guide.pdf
        maxLength: 512
        type: string
      create_lead:
        description: |-
          Feed accepted submissions into leads. Absent means true; send false
          explicitly to turn it off.
        example: true
        type: boolean
      default_owner_id:
        description: |-
          Owner of created leads; 0 means none. Must be non-zero when create_lead
          is true or absent, and any non-zero value must name an existing, active
          admin or sales user.
        example: 2
        type: integer
      description:
        description: Internal description for staff; never shown publicly.
        example: Contact form on the pricing page.
        type: string
      double_opt_in:
        description: |-
          Enable double opt-in (confirmation mail with a 48-hour single-use link
          before the submission counts).
        example: false
        type: boolean
      fields:
        description: |-
          Ordered field definitions, 1 to 50. Exactly one field of type email,
          named "email"; names unique and matching ^[a-z][a-z0-9_]{0,49}$; select
          fields need 1 to 50 non-blank options and only select fields may have
          options; hidden fields cannot be required.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormFieldDef'
        maxItems: 50
        minItems: 1
        type: array
      follow_up_body:
        description: |-
          Follow-up mail body (plain text); {content_link} is replaced by
          content_url. Empty means a built-in text.
        example: 'Download the guide here: {content_link}'
        type: string
      follow_up_subject:
        description: |-
          Follow-up mail subject, at most 255 characters; empty disables the
          follow-up mail.
        example: Your download link
        maxLength: 255
        type: string
      name:
        description: Form name; required, at most 255 characters, not blank once trimmed.
        example: Website contact form
        maxLength: 255
        type: string
      notify_emails:
        description: |-
          Staff addresses notified of each accepted submission: at most 20, each
          at most 255 characters and shaped like an email address (trimmed).
        example:
        - sales@example.com
        items:
          type: string
        maxItems: 20
        type: array
      redirect_url:
        description: |-
          Target page when submit_action is redirect: required then and must
          start with http:// or https:// (trimmed). At most 512 characters.
        example: https://www.example.com/thank-you
        maxLength: 512
        type: string
      status:
        description: |-
          Publication state; absent or empty means draft. Only published forms are
          served publicly.
        enum:
        - draft
        - published
        - archived
        example: published
        type: string
      submit_action:
        description: message (default when absent or empty) or redirect.
        enum:
        - message
        - redirect
        example: message
        type: string
      thank_you_message:
        description: |-
          Message shown after submitting when submit_action is message; empty
          means a built-in text.
        example: Thanks, we will be in touch within one business day.
        type: string
    required:
    - fields
    - name
    type: object
  internal_handler.CreateLabelRequest:
    description: Body of POST /labels.
    properties:
      color:
        description: 'Colour as #RRGGBB: a hash and exactly six hex digits (the three-digit
          shorthand is refused).'
        example: '#FF8800'
        type: string
      name:
        description: Display name, 1 to 50 characters. Trimmed before it is stored;
          blank after trimming is 400. Must be unique case-insensitively (409).
        example: Follow-up
        maxLength: 50
        type: string
    required:
    - color
    - name
    type: object
  internal_handler.CreateLeadRequest:
    properties:
      classification:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.LeadClassification'
        description: Classification; unclassified when omitted.
        enum:
        - unclassified
        - test
        - spam
        - lead
        - hot_lead
        example: unclassified
      company:
        description: Free-text employer name, independent of company_id.
        example: Analytical Engines Ltd
        type: string
      company_id:
        description: |-
          Company record to link; 0 or absent means no link. An id that names
          no live company is 400 INVALID_REFERENCE.
        example: 12
        type: integer
      created_at:
        description: |-
          Original creation time for imports. Accepted layouts: RFC 3339,
          2006-01-02T15:04:05Z, "2006-01-02 15:04:05" (UTC) and 2006-01-02. A
          value in no accepted layout is ignored silently and the current time
          is used.
        example: "2025-03-14T09:26:53Z"
        type: string
      email:
        description: |-
          Email address, validated when present. Either email or a non-blank
          phone is required.
        example: ada@example.com
        format: email
        type: string
      external_id:
        description: Identifier in an external system, for imports.
        example: crm-legacy-1042
        type: string
      first_name:
        description: |-
          Given name. Required, any non-empty string (100-character column, not
          checked by the API).
        example: Ada
        type: string
      last_name:
        description: |-
          Family name. Required, any non-empty string (100-character column, not
          checked by the API).
        example: Lovelace
        type: string
      notes:
        description: |-
          Free-text notes, at most 65535 bytes (UTF-8 bytes; a longer value is
          400 BAD_REQUEST).
        example: Met at the trade fair.
        type: string
      owner_id:
        description: |-
          Owner of the lead. Required for admins (400 without it); a sales user
          may omit it (the lead is then its own) or send its own id, any other id
          is 403. Not checked against the users table by the handler.
        example: 7
        type: integer
      phone:
        description: Phone number, free text. Either a non-blank phone or email is
          required.
        example: +44 20 7946 0000
        type: string
      position:
        description: Job title.
        example: CTO
        type: string
      source:
        description: Where the lead came from.
        example: website
        type: string
      status:
        description: |-
          Initial status; new when omitted. converted passes the binding but is
          refused with 400 VALIDATION_ERROR (details.field "status"), so it is
          not listed among the accepted values: only POST /leads/{id}/convert
          converts a lead.
        enum:
        - new
        - contacted
        - qualified
        - unqualified
        example: new
        type: string
    required:
    - first_name
    - last_name
    type: object
  internal_handler.CreateTaskRequest:
    description: Body of POST /tasks.
    properties:
      assigned_to_id:
        description: ID of the user to assign the task to. Required (non-zero). Non-admin
          callers must send their own user id; admins may name any active user.
        example: 7
        type: integer
      customer_id:
        description: ID of a customer to link. The customer must exist, otherwise
          404. Cannot be combined with lead_id.
        example: 3
        type: integer
      description:
        description: Free-text details.
        example: Customer asked for a quote on the 50-seat plan.
        type: string
      due_date:
        description: Due date and time (RFC 3339). Optional.
        example: "2026-11-05T09:00:00Z"
        type: string
      label_ids:
        description: |-
          IDs of existing labels to attach, at most 100, each positive (the cap
          bounds the IN clause a single request can produce). Absent or empty means
          no labels; a repeated id is attached once; an id that matches no label
          rejects the whole request with 400 INVALID_REFERENCE.
        example:
        - 1
        - 4
        items:
          type: integer
        maxItems: 100
        type: array
      lead_id:
        description: ID of a lead to link. The lead must exist and be visible to the
          caller (admins any lead, sales users only the leads they own, every other
          role none), otherwise 404. Cannot be combined with customer_id.
        example: 12
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskPriority'
        description: Priority; medium when omitted or empty.
        enum:
        - low
        - medium
        - high
        example: high
      title:
        description: Short summary of the task. Required (non-empty). Not length-checked
          by the API; the column is 255 characters wide.
        example: Call back about the renewal
        type: string
    required:
    - assigned_to_id
    - title
    type: object
  internal_handler.CreateTicketCommentRequest:
    description: Body of POST /tickets/{id}/comments. The text may come in body, comment
      or content.
    properties:
      body:
        description: The comment text. The first of body, comment and content that
          is not blank after trimming is stored (trimmed); all three blank is 400.
        example: Rolled back the firmware; waiting for the customer to confirm.
        type: string
      comment:
        description: Alias of body, used only when body is blank.
        example: ""
        type: string
      content:
        description: Alias of body, used only when body and comment are blank.
        example: ""
        type: string
      is_internal:
        description: True for an internal note, visible to staff only and never returned
          to customer callers. Defaults to false.
        example: false
        type: boolean
    type: object
  internal_handler.CreateTicketRequest:
    description: Body of POST /tickets.
    properties:
      assigned_to_id:
        description: ID of the support or admin user to assign. Omitted or null assigns
          the caller. An unknown user or a user of another role is 400.
        example: 5
        type: integer
      customer_id:
        description: ID of the customer the ticket is for. Required (non-zero); an
          unknown customer is 404.
        example: 3
        type: integer
      description:
        description: Full description of the problem. Required (non-empty).
        example: Since this morning the office printer no longer appears on the network.
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TicketPriority'
        description: Priority; medium when omitted or empty.
        enum:
        - low
        - medium
        - high
        - urgent
        example: high
      title:
        description: Short summary. Required (non-empty). Not length-checked by the
          API; the column is 255 characters wide.
        example: Printer offline after firmware update
        type: string
    required:
    - customer_id
    - description
    - title
    type: object
  internal_handler.CreateUserRequest:
    description: Body of POST /users (admin). Unlike public registration, the requested
      role is honoured.
    properties:
      email:
        description: Login email address; must be valid and not used by any account
          (409).
        example: sam.sales@example.com
        format: email
        type: string
      first_name:
        description: Given name; required, non-empty.
        example: Sam
        type: string
      last_name:
        description: Family name; required, non-empty.
        example: Seller
        type: string
      password:
        description: |-
          Initial password: at least 10 characters with an uppercase letter, a
          lowercase letter, a digit and a special character. More than 72 bytes is
          answered with 400 (bcrypt limit).
        example: Str0ng!Passw0rd
        minLength: 10
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.UserRole'
        description: Role of the new account; required, one of admin, sales, support,
          customer.
        enum:
        - admin
        - sales
        - support
        - customer
        example: sales
    required:
    - email
    - first_name
    - last_name
    - password
    - role
    type: object
  internal_handler.CustomerListResponse:
    description: A page of customers.
    properties:
      customers:
        description: The customers of this page, never null.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Customer'
        type: array
      total:
        description: |-
          Total number of customers matching the query, across all pages (also
          in meta.total, where it is omitted when 0).
        example: 57
        type: integer
    type: object
  internal_handler.DashboardStats:
    description: System-wide counters of the dashboard; never narrowed to the caller.
    properties:
      conversion_rate:
        description: |-
          total_customers / total_leads * 100 as an unrounded percentage, 0 when
          there are no leads. Customers created directly count too, so it can
          exceed 100.
        example: 37.5
        type: number
      open_tickets:
        description: Number of tickets whose status is open or in_progress.
        example: 8
        type: integer
      pending_tasks:
        description: Number of tasks whose status is pending or in_progress.
        example: 17
        type: integer
      total_customers:
        description: Number of live customers.
        example: 45
        type: integer
      total_leads:
        description: Number of live leads, every status included.
        example: 120
        type: integer
    type: object
  internal_handler.DealRequest:
    properties:
      amount_cents:
        description: |-
          Value in minor units (cents for EUR), 0 to 1000000000000. Absent means
          0, on update as well.
        example: 1250000
        maximum: 1000000000000
        minimum: 0
        type: integer
      company_id:
        description: |-
          Company link: absent keeps it (none on create), 0 clears it, another
          id must name a live company (400 INVALID_REFERENCE).
        example: 12
        type: integer
      currency:
        description: |-
          ISO 4217 code, exactly three upper-case ASCII letters. Create: the
          deals.default_currency setting (EUR as shipped) when absent. Update:
          absent keeps the stored code.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      customer_id:
        description: |-
          Customer link: absent keeps it (none on create), 0 clears it, another
          id must name a live customer (400 INVALID_REFERENCE).
        example: 31
        type: integer
      expected_close_date:
        description: |-
          Calendar date YYYY-MM-DD (400 BAD_REQUEST for any other form). Absent
          or empty clears it, on update as well.
        example: "2026-12-31"
        format: date
        type: string
      lead_id:
        description: |-
          Lead link: absent keeps it (none on create), 0 clears it, another id
          must name a live lead the caller may see (admins any lead, sales users
          the leads they own); a hidden lead is the same 400 INVALID_REFERENCE as
          a missing one. A sent id is always checked, even when it equals the
          stored link.
        example: 55
        type: integer
      lost_reason:
        description: |-
          Reason for losing, at most 255 characters (trimmed when the stage
          changes); stored only when the resulting stage is lost and cleared
          otherwise. Absent on update clears it.
        example: Budget cut
        maxLength: 255
        type: string
      notes:
        description: |-
          Free-text notes, at most 65535 bytes (UTF-8 bytes, not characters).
          Absent on update clears them.
        example: Decision expected after the board meeting.
        type: string
      owner_id:
        description: |-
          Owner, at least 1. Create: the caller when absent. Update: absent keeps
          the owner. A sales user may only send its own id (403 otherwise); an
          admin may name any live user (400 INVALID_REFERENCE otherwise).
        example: 7
        minimum: 1
        type: integer
      probability:
        description: |-
          Win probability in percent, 0 to 100. When the deal enters a stage and
          this is absent, the stage's default applies (10, 40, 70); won is
          always 100 and lost always 0 whatever is sent. On an update that keeps
          the stage, absent keeps the stored probability.
        example: 40
        maximum: 100
        minimum: 0
        type: integer
      source:
        description: |-
          Where the deal came from, at most 100 characters. Absent on update
          clears it.
        example: referral
        maxLength: 100
        type: string
      stage:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
        description: |-
          Stage. Create: qualification when absent. Update: absent keeps the
          stored stage; a different stage is a stage change with the rules of
          POST /deals/{id}/stage.
        enum:
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        example: proposal
      title:
        description: |-
          Deal title, required; trimmed, it must not be empty. At most 200
          characters.
        example: Acme rollout 2027
        maxLength: 200
        type: string
    required:
    - title
    type: object
  internal_handler.DealStageRequest:
    properties:
      lost_reason:
        description: |-
          Reason for losing, at most 255 characters, trimmed. Used only when the
          target stage is lost; absent keeps the reason already stored. Any other
          target stage clears the reason.
        example: Chose a competitor
        maxLength: 255
        type: string
      probability:
        description: |-
          Win probability in percent, 0 to 100; absent takes the new stage's
          default (10, 40, 70). Ignored for won (always 100) and lost (always 0).
        example: 70
        maximum: 100
        minimum: 0
        type: integer
      stage:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
        description: Target stage. Required.
        enum:
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        example: won
    required:
    - stage
    type: object
  internal_handler.FormListItem:
    properties:
      allowed_domains:
        description: |-
          Origin allowlist: bare host names with an optional port, lower-cased,
          matched exactly (subdomains must be listed one by one). Empty allows
          every origin. A definition requested from another origin is a 404; a
          submission from another origin is stored as spam (reason domain). At
          most 20, each at most 255 characters. Reads return [] when there are
          none; the POST /forms and PUT /forms/{id} responses echo the request and
          carry null when the list was omitted or sent as null.
        example:
        - www.example.com
        - localhost:5173
        items:
          type: string
        type: array
        x-nullable: true
      captcha_enabled:
        description: |-
          Require a reCAPTCHA v3 token with each submission. Takes effect only
          when the server has both reCAPTCHA keys; otherwise it is ignored.
        example: false
        type: boolean
      confirmation_body:
        description: |-
          Plain-text body of the confirmation mail. The {confirmation_link}
          placeholder is replaced by the link, which is appended when the
          placeholder is missing; empty means a built-in text.
        example: 'Hello, please confirm your address: {confirmation_link}'
        type: string
      confirmation_subject:
        description: |-
          Subject of the confirmation mail, at most 255 characters; empty means
          "Confirm your email address".
        example: Please confirm your email address
        maxLength: 255
        type: string
      consent_text:
        description: |-
          Consent statement shown with the form. When non-empty, a submission must
          carry consent=true or it is rejected with a field error on "consent".
        example: I agree to be contacted about my enquiry.
        type: string
      content_url:
        description: |-
          Link inserted for {content_link} in the follow-up mail (for gated
          content). At most 512 characters; not checked for a scheme.
        example: https://www.example.com/files/guide.pdf
        maxLength: 512
        type: string
      create_lead:
        description: |-
          Whether an accepted submission feeds a lead: the newest live lead with
          the same address gains a note, otherwise a new lead (status new, owner
          default_owner_id, source the form name) is created.
        example: true
        type: boolean
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      created_by_id:
        description: ID of the user who created the form; server-assigned and immutable.
        example: 1
        readOnly: true
        type: integer
      default_owner_id:
        description: |-
          Owner of the leads the form creates; 0 means none. Required when
          create_lead is true; any non-zero value names an active admin or sales
          user (checked on save only).
        example: 2
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: Internal description for staff; never exposed by the public endpoints.
        example: Contact form on the pricing page.
        type: string
      double_opt_in:
        description: |-
          Double opt-in: a submission is stored as pending and a confirmation
          mail with a single-use link valid for 48 hours goes to the submitted
          address; the lead, the notification and the follow-up mail wait until
          the link is confirmed.
        example: false
        type: boolean
      fields:
        description: |-
          Ordered field definitions (1 to 50), normalised on save (names trimmed,
          max_length defaulted and clamped).
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormFieldDef'
        type: array
      follow_up_body:
        description: |-
          Plain-text body of the follow-up mail; {content_link} is replaced by
          content_url. Empty means a built-in text containing the link.
        example: 'Thanks for your interest. Download the guide here: {content_link}'
        type: string
      follow_up_subject:
        description: |-
          Subject of the follow-up mail sent to the submitter once the submission
          is accepted; empty means no follow-up mail is sent. At most 255
          characters.
        example: Your download link
        maxLength: 255
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      name:
        description: |-
          Form name, trimmed; at most 255 characters. Shown to visitors, used as
          the source of the leads the form creates (cut to 100 characters) and in
          notification subjects.
        example: Website contact form
        maxLength: 255
        type: string
      notify_emails:
        description: |-
          Staff addresses that receive one notification mail per accepted
          submission (on arrival, or on confirmation for double opt-in forms). At
          most 20, each at most 255 characters and shaped like an address; trimmed.
          Reads return [] when there are none; the POST /forms and PUT /forms/{id}
          responses echo the request and carry null when the list was omitted or
          sent as null.
        example:
        - sales@example.com
        items:
          type: string
        type: array
        x-nullable: true
      public_id:
        description: |-
          Public identifier used in every public URL (/forms/public/{key}): 22
          random URL-safe base64 characters assigned at creation and never changed,
          so embeds keep working across edits.
        example: q3VZr0n8TjK1bWcY5xL2aQ
        readOnly: true
        type: string
      redirect_url:
        description: |-
          Page the visitor is sent to when submit_action is redirect: required
          then, and must start with http:// or https://. At most 512 characters;
          stored unchecked for message forms.
        example: https://www.example.com/thank-you
        maxLength: 512
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormStatus'
        description: |-
          Publication state; only a published form is served by the public
          endpoints. Defaults to draft.
        example: published
      submission_count:
        description: Number of live submissions the form has collected, spam included.
        example: 128
        readOnly: true
        type: integer
      submit_action:
        description: |-
          What the visitor sees after submitting: message shows thank_you_message
          in place, redirect sends the browser to redirect_url. Defaults to
          message.
        enum:
        - message
        - redirect
        example: message
        type: string
      thank_you_message:
        description: |-
          Message shown after a submission when submit_action is message. When
          empty a default text is shown (a "check your inbox" text for double
          opt-in forms).
        example: Thanks, we will be in touch within one business day.
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  internal_handler.GenerateAEOPromptsRequest:
    properties:
      count:
        description: |-
          Number of suggestions to ask for, 1 to 25; absent or 0 means 10 (0 is
          accepted: the binding skips a zero value). The engine may return fewer
          usable suggestions than requested.
        example: 10
        maximum: 25
        minimum: 0
        type: integer
    type: object
  internal_handler.GeneratedAEOPromptsData:
    description: Suggested prompts returned by POST /aeo/prompts/generate. Nothing
      is stored until they are POSTed to /aeo/prompts.
    properties:
      prompts:
        description: |-
          Suggested buyer-style questions: de-duplicated, each 12 to 500
          characters, at most the requested count.
        example:
        - Which CRM is best for a small B2B sales team?
        items:
          type: string
        type: array
    type: object
  internal_handler.LeadListData:
    properties:
      leads:
        description: The page of leads.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Lead'
        type: array
      total:
        description: |-
          Number of leads matching the request over all pages (also in
          meta.total).
        example: 57
        type: integer
    type: object
  internal_handler.LoginRequest:
    description: Credentials for POST /auth/login. Unknown keys are ignored.
    properties:
      email:
        description: Login email address; must be syntactically valid (400 otherwise).
        example: jane.doe@example.com
        format: email
        type: string
      password:
        description: Account password; required, no further format check.
        example: Str0ng!Passw0rd
        type: string
    required:
    - email
    - password
    type: object
  internal_handler.LogoutRequest:
    description: Optional body of POST /auth/logout.
    properties:
      refresh_token:
        description: |-
          Refresh token to revoke. Omitted or empty: every refresh token of the
          caller is revoked. A token that is unknown, already revoked or owned by
          another user is ignored.
        example: Jx3k9QeV0m2b5sT8wY1zA4cD7fG0hJ3kL6nP9qR2tU5
        type: string
    type: object
  internal_handler.MarkAllReadResponse:
    description: Data payload of POST /notifications/read-all.
    properties:
      marked:
        description: Number of notifications this call marked read (0 when none were
          unread).
        example: 3
        type: integer
    type: object
  internal_handler.MessageResponse:
    description: A confirmation message.
    properties:
      message:
        description: Human-readable confirmation; informational, not a stable value.
        example: Logged out successfully
        type: string
    type: object
  internal_handler.PasswordResetConfirmRequest:
    description: Body of POST /auth/password-reset/confirm.
    properties:
      new_password:
        description: |-
          New password: at least 10 characters with an uppercase letter, a
          lowercase letter, a digit and a special character. More than 72 bytes
          fails with 500 (bcrypt limit) without spending the token.
        example: N3w!Passw0rd2026
        minLength: 10
        type: string
      token:
        description: |-
          The token from the emailed link (its token query parameter). Single use,
          valid for one hour.
        example: q8Zt3Lm0Xw5Rv9Kp2Hn6Bc1Yd4Fg7Js0Ua3Ei6Oo9Pq
        type: string
    required:
    - new_password
    - token
    type: object
  internal_handler.PasswordResetRequest:
    description: Body of POST /auth/password-reset.
    properties:
      email:
        description: |-
          Email address of the account to reset; must be syntactically valid. The
          response does not reveal whether an account exists.
        example: jane.doe@example.com
        format: email
        type: string
    required:
    - email
    type: object
  internal_handler.ProductRequest:
    properties:
      currency:
        description: |-
          ISO 4217 code, exactly three upper-case ASCII letters; the
          deals.default_currency setting (EUR as shipped) when absent.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      description:
        description: |-
          Free-text description, at most 65535 bytes (UTF-8 bytes, not
          characters).
        example: Business-hours support for twelve months.
        type: string
      is_active:
        description: Whether quote lines may use the product; true when absent.
        example: true
        type: boolean
      name:
        description: |-
          Product name, required; trimmed, it must not be empty. At most 200
          characters.
        example: Annual support plan
        maxLength: 200
        type: string
      sku:
        description: |-
          Optional stock-keeping code, trimmed, at most 64 characters; not
          unique.
        example: SUP-ANNUAL
        maxLength: 64
        type: string
      unit_price_cents:
        description: |-
          Price of one unit in minor units, 0 to 1000000000000. Required; 0 (a
          free item) is accepted.
        example: 120000
        maximum: 1000000000000
        minimum: 0
        type: integer
    required:
    - name
    - unit_price_cents
    type: object
  internal_handler.ProductUpdateRequest:
    properties:
      currency:
        description: |-
          New ISO 4217 code, exactly three upper-case ASCII letters. Existing
          quote lines keep their prices.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      description:
        description: New description, at most 65535 bytes; an empty string clears
          it.
        example: Around-the-clock support for twelve months.
        type: string
      is_active:
        description: |-
          New active flag; false stops the product from being added to quote
          lines.
        example: false
        type: boolean
      name:
        description: New name; trimmed, it must not be empty. At most 200 characters.
        example: Annual support plan (premium)
        maxLength: 200
        type: string
      sku:
        description: New SKU, trimmed, at most 64 characters; an empty string clears
          it.
        example: SUP-ANNUAL-P
        maxLength: 64
        type: string
      unit_price_cents:
        description: New unit price in minor units, 0 to 1000000000000.
        example: 180000
        maximum: 1000000000000
        minimum: 0
        type: integer
    type: object
  internal_handler.QuoteLineRequest:
    properties:
      description:
        description: |-
          Line text override, at most 255 characters, trimmed; the product's
          name when absent or blank.
        example: Annual support plan, two sites
        maxLength: 255
        type: string
      discount_bp:
        description: |-
          Per-line discount in basis points, 0 to 10000 (1250 = 12.5 percent); 0
          when absent.
        example: 1250
        maximum: 10000
        minimum: 0
        type: integer
      product_id:
        description: |-
          Product to price the line from: live, active and in the quote's
          currency. Required, at least 1.
        example: 9
        minimum: 1
        type: integer
      quantity:
        description: Number of units, 1 to 1000000. Required.
        example: 2
        maximum: 1000000
        minimum: 1
        type: integer
      unit_price_cents:
        description: |-
          Unit price override in minor units, 0 to 1000000000000; the product's
          price when absent.
        example: 115000
        maximum: 1000000000000
        minimum: 0
        type: integer
    required:
    - product_id
    - quantity
    type: object
  internal_handler.QuoteLineUpdateRequest:
    properties:
      description:
        description: |-
          New line text, at most 255 characters, trimmed; a blank value keeps
          the stored text.
        example: Annual support plan
        maxLength: 255
        type: string
      discount_bp:
        description: New discount in basis points, 0 to 10000.
        example: 0
        maximum: 10000
        minimum: 0
        type: integer
      position:
        description: |-
          New 1-based display position, at least 1. Other lines are not
          renumbered, so positions may repeat.
        example: 2
        minimum: 1
        type: integer
      quantity:
        description: New number of units, 1 to 1000000.
        example: 3
        maximum: 1000000
        minimum: 1
        type: integer
      unit_price_cents:
        description: New unit price in minor units, 0 to 1000000000000.
        example: 120000
        maximum: 1000000000000
        minimum: 0
        type: integer
    type: object
  internal_handler.QuoteRequest:
    properties:
      currency:
        description: |-
          ISO 4217 code, exactly three upper-case ASCII letters; the
          deals.default_currency setting (EUR as shipped) when absent. Every line
          must be priced in it.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      customer_id:
        description: |-
          Customer the quote is addressed to (at least 1); must name a live
          customer and, when deal_id is sent and the deal has a customer, that
          customer. deal_id or customer_id is required.
        example: 31
        minimum: 1
        type: integer
      deal_id:
        description: |-
          Deal the quote grows from (at least 1). Must name a live deal that is
          neither won nor lost; a sales user must own it. With no customer_id
          the deal's customer is used (possibly none).
        example: 88
        minimum: 1
        type: integer
      notes:
        description: Free-text notes, at most 65535 bytes (UTF-8 bytes, not characters).
        example: Prices exclude VAT.
        type: string
      owner_id:
        description: |-
          Owner (at least 1); the caller when absent. A sales user may only send
          its own id (403 otherwise); an admin may name any live user.
        example: 7
        minimum: 1
        type: integer
      title:
        description: |-
          Quote title, required; trimmed, it must not be empty. At most 200
          characters.
        example: Acme rollout - phase 1
        maxLength: 200
        type: string
      valid_until:
        description: |-
          Last day of validity, a calendar date YYYY-MM-DD (400 VALIDATION_ERROR
          for any other form). Absent or empty means none.
        example: "2026-12-31"
        format: date
        type: string
    required:
    - title
    type: object
  internal_handler.QuoteStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteStatus'
        description: |-
          Target status. Required. Allowed moves: draft to sent; sent to
          accepted, rejected, expired or back to draft.
        enum:
        - draft
        - sent
        - accepted
        - rejected
        - expired
        example: sent
    required:
    - status
    type: object
  internal_handler.QuoteUpdateRequest:
    properties:
      currency:
        description: |-
          New ISO 4217 code, exactly three upper-case ASCII letters; refused with
          409 while the quote has lines.
        example: USD
        maxLength: 3
        minLength: 3
        type: string
      customer_id:
        description: |-
          New customer (at least 1; it cannot be cleared). Must name a live
          customer and, when the quote's deal has a customer, that customer.
        example: 31
        minimum: 1
        type: integer
      notes:
        description: New notes, at most 65535 bytes; an empty string clears them.
        example: Prices exclude VAT. Valid for one site.
        type: string
      owner_id:
        description: |-
          New owner (at least 1). A sales user may only send its own id; an
          admin may name any live user.
        example: 9
        minimum: 1
        type: integer
      title:
        description: New title; trimmed, it must not be empty. At most 200 characters.
        example: Acme rollout - phase 1 (revised)
        maxLength: 200
        type: string
      valid_until:
        description: |-
          New last day of validity: a date YYYY-MM-DD sets it, null or an empty
          string clears it, absent keeps it.
        example: "2027-01-31"
        format: date
        type: string
        x-nullable: true
    type: object
  internal_handler.RefreshRequest:
    description: Body of POST /auth/refresh.
    properties:
      refresh_token:
        description: |-
          The refresh token from the latest login, refresh or password change. It
          is spent by this call.
        example: Jx3k9QeV0m2b5sT8wY1zA4cD7fG0hJ3kL6nP9qR2tU5
        type: string
    required:
    - refresh_token
    type: object
  internal_handler.RegisterRequest:
    description: 'Self-service sign-up. There is no role field: the account is always
      a customer.'
    properties:
      email:
        description: |-
          Login email address; must be a valid address and not already used by any
          account (409 otherwise).
        example: jane.doe@example.com
        format: email
        type: string
      first_name:
        description: Given name; required, non-empty.
        example: Jane
        type: string
      last_name:
        description: Family name; required, non-empty.
        example: Doe
        type: string
      password:
        description: |-
          Password: at least 10 characters with an uppercase letter, a lowercase
          letter, a digit and a special character (punctuation or symbol). bcrypt
          cannot hash more than 72 bytes; a longer password is answered with 400.
        example: Str0ng!Passw0rd
        minLength: 10
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  internal_handler.RegistrationStatusResponse:
    description: Whether public sign-up is open.
    properties:
      enabled:
        description: |-
          True when POST /auth/register currently accepts sign-ups; false when the
          setting is off or could not be read.
        example: false
        type: boolean
    type: object
  internal_handler.SaveAEOProfileRequest:
    properties:
      brand_aliases:
        description: |-
          Alternative brand spellings: at most 20, each at most 120 characters.
          Trimmed, blanks dropped and de-duplicated case-insensitively. Omitting the
          field clears the list.
        example:
        - Acme
        - AcmeCRM
        items:
          type: string
        maxItems: 20
        type: array
      brand_name:
        description: |-
          Brand name searched for in answers; required, at most 120 characters, and
          not blank once trimmed.
        example: Acme CRM
        maxLength: 120
        type: string
      competitors:
        description: |-
          Tracked competitors, at most 20, kept in the order sent. Omitting the
          field clears the list.
        items:
          $ref: '#/definitions/internal_handler.AEOCompetitorRequest'
        maxItems: 20
        type: array
      description:
        description: |-
          What the business does; context for prompt generation only. At most 2000
          characters; trimmed.
        example: Self-hosted CRM for small sales and support teams.
        maxLength: 2000
        type: string
      owned_domains:
        description: |-
          Owned domains: at most 20, each at most 255 characters. Normalised to
          bare lower-case hosts (scheme, path and leading "www." removed),
          de-duplicated. Omitting the field clears the list.
        example:
        - acme.example
        items:
          type: string
        maxItems: 20
        type: array
    required:
    - brand_name
    type: object
  internal_handler.SetConfigurationRequest:
    description: Body of PUT /configurations/{key}.
    properties:
      value:
        description: |-
          The new value, as a JSON value of the entry's declared type: a string
          for string, true or false for boolean, a whole number for integer, any
          JSON value for float, json and array (stored as its JSON text). Falsy
          values (false, 0, "") are accepted; the field must be present and must
          not be null. For a sensitive entry send the plaintext secret, or "" to
          clear it.
    required:
    - value
    type: object
  internal_handler.TaskListData:
    description: 'Data payload of GET /tasks and GET /tasks/my: one page of tasks
      and the total before pagination.'
    properties:
      tasks:
        description: The page of tasks. Unsorted pages come in ascending id order;
          a sorted page is ordered by the sort column, then id in the same direction.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Task'
        type: array
      total:
        description: Number of tasks matching the caller's scope and filters before
          pagination; the same value as meta.total.
        example: 42
        type: integer
    type: object
  internal_handler.TicketListData:
    description: 'Data payload of the ticket list endpoints: one page of tickets and
      the total before pagination.'
    properties:
      tickets:
        description: The page of tickets. Unsorted pages come in ascending id order;
          a sorted page is ordered by the sort column, then id in the same direction.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Ticket'
        type: array
      total:
        description: Number of tickets in the caller's scope matching the filters,
          before pagination; the same value as meta.total.
        example: 17
        type: integer
    type: object
  internal_handler.UnreadCountResponse:
    description: Data payload of GET /notifications/unread-count.
    properties:
      unread:
        description: Number of the caller's notifications that have not been marked
          read.
        example: 3
        type: integer
    type: object
  internal_handler.UpdateAEOPromptRequest:
    properties:
      is_active:
        description: |-
          Include (true) or exclude (false) the prompt from full runs. Absent keeps
          the current state. Reactivating fails when 100 prompts are already active.
        example: false
        type: boolean
      text:
        description: |-
          New prompt text; at most 500 characters, not blank once trimmed, unique
          case-insensitively among live prompts. Absent keeps the current text.
        example: Which self-hosted CRM is best for a five-person sales team?
        maxLength: 500
        type: string
    type: object
  internal_handler.UpdateAPIKeyRequest:
    description: Body of PUT /api-keys/{id}. At least one field must be present.
    properties:
      is_active:
        description: |-
          true reactivates a revoked key, false revokes it; omitted or null keeps
          the current state.
        example: false
        type: boolean
      name:
        description: New label, 3 to 100 characters; omitted or null keeps the current
          one.
        example: CI pipeline (rotated)
        maxLength: 100
        minLength: 3
        type: string
    type: object
  internal_handler.UpdateCustomerRequest:
    description: Body of PUT /customers/{id}. Every field is optional. A text field
      that is omitted or empty leaves the stored value unchanged (it cannot be cleared
      this way), except website, where an empty string clears it.
    properties:
      address:
        description: New street address; empty leaves it unchanged.
        example: Strada Exemplu 1
        type: string
      city:
        description: New city; empty leaves it unchanged.
        example: Cluj-Napoca
        type: string
      company:
        description: New free-text company name; empty leaves it unchanged.
        example: Acme SRL
        type: string
      company_id:
        description: |-
          Company link: omitted or null leaves it unchanged, 0 clears it, any
          other value must name a live company (400 INVALID_REFERENCE otherwise).
        example: 3
        type: integer
      country:
        description: New country; empty leaves it unchanged.
        example: Romania
        type: string
      email:
        description: |-
          New email address; must be valid and not used by another customer (409).
          Empty leaves it unchanged.
        example: ana.popescu@example.com
        format: email
        type: string
      first_name:
        description: New given name; empty leaves it unchanged.
        example: Ana
        type: string
      last_name:
        description: New family name; empty leaves it unchanged.
        example: Popescu
        type: string
      notes:
        description: New notes, replacing the old ones; empty leaves them unchanged.
        example: Prefers email contact.
        type: string
      phone:
        description: New phone number; empty leaves it unchanged.
        example: +40 721 000 000
        type: string
      position:
        description: New job title; empty leaves it unchanged.
        example: Purchasing manager
        type: string
      postal_code:
        description: New postal code; empty leaves it unchanged.
        example: "400000"
        type: string
      state:
        description: New state, county or region; empty leaves it unchanged.
        example: Cluj
        type: string
      website:
        description: |-
          Web site: omitted or null leaves it unchanged, "" clears it, anything
          else must be an absolute http or https URL with a host, at most 255
          characters after trimming.
        example: https://acme.example
        maxLength: 255
        type: string
    type: object
  internal_handler.UpdateFormRequest:
    properties:
      allowed_domains:
        description: |-
          Origin allowlist of bare host names with optional port (no scheme, no
          path), lower-cased on save; empty allows every origin. At most 20, each
          at most 255 characters.
        example:
        - www.example.com
        items:
          type: string
        maxItems: 20
        type: array
      captcha_enabled:
        description: |-
          Require a reCAPTCHA v3 token; ignored unless the server has both
          reCAPTCHA keys.
        example: false
        type: boolean
      confirmation_body:
        description: |-
          Confirmation mail body (plain text) with an optional {confirmation_link}
          placeholder; the link is appended when the placeholder is missing.
        example: 'Hello, please confirm your address: {confirmation_link}'
        type: string
      confirmation_subject:
        description: |-
          Confirmation mail subject, at most 255 characters; empty means a
          built-in subject.
        example: Please confirm your email address
        maxLength: 255
        type: string
      consent_text:
        description: |-
          Consent statement; when non-empty every submission must carry
          consent=true.
        example: I agree to be contacted about my enquiry.
        type: string
      content_url:
        description: Link substituted for {content_link}, at most 512 characters.
        example: https://www.example.com/files/guide.pdf
        maxLength: 512
        type: string
      create_lead:
        description: |-
          Feed accepted submissions into leads. Absent means true; send false
          explicitly to turn it off.
        example: true
        type: boolean
      default_owner_id:
        description: |-
          Owner of created leads; 0 means none. Must be non-zero when create_lead
          is true or absent, and any non-zero value must name an existing, active
          admin or sales user.
        example: 2
        type: integer
      description:
        description: Internal description for staff; never shown publicly.
        example: Contact form on the pricing page.
        type: string
      double_opt_in:
        description: |-
          Enable double opt-in (confirmation mail with a 48-hour single-use link
          before the submission counts).
        example: false
        type: boolean
      fields:
        description: |-
          Ordered field definitions, 1 to 50. Exactly one field of type email,
          named "email"; names unique and matching ^[a-z][a-z0-9_]{0,49}$; select
          fields need 1 to 50 non-blank options and only select fields may have
          options; hidden fields cannot be required.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormFieldDef'
        maxItems: 50
        minItems: 1
        type: array
      follow_up_body:
        description: |-
          Follow-up mail body (plain text); {content_link} is replaced by
          content_url. Empty means a built-in text.
        example: 'Download the guide here: {content_link}'
        type: string
      follow_up_subject:
        description: |-
          Follow-up mail subject, at most 255 characters; empty disables the
          follow-up mail.
        example: Your download link
        maxLength: 255
        type: string
      name:
        description: Form name; required, at most 255 characters, not blank once trimmed.
        example: Website contact form
        maxLength: 255
        type: string
      notify_emails:
        description: |-
          Staff addresses notified of each accepted submission: at most 20, each
          at most 255 characters and shaped like an email address (trimmed).
        example:
        - sales@example.com
        items:
          type: string
        maxItems: 20
        type: array
      redirect_url:
        description: |-
          Target page when submit_action is redirect: required then and must
          start with http:// or https:// (trimmed). At most 512 characters.
        example: https://www.example.com/thank-you
        maxLength: 512
        type: string
      status:
        description: |-
          Publication state; absent or empty means draft. Only published forms are
          served publicly.
        enum:
        - draft
        - published
        - archived
        example: published
        type: string
      submit_action:
        description: message (default when absent or empty) or redirect.
        enum:
        - message
        - redirect
        example: message
        type: string
      thank_you_message:
        description: |-
          Message shown after submitting when submit_action is message; empty
          means a built-in text.
        example: Thanks, we will be in touch within one business day.
        type: string
    required:
    - fields
    - name
    type: object
  internal_handler.UpdateLabelRequest:
    description: Body of PUT /labels/{id}. Both fields are optional; an absent or
      empty field is left unchanged.
    properties:
      color:
        description: 'New colour as #RRGGBB; absent or empty keeps the current colour.'
        example: '#3366CC'
        type: string
      name:
        description: New name, at most 50 characters, trimmed and unique case-insensitively
          among the other labels; absent or empty keeps the current name.
        example: Waiting on customer
        maxLength: 50
        type: string
    type: object
  internal_handler.UpdateLeadRequest:
    properties:
      classification:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.LeadClassification'
        description: New classification; empty or absent keeps the stored one.
        enum:
        - unclassified
        - test
        - spam
        - lead
        - hot_lead
        example: hot_lead
      company:
        description: New free-text company name; empty or absent keeps the stored
          one.
        example: Analytical Engines Ltd
        type: string
      company_id:
        description: |-
          Company link: absent keeps it, 0 clears it, any other value must name
          a live company (400 INVALID_REFERENCE otherwise).
        example: 12
        type: integer
      email:
        description: |-
          New email address, validated when present; empty or absent keeps the
          stored one. The email-or-phone rule of create is not re-checked.
        example: ada.king@example.com
        format: email
        type: string
      external_id:
        description: New external id; empty or absent keeps the stored one.
        example: crm-legacy-1042
        type: string
      first_name:
        description: New given name; empty or absent keeps the stored one.
        example: Ada
        type: string
      last_name:
        description: New family name; empty or absent keeps the stored one.
        example: King
        type: string
      notes:
        description: |-
          New notes, replacing the stored text; at most 65535 bytes (400
          BAD_REQUEST above). Empty or absent keeps the stored notes.
        example: Demo booked for Tuesday.
        type: string
      owner_id:
        description: |-
          New owner. Admin only: any owner_id from another role, even the
          caller's own id, is 403.
        example: 9
        type: integer
      phone:
        description: New phone number; empty or absent keeps the stored one.
        example: +44 20 7946 0001
        type: string
      position:
        description: New job title; empty or absent keeps the stored one.
        example: CEO
        type: string
      source:
        description: New source; empty or absent keeps the stored one.
        example: referral
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.LeadStatus'
        description: |-
          New status; empty or absent keeps the stored one. converted is refused
          with 400 VALIDATION_ERROR unless the lead is already converted.
        enum:
        - new
        - contacted
        - qualified
        - unqualified
        - converted
        example: qualified
    type: object
  internal_handler.UpdateMeRequest:
    description: Body of PUT /users/me. Every field is optional; an omitted or empty
      field leaves the stored value unchanged. Role and active status cannot be changed
      here.
    properties:
      email:
        description: New login email; must be valid and not used by another account
          (409).
        example: jane.doe@example.com
        format: email
        type: string
      first_name:
        description: New given name; empty leaves it unchanged.
        example: Jane
        type: string
      last_name:
        description: New family name; empty leaves it unchanged.
        example: Doe
        type: string
      password:
        description: |-
          New password: at least 10 characters with an uppercase letter, a
          lowercase letter, a digit and a special character. The current password
          is not asked for and existing refresh tokens are NOT revoked (POST
          /auth/change-password does both). More than 72 bytes fails with 500.
        example: N3w!Passw0rd2026
        minLength: 10
        type: string
    type: object
  internal_handler.UpdateTaskRequest:
    description: Body of PUT /tasks/{id}. Every field is optional; absent or empty
      fields are left unchanged.
    properties:
      assigned_to_id:
        description: New assignee; absent, 0 or the current assignee leaves it unchanged.
          Any other value is admin-only (403 otherwise) and must name an existing,
          active user.
        example: 7
        type: integer
      customer_id:
        description: 'Customer to link. When present without lead_id it replaces the
          association: the lead link is cleared and this customer (which must exist)
          is linked. Absent (or null) keeps the stored link.'
        example: 3
        type: integer
      description:
        description: New description; an absent or empty value leaves it unchanged
          (it cannot be cleared).
        example: Quote sent, waiting for the signature.
        type: string
      due_date:
        description: New due date (RFC 3339); absent or null leaves it unchanged (it
          cannot be cleared).
        example: "2026-11-06T09:00:00Z"
        type: string
      label_ids:
        description: |-
          Replacement label set, at most 100 ids, each positive. The field is a
          pointer so the cases stay distinguishable: absent (or null) leaves the
          labels untouched, while a present array, even an empty one, replaces the
          whole set. An id that matches no label rejects the whole request with 400
          INVALID_REFERENCE.
        example:
        - 1
        - 4
        items:
          type: integer
        maxItems: 100
        type: array
      lead_id:
        description: Lead to link. When present it must name a lead the caller may
          see (404 otherwise), even when it equals the stored link. Absent keeps the
          stored link; null is the same as absent. Cannot be combined with customer_id.
        example: 12
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskPriority'
        description: New priority; absent or empty leaves it unchanged.
        enum:
        - low
        - medium
        - high
        example: medium
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskStatus'
        description: New status; absent or empty leaves it unchanged. A completed
          task cannot be moved to any other status (400).
        enum:
        - pending
        - in_progress
        - completed
        - cancelled
        example: in_progress
      title:
        description: New title; an absent or empty value leaves the title unchanged.
        example: Call back about the renewal
        type: string
    type: object
  internal_handler.UpdateTicketRequest:
    description: Body of PUT /tickets/{id}. Every field is optional; absent or empty
      fields are left unchanged.
    properties:
      assigned_to_id:
        description: New assignee, which must exist and hold the support or admin
          role (400 otherwise). Absent or null leaves it unchanged; the assignee cannot
          be removed. On a ticket that already has an assignee the new value is currently
          not stored (see the operation description).
        example: 5
        type: integer
      description:
        description: New description; absent or empty leaves it unchanged.
        example: The printer is visible again but prints blank pages.
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TicketPriority'
        description: New priority; absent or empty leaves it unchanged.
        enum:
        - low
        - medium
        - high
        - urgent
        example: urgent
      resolution:
        description: Resolution text; absent or empty leaves it unchanged (it cannot
          be cleared).
        example: Rolled the printer back to the previous firmware.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TicketStatus'
        description: New status; absent or empty leaves it unchanged. A closed ticket
          cannot be moved to any other status (400); every other change is allowed.
        enum:
        - open
        - in_progress
        - resolved
        - closed
        example: resolved
      title:
        description: New title; absent or empty leaves it unchanged.
        example: Printer offline after firmware update
        type: string
    type: object
  internal_handler.UpdateUserRequest:
    description: Body of PUT /users/{id}. Every field is optional; an omitted or empty
      field leaves the stored value unchanged (names and email cannot be cleared).
    properties:
      email:
        description: New login email; must be valid and not used by another account
          (409).
        example: sam.sales@example.com
        format: email
        type: string
      first_name:
        description: New given name; empty leaves it unchanged.
        example: Sam
        type: string
      is_active:
        description: |-
          New active flag. Applied only when the caller is an admin and silently
          ignored otherwise. false deactivates the account (its tokens and API keys
          stop working); unlike POST /users/{id}/deactivate this path does not stop
          an admin from deactivating itself.
        example: true
        type: boolean
      last_name:
        description: New family name; empty leaves it unchanged.
        example: Seller
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.UserRole'
        description: |-
          New role. Applied only when the caller is an admin and silently ignored
          otherwise; a value outside admin, sales, support, customer is a 400 for
          every caller.
        enum:
        - admin
        - sales
        - support
        - customer
        example: support
    type: object
info:
  contact: {}
  description: |-
    GopherCRM is a self-hosted CRM: users, leads, customers, companies, deals, products, quotes, tickets, tasks, labels, follow-up automation, notifications, embeddable lead-capture forms and answer-engine visibility tracking (AEO). Every operation in this reference lives under the base path /api/v1 (configurable through API_PREFIX). GET /health is served outside the base path and is deliberately not part of this reference.

    ## Authentication
    Protected operations accept one credential in the Authorization header, either `Authorization: Bearer <jwt>` (an access token from POST /auth/login or POST /auth/refresh) or `Authorization: ApiKey <key>` (a personal key from POST /api-keys; the plaintext key is shown once, at creation, and the gcrm_ prefix may be sent or left off). No other header, query parameter or cookie is read. A missing header, or one that is neither form, is 401 UNAUTHORIZED "Missing or invalid authorization header"; an invalid or expired credential, or one whose account is deactivated or erased, is 401 UNAUTHORIZED "Invalid credentials".
    Login returns an access token (valid for JWT_EXPIRY_HOURS, 24 hours by default), a single-use refresh token (valid for REFRESH_TOKEN_EXPIRY_DAYS, 30 days by default) and the user. POST /auth/refresh rotates strictly: the presented refresh token is spent and replaced, a spent token is refused with 401, and of several concurrent refreshes of one token exactly one succeeds, so a client must keep the replacement from every response. Logout, POST /auth/change-password and password reset revoke refresh tokens (a password changed through PUT /users/me revokes none), but an issued access token cannot be revoked early: it stays valid until it expires. Registration is open only while the security.allow_public_registration setting is on (it ships off), always creates a customer and returns an access token without a refresh token.
    Roles are admin, sales, support and customer. Each operation names the roles it admits; another role gets 403 FORBIDDEN "Insufficient permissions". Where a role sees only some records (for example sales and its own leads), the operation describes the narrowing and the status a record outside it is answered with.

    ## Response envelope
    Every JSON response has the shape {success, data, error, meta}. success is true for a 2xx response; data carries the payload (its shape is documented per operation); error is present only on failures; meta always carries request_id and, on paginated lists, page, per_page, total and total_pages (zero values are omitted, so an empty page has no total). A 204 response has no body.
    Exceptions that are not enveloped: GET /customers/export (text/csv), the public form pages GET /forms/public/embed.js (JavaScript), GET /forms/public/{key}/view and GET/POST /forms/public/confirm (HTML), a CORS rejection (a bare 403 with no body) and a path or method that no route matches (the router's plain-text 404 "404 page not found").

    ## Errors
    error.code is the stable value to branch on; error.message is for people and may change. Shared codes:
    - 400 VALIDATION_ERROR: a binding or field rule failed. error.details is usually an object mapping each failed field to a message; binding failures key it by the server-side Go field name (for example FirstName), while service-level field checks use the JSON name. Operations that send another shape document it (a lead conversion rule sends {field}, plus status and allowed_statuses for a refused status; POST /aeo/prompts/{id}/run with an invalid id sends a plain string), and some omit details. A body over the public form submission limit is 413 with this code.
    - 400 BAD_REQUEST: malformed JSON ("Invalid request format"), typically an unparsable path id, or another request the handler refuses as a whole.
    - 400 INVALID_INPUT and INVALID_REFERENCE: a rule the service checks beyond the binding (automation rules, bulk status requests), or an id that names no live record (for example company_id, label_ids, a quote line's product).
    - 401 UNAUTHORIZED: missing, malformed, invalid or expired credentials.
    - 403 FORBIDDEN: the role is not admitted, or the record belongs to someone else where the operation says so.
    - 404 NOT_FOUND: no live record with that id within the caller's visibility. Erased (soft-deleted) records are never returned.
    - 409 CONFLICT and SESSION_STALE: a duplicate (email, domain, label name), a refused state change, or a stale session on a password change.
    - INVALID_STATUS_TRANSITION: a refused status change; 400 for a quote transition, 409 for cancelling an automation run that has already finished.
    - 429 TOO_MANY_REQUESTS: see Rate limits.
    - 500 INTERNAL_ERROR: an unexpected failure ("An unexpected error occurred"); details are logged server-side, never returned.
    - 502 MAIL_DELIVERY_FAILED (sending a quote by email), 503 SESSION_REFRESH_UNAVAILABLE (refresh), 503 PROVIDER_NOT_CONFIGURED, PROVIDER_REJECTED, PROVIDERS_UNAVAILABLE and SHUTTING_DOWN (AEO).
    Each operation lists the codes it can return and the condition behind each.

    ## Pagination, sorting and filtering
    List operations take offset (default 0; negative or non-numeric values become 0) and limit (default 20; 0, negative or non-numeric values become 20; values above 100 are clamped to 100). Some lists also take a 1-based page that, when present, overrides offset. Out-of-range values are clamped or replaced, never rejected. Sortable lists accept sort_by from a fixed per-entity column list and sort_order asc or desc; what an unknown value does (ignored, defaulted or refused) is documented per operation.

    ## Rate limits
    Requests are counted per client IP (the direct peer address unless TRUSTED_PROXIES names the proxy in front) in three tiers, each with its own buckets: strict, 10 requests per minute with a burst of 5, on every unauthenticated /auth route and on public form submission and confirmation; authenticated, 120 per minute with a burst of 30, shared by every authenticated operation and counted after authentication; generous, 240 per minute with a burst of 40, on public form reads. An exceeded limit is 429 TOO_MANY_REQUESTS with error.details {"retry_after": "60s"}, a fixed hint rather than the real wait. No Retry-After or X-RateLimit-* header is sent. Preflight OPTIONS requests are not counted.

    ## CORS and headers
    Browser requests are admitted only from the configured origins (localhost development origins plus CORS_ALLOWED_ORIGINS), with credentials allowed, the methods GET, POST, PUT, PATCH, DELETE and OPTIONS and the request headers Origin, Content-Type, Authorization and X-Request-ID. A request from any other origin is refused with a bare 403 before any handler or log line. The public form endpoints under /forms/public answer any origin without credentials (methods GET, POST and OPTIONS, request header Content-Type).
    Every response except a CORS preflight answer or a CORS rejection carries X-Request-ID: the value the client sent in that header, otherwise a generated UUID. The same value is meta.request_id in the envelope. Browsers on the configured origins can read X-Request-ID and Content-Length (exposed headers); the public form endpoints expose no headers, so a cross-origin page reads the id from meta.request_id instead.
  title: GopherCRM API
  version: 1.2.0
paths:
  /aeo/citations:
    get:
      description: |-
        Which sources the non-error answers cite over the requested window: the owned-domain citation rate, per-company citation and brand-mention rates (the brand first, then each competitor in profile order, companies without citations included) and the twenty most cited hosts by citation count descending. Windows are 7, 30 or 90 days; anything else falls back to 30. Works before a brand profile exists (by_company is then empty).
        Roles: admin, sales, support.
      parameters:
      - default: 30
        description: Reporting window in days; 7, 30 or 90, anything else means 30
        enum:
        - 7
        - 30
        - 90
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Citation report retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitationsReport'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            an invalid or expired token or API key
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - role is not admin, sales or support (the customer
            role is always refused)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS - moderate tier: 120 requests/min, burst
            30, per client IP, shared by every authenticated route; error.details.retry_after
            is ''60s''; no Retry-After header'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; the cause is never echoed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: AEO citation report
      tags:
      - aeo
  /aeo/dashboard:
    get:
      description: |-
        Aggregated visibility over the requested window: the overall percentage of non-error answers that mention the brand, the same figure per engine, a daily timeline with one entry per UTC day (days without answers carry overall 0 and no per-engine entries), the share of voice across the brand and its competitors, and the per-company daily timeline. Windows are 7, 30 or 90 days; anything else falls back to 30. The window ends (exclusive) at the start of tomorrow in UTC, so today's answers are included. Works before a brand profile exists: the brand figures are then empty and share of voice falls back to the competitor names found in the answers.
        Roles: admin, sales, support.
      parameters:
      - default: 30
        description: Reporting window in days; 7, 30 or 90, anything else means 30
        enum:
        - 7
        - 30
        - 90
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEODashboard'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            an invalid or expired token or API key
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - role is not admin, sales or support (the customer
            role is always refused)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS - moderate tier: 120 requests/min, burst
            30, per client IP, shared by every authenticated route; error.details.retry_after
            is ''60s''; no Retry-After header'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; the cause is never echoed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: AEO visibility dashboard
      tags:
      - aeo
  /aeo/profile:
    get:
      description: |-
        The single brand profile that drives mention detection: brand name, aliases, owned domains, business description and the tracked competitors. There is only ever one profile (id 1). Answers 404 NOT_FOUND until the profile has been saved for the first time (every other AEO route that needs it answers 409 instead).
        Roles: admin, sales, support.
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOProfile'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            an invalid or expired token or API key
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - role is not admin, sales or support (the customer
            role is always refused)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: NOT_FOUND - the brand profile has not been configured yet (message
            'AEO profile not found')
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS - moderate tier: 120 requests/min, burst
            30, per client IP, shared by every authenticated route; error.details.retry_after
            is ''60s''; no Retry-After header'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; the cause is never echoed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get the AEO brand profile
      tags:
      - aeo
    put:
      consumes:
      - application/json
      description: |-
        Save the single brand profile; the first call creates it, later calls replace it wholesale (a list left out of the body is cleared). The service trims every value, drops blank aliases, domains and competitors, de-duplicates aliases and domains case-insensitively, and reduces domains to bare lower-case hosts (scheme, path and a leading "www." removed). The response is the stored row. Only answers collected after the save are analysed against the new profile; stored answers keep their mention and citation analysis.
        Roles: admin, sales.
        Errors: 400 VALIDATION_ERROR (message "Validation failed", error.details maps the failing Go struct field name, e.g. BrandName or Prompts[0], to a message) when a binding rule fails; 400 BAD_REQUEST ("Invalid request format") for a body that is not valid JSON or does not match the field types; 400 VALIDATION_ERROR without error.details (the member is omitted) when the brand name is blank once trimmed or a value is too long after trimming (message names the rule, e.g. "brand name is required: invalid brand profile").
      parameters:
      - description: Complete brand profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SaveAEOProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile saved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOProfile'
              type: object
        "400":
          description: VALIDATION_ERROR or BAD_REQUEST - invalid body or profile (see
            description)
          schema:
            allOf:
