      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get the caller's account
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Any authenticated role. Changes the caller's email, names and/or
        password; only non-empty fields are written, and role and active status cannot
        be changed here. A new password must meet the policy (at least 10 characters
        with an uppercase letter, a lowercase letter, a digit and a special character);
        unlike POST /auth/change-password the current password is not required and
        existing refresh tokens are not revoked. A body with nothing to apply returns
        the account unchanged.
      parameters:
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated account
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
              type: object
        "400":
          description: 'VALIDATION_ERROR: email is not an email address or password
            is shorter than 10 characters (details maps the Go field name to a message).
            BAD_REQUEST: malformed JSON (Invalid request format), or the password
            fails the complexity policy'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: 'NOT_FOUND: the account was erased while the credential was
            still in use'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: 'CONFLICT: another account already uses this email'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded (120 per minute,
            burst 30, per client IP); details.retry_after is 60s and no Retry-After
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: the account could not be updated, or the password
            is over 72 bytes (bcrypt limit)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Update the caller's account
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    description: 'Personal API key from POST /api-keys, sent in the same Authorization
      header as "Authorization: ApiKey <key>" (the gcrm_ prefix may be sent or left
      off). A header named ApiKey is not read. The plaintext key is shown only once,
      at creation.'
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: 'JWT access token from POST /auth/login or POST /auth/refresh, sent
      as "Authorization: Bearer <jwt>". Valid until it expires; logout does not revoke
      it.'
    in: header
    name: Authorization
    type: apiKey
