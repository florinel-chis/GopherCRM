  /automation/runs:
    get:
      description: 'One page of runs, without their step logs. Roles: admin sees every
        run; sales only runs whose lead or deal it currently owns (applied inside
        the query, so meta.total counts that set; ownership is read at request time,
        so it follows reassignments); support and customers get 403 from the route
        guard. Filters: status, rule_id, entity_type, entity_id (each validated, 400
        when malformed). sort_by is limited to the listed columns (anything else is
        400). An absent sort_by sorts by created_at descending and then ignores sort_order;
        with a sort_by, sort_order is asc or desc and anything else means desc. Ties
        are broken by id in the same direction. Pagination: page (1-based) overrides
        offset when greater than 0; limit defaults to 20 and is clamped to 100; the
        checks run before any query, sort first. Each run carries rule_name, the rule''s
        current name (also for a deleted rule, then with rule_deleted true), and never
        the rule''s trigger or steps; a sales user therefore sees the names of the
        rules that ran on its records.'
      parameters:
      - description: Page number (1-based); overrides offset when greater than 0
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; non-positive values fall back to 20, larger values
          are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Only runs in this status
        enum:
        - pending
        - running
        - waiting
        - completed
        - failed
        - cancelled
        in: query
        name: status
        type: string
      - description: Only runs of this rule (a positive integer)
        in: query
        name: rule_id
        type: integer
      - description: Only runs on this entity type
        enum:
        - lead
        - deal
        in: query
        name: entity_type
        type: string
      - description: Only runs on records with this id (a positive integer; combine
          with entity_type to name one record)
        in: query
        name: entity_id
        type: integer
      - description: Sort column; created_at when absent, anything outside the list
          is 400
        enum:
        - id
        - created_at
        - updated_at
        - status
        - resume_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction, honoured only with sort_by; anything else means
          desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of runs; meta carries page, per_page, total and total_pages
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationRun'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: BAD_REQUEST - sort_by is not an allowed column (message Invalid
            sort column), status or entity_type is unknown, or rule_id or entity_id
            is not a positive integer
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            invalid, expired or revoked credentials
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - admin or sales role required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: TOO_MANY_REQUESTS - per-IP rate limit for authenticated traffic
            exceeded; error.details.retry_after is 60s
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
