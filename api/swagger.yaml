  /quotes:
    get:
      description: |-
        One page of live quotes with their number and customer, deal and owner summaries; lines are not loaded (lines is an empty array). Roles: admin (every quote) and sales (only the quotes it owns, whatever owner_id says; filtered in the query, so meta.total counts only those).
        Filters combine (AND): status, deal_id, customer_id and owner_id. sort_by must be one of the listed columns (any other value is 400) and the id breaks ties in the same direction. Without sort_by the order is created_at descending and sort_order is ignored; with sort_by, a sort_order other than asc or desc becomes desc.
        data is the array of quotes; meta carries request_id, page (offset / limit + 1, rounded down), per_page and, when not zero, total and total_pages (both are omitted for an empty result).
      parameters:
      - description: 1-based page number; when greater than 0 it overrides offset
          (offset = (page-1) x limit). Non-numeric values are ignored
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of rows to skip; negative or non-numeric values fall back
          to 0
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; 0, negative or non-numeric values fall back to 20,
          values above 100 are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Only quotes in this status; an unknown value is 400
        enum:
        - draft
        - sent
        - accepted
        - rejected
        - expired
        in: query
        name: status
        type: string
      - description: Only quotes of this deal; must be a positive integer
        in: query
        minimum: 1
        name: deal_id
        type: integer
      - description: Only quotes addressed to this customer; must be a positive integer
        in: query
        minimum: 1
        name: customer_id
        type: integer
      - description: Only quotes owned by this user; must be a positive integer. Honoured
          for admins; a sales caller is always narrowed to itself
        in: query
        minimum: 1
        name: owner_id
        type: integer
      - default: created_at
        description: Sort column
        enum:
        - id
        - title
        - status
        - total_cents
        - currency
        - valid_until
        - sent_at
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction, applied only with sort_by; any other value becomes
          desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of quotes
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteJSON'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: 'BAD_REQUEST: sort_by is not an allowed column (''Invalid sort
            column''), status is unknown (''Invalid status''), or deal_id, customer_id
            or owner_id is not a positive integer (''<name> must be a positive integer'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: the Authorization header is missing or is neither
            Bearer <jwt> nor ApiKey <key> (''Missing or invalid authorization header''),
            or the credential is invalid, expired or belongs to a deactivated account
