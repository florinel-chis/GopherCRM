  /quotes/{id}/status:
    post:
      consumes:
      - application/json
      description: |-
        Change the status. Roles: admin (any quote) and sales (only the quotes it owns). The allowed moves are draft to sent, sent to accepted, sent to rejected, sent to expired and sent back to draft; accepted, rejected and expired are final. Any other pair, the same status again included, is 400 INVALID_STATUS_TRANSITION and writes nothing.
        One transaction: a locking read of the quote, the transition check, the acceptance check (accepted is 409 once valid_until lies before today's date in the server's zone), a conditional claim (WHERE status = the stored status; a lost race is 400 INVALID_STATUS_TRANSITION), for draft to sent a locked count of the lines (none rolls everything back with 409), and one status-history row.
        Timestamps: sent sets sent_at and clears closed_at; accepted, rejected and expired set closed_at; sent to draft clears both. Accepting a quote does not change its deal, and no email is sent (see POST /quotes/{id}/email).
      parameters:
      - description: Quote ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.QuoteStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The quote after the move
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteJSON'
              type: object
        "400":
          description: 'BAD_REQUEST: id is not an unsigned integer (''Invalid quote
            ID''). VALIDATION_ERROR (message ''Validation failed''): a binding rule
            failed; error.details maps the Go field name (for example FirstName) to
            a message. BAD_REQUEST: the body is not valid JSON for the schema (''Invalid
            request format'') (status missing or not one of the five). INVALID_STATUS_TRANSITION:
            the move is not allowed from the current status, or another transition
            won the race'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
