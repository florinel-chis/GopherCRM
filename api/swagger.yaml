      description: 'The pipeline widget and the won-this-month tile of the dashboard.
        Admin sees every live deal, sales only its own. Support passes the dashboard
        guard but has no access to deals and gets 403, as does the customer role.
        data.stages is the same payload as GET /deals/pipeline without filters: all
        five stages in pipeline order (qualification, proposal, negotiation, won,
        lost), each present even when empty, with count and per-currency totals of
