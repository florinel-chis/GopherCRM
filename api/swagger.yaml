      title:
        description: Deal title.
        example: Acme rollout 2027
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.QuoteJSON:
    properties:
      closed_at:
        description: |-
          When the quote was accepted, rejected or expired (UTC); cleared on sent
          to draft. Omitted when not set. Read-only.
        example: "2026-10-09T15:30:00Z"
        readOnly: true
        type: string
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      currency:
        description: |-
          ISO 4217 code shared by every line: exactly three upper-case ASCII
          letters. Defaults to the deals.default_currency setting (EUR as
          shipped); can change only while the quote has no lines.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteCustomerSummary'
        description: |-
          Display summary of the linked customer (never its contact details).
          Omitted when the quote has no customer or the customer was erased.
      customer_id:
        description: |-
          Customer the quote is addressed to (the email recipient). Omitted when
          there is none, which happens when the quote was created from a deal
          without a customer.
        example: 31
        type: integer
      deal:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteDealSummary'
        description: |-
          Summary of the deal the quote grew from. Omitted when there is none or
          the deal was deleted.
      deal_id:
        description: |-
          Deal the quote grew from; set on create only, never editable. Omitted
          when there is none.
        example: 88
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      discount_cents:
        description: |-
          subtotal_cents minus total_cents: the money taken off by the per-line
          discounts, in minor units. Computed; read-only.
        example: 30000
        readOnly: true
        type: integer
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      last_emailed_at:
        description: |-
          When the quote was last emailed successfully (UTC). Omitted when never.
          Read-only.
        example: "2026-10-02T10:05:00Z"
        readOnly: true
        type: string
      lines:
        description: |-
          The priced lines ordered by position, then id. Present on the detail
          and write responses; an empty array (never null) in lists, which do not
          load lines.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteLine'
        type: array
      notes:
        description: |-
          Free-text notes, at most 65535 bytes (UTF-8 bytes, not characters).
          Included in the quote email.
        example: Prices exclude VAT.
        type: string
      number:
        description: |-
          Human-readable quote number: Q- followed by the id zero-padded to six
          digits. Computed; read-only.
        example: Q-000042
        readOnly: true
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteOwnerSummary'
        description: |-
          Summary of the owner (no email). Omitted when the owner account no
          longer exists.
      owner_id:
        description: |-
          Staff user owning the quote. Defaults to the caller; only an admin may
          name somebody else. Sales users see only their own quotes.
        example: 7
        type: integer
      sent_at:
        description: |-
          When the quote last moved draft to sent (UTC); cleared on sent to draft.
          Omitted when not set. Read-only.
        example: "2026-10-02T10:00:00Z"
        readOnly: true
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteStatus'
        description: |-
          Lifecycle status. Always draft on create; changed only through POST
          /quotes/{id}/status.
        example: draft
      subtotal_cents:
        description: |-
          Sum of quantity x unit_price_cents over the lines, in minor units.
          Computed by the server on every line change; read-only.
        example: 240000
        readOnly: true
        type: integer
      title:
        description: Quote title, trimmed, 1 to 200 characters. Required.
        example: Acme rollout - phase 1
        type: string
      total_cents:
        description: |-
          Sum of the lines' line_total_cents, in minor units, at most
          1000000000000 (10^12). Computed; read-only.
        example: 210000
        readOnly: true
        type: integer
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      valid_until:
        description: |-
          Last day the offer is valid, a calendar date YYYY-MM-DD. Omitted when
          not set. Accepting the quote is refused once this date lies before
          today (server's local date); expiry itself is never automatic.
        example: "2026-12-31"
        format: date
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.QuoteLine:
    properties:
      created_at:
        description: When the line was added (UTC).
        example: "2026-10-01T09:00:00Z"
        type: string
      description:
        description: |-
          Line text: the product name at the time the line was added unless
          overridden. Trimmed, 1 to 255 characters.
        example: Annual support plan
        type: string
      discount_bp:
        description: Per-line discount in basis points, 0 to 10000 (1250 = 12.5 percent).
        example: 1250
        maximum: 10000
        minimum: 0
        type: integer
      id:
        description: Line id.
        example: 501
        type: integer
      line_total_cents:
        description: |-
          quantity x unit_price_cents x (10000 - discount_bp) / 10000, rounded half
          up to a whole minor unit. Computed by the server; read-only.
        example: 210000
        readOnly: true
        type: integer
      position:
        description: |-
          1-based display order. A new line gets the highest position plus one;
          positions are not renumbered and need not be unique.
        example: 1
        minimum: 1
        type: integer
      product:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Product'
        description: Never loaded by the quote endpoints, so always omitted.
      product_id:
        description: |-
          The product the line was priced from. The product may since have been
          changed, deactivated or deleted; the line keeps its copies.
        example: 9
        type: integer
      quantity:
        description: Number of units, 1 to 1000000.
        example: 2
        maximum: 1000000
        minimum: 1
        type: integer
      quote_id:
        description: The quote the line belongs to.
        example: 42
        type: integer
      unit_price_cents:
        description: |-
          Price per unit in minor units of the quote's currency, 0 to
          1000000000000: the product's price at the time the line was added
          unless overridden.
        example: 120000
        maximum: 1000000000000
        minimum: 0
        type: integer
      updated_at:
        description: When the line was last changed (UTC).
        example: "2026-10-01T09:05:00Z"
        type: string
    type: object
