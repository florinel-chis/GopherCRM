            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
              type: object
        "400":
          description: 'VALIDATION_ERROR (message ''Validation failed''): a binding
            rule failed; error.details maps the Go field name (for example FirstName)
            to a message. BAD_REQUEST: the body is not valid JSON for the schema (''Invalid
            request format''). BAD_REQUEST: a value longer than its column (''<field>
            is too long (at most N characters)'' or the notes byte limit), a blank
            name, a domain that is not a host, or a website that is not an http(s)
            URL. INVALID_REFERENCE: owner_id names no live user'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: the Authorization header is missing or is neither
            Bearer <jwt> nor ApiKey <key> (''Missing or invalid authorization header''),
            or the credential is invalid, expired or belongs to a deactivated account
            (''Invalid credentials'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN ''Insufficient permissions'': the caller is not
            admin or sales; or a sales user named another owner (''You can only assign
            companies to yourself'')'
          schema:
            allOf:
