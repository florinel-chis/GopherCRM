    put:
      consumes:
      - application/json
      description: 'Partially update a task: absent or empty fields are left unchanged
        (title, description, due_date and the links cannot be cleared this way). Roles:
        every authenticated role; admins may update any task, every other role only
        tasks assigned to them. Only admins may change assigned_to_id; sending the
        current assignee back is not a reassignment. A completed task cannot be moved
        to another status. A task cannot link both a lead and a customer. A lead_id
        that is sent must name a lead the caller may see (a hidden lead is 404 like
        a missing one), even when it equals the stored link, so sending lead ids cannot
        reveal a hidden link; a stored link is kept unchecked when both link fields
        are absent. Sending customer_id without lead_id replaces the association:
        the lead link is cleared and the customer link set after validation, whether
        or not the caller could see the old lead. label_ids, when present, replaces
        the whole label set (an empty array clears it); absent leaves the labels untouched;
        any id that matches no label rejects the whole request. The order of checks:
        id, body binding, task lookup, ownership, reassignment permission, then assignee,
        lead, customer, conflict, completed status, labels; any failure leaves the
        task unchanged. No automation event is produced. lead_id and lead are omitted
        whenever the caller may not see the linked lead (admins see every lead, sales
        users only the leads they own, every other role none), decided again on every
        read.'
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: request
        required: true
