  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Rotates the session: the presented refresh token is revoked and
        a fresh JWT, refresh token and the user are returned — the same shape as login.
        Any invalid token (unknown, expired, revoked, or belonging to a deactivated
        or erased account) yields the same generic 401; the reason is never disclosed.
        Replaying a consumed token always fails, so clients must persist the replacement
        from every response.'
      parameters:
      - description: Refresh request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RefreshRequest'
      produces:
