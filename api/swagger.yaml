info:
  contact: {}
  description: CRM API for managing users, leads, customers, companies, deals, products,
    quotes, tickets, tasks and API keys.
  title: GopherCRM API
  version: 1.2.0
paths:
  /aeo/citations:
    get:
      description: 'Which sources the answers cite over the requested window: the
        owned-domain citation rate, the per-company citation and brand-mention rates
        (the brand first, then each competitor in profile order) and the twenty most
        cited domains, ordered by citation count descending. Windows are 7, 30 or
        90 days; anything else falls back to 30.'
      parameters:
      - default: 30
        description: Reporting window in days (7, 30 or 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Citation report retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitationsReport'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - Admin, sales or support role required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: The brand profile has not been configured yet
          schema:
