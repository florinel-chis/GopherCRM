basePath: /api/v1
definitions:
  github_com_florinel-chis_gophercrm_internal_models.AEOAnswer:
    properties:
      answer_text:
        description: |-
          Full answer text as returned by the engine (often markdown). Empty when
          the call failed.
        example: For a small team, Acme CRM and Globex CRM are popular self-hosted
          options...
        readOnly: true
        type: string
      attempt:
        description: Attempt number; always 1 (calls are not retried).
        example: 1
        readOnly: true
        type: integer
      brand_mentioned:
        description: |-
          Whether the brand name or one of its aliases appears in the answer as a
          whole word (case-insensitive). False for failed calls.
        example: true
        readOnly: true
        type: boolean
      citations:
        description: URLs cited by the answer, de-duplicated. Always an array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitation'
        readOnly: true
        type: array
      competitor_mentions:
        additionalProperties:
          type: integer
        description: |-
          Occurrences per competitor name in answer_text (whole-word,
          case-insensitive, names and aliases counted together). Competitors that
          were not mentioned are absent; always an object, empty for failed calls.
        readOnly: true
        type: object
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      error:
        description: |-
          Sanitized failure description ("<engine>: <reason>", optionally with
          "(HTTP <status>)"); omitted when the call succeeded.
        example: 'openai: request timed out'
        readOnly: true
        type: string
      first_mention_pos:
        description: |-
          Character (Unicode code point) offset of the first brand mention in
          answer_text, 0-based; -1 when the brand is not mentioned or the call
          failed.
        example: 23
        minimum: -1
        readOnly: true
        type: integer
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      latency_ms:
        description: Wall-clock duration of the provider call in milliseconds.
        example: 2350
        readOnly: true
        type: integer
      model:
        description: Model id the engine was called with, as configured at the time.
        example: claude-opus-5
        readOnly: true
        type: string
      prompt_id:
        description: ID of the prompt that was asked.
        example: 3
        readOnly: true
        type: integer
      provider:
        description: |-
          Engine that answered: anthropic, openai, gemini, kimi or perplexity, or
          the custom engine's operator-configured name (AEO_CUSTOM_NAME, "custom"
          when unset). Not a closed set.
        example: anthropic
        readOnly: true
        type: string
      run_id:
        description: ID of the run this answer belongs to.
        example: 12
        readOnly: true
        type: integer
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOCitation:
    properties:
      answer_id:
        description: ID of the answer that cited the URL.
        example: 88
        readOnly: true
        type: integer
      competitor_name:
        description: |-
          Name of the competitor whose domain (or a subdomain of it) was cited, as
          configured when the answer was analysed; omitted when none matched.
        example: Globex CRM
        readOnly: true
        type: string
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      domain:
        description: Host of the URL, lower-cased, without a leading "www.".
        example: docs.acme.example
        readOnly: true
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      is_owned:
        description: |-
          Whether the host is one of the profile's owned domains or a subdomain of
          one, as configured when the answer was analysed.
        example: true
        readOnly: true
        type: boolean
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      url:
        description: |-
          Cited URL, with trailing punctuation removed. URLs longer than 1024
          characters are not stored.
        example: https://docs.acme.example/self-hosting
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOCitationCompanyStat:
    properties:
      brand_mention_rate:
        description: |-
          with_brand_mention / citations as a percentage, 0..100 with one decimal;
          0 without citations.
        example: 83.3
        maximum: 100
        minimum: 0
        type: number
      citation_rate:
        description: |-
          citations as a percentage of all citations in the window, 0..100 with
          one decimal.
        example: 22.5
        maximum: 100
        minimum: 0
        type: number
      citations:
        description: Citations of this company's domains in the window.
        example: 18
        type: integer
      company:
        description: |-
          Company name: the brand (citations of owned domains) or a competitor
          (citations of its domain).
        example: Acme CRM
        type: string
      is_brand:
        description: True for the brand's own row.
        example: true
        type: boolean
      with_brand_mention:
        description: Of those citations, the ones in answers that also mention the
          brand.
        example: 15
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOCitationDomainStat:
    properties:
      brand_mention_rate:
        description: with_brand_mention / citations as a percentage, 0..100 with one
          decimal.
        example: 88.9
        maximum: 100
        minimum: 0
        type: number
      citation_rate:
        description: |-
          citations as a percentage of all citations in the window, 0..100 with
          one decimal.
        example: 11.3
        maximum: 100
        minimum: 0
        type: number
      citations:
        description: Citations of this host in the window.
        example: 9
        type: integer
      company:
        description: |-
          Company the host is attributed to: the brand name for an owned domain,
          the competitor name for a competitor domain, empty otherwise.
        example: Acme CRM
        type: string
      domain:
        description: Cited host (lower-cased, no leading "www.").
        example: docs.acme.example
        type: string
      is_owned:
        description: Whether the host is an owned domain (or a subdomain of one).
        example: true
        type: boolean
      with_brand_mention:
        description: Of those citations, the ones in answers that also mention the
          brand.
        example: 8
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOCitationsReport:
    properties:
      answers_with_citations:
        description: Answers in the window with at least one citation.
        example: 47
        type: integer
      by_company:
        description: |-
          One row for the brand, then one per competitor in profile order,
          including companies with no citations. Empty before a profile exists.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitationCompanyStat'
        type: array
      from:
        description: First day of the window (UTC, YYYY-MM-DD, inclusive).
        example: "2026-10-02"
        format: date
        type: string
      owned_citation_rate:
        description: |-
          Citations of owned domains as a percentage of all citations, 0..100
          with one decimal; 0 without citations.
        example: 22.5
        maximum: 100
        minimum: 0
        type: number
      to:
        description: 'Exclusive end of the window (UTC, YYYY-MM-DD): the day after
          today.'
        example: "2026-11-01"
        format: date
        type: string
      top_domains:
        description: |-
          The 20 most cited hosts, by citation count descending, then host name.
          A host is listed once per attribution (owned flag and competitor name),
          so a host whose attribution changed between profile edits can appear
          twice. Always an array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCitationDomainStat'
        type: array
      total_answers:
        description: Non-error answers recorded in the window (failed calls excluded).
        example: 116
        type: integer
      total_citations:
        description: Citations extracted from the non-error answers in the window.
        example: 80
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOCompetitor:
    properties:
      aliases:
        description: |-
          Alternative spellings that also count as a mention of this competitor.
          Trimmed, blanks dropped, de-duplicated case-insensitively; always an
          array, empty when none.
        example:
        - Globex
        - Globex Corporation
        items:
          type: string
        type: array
      domain:
        description: |-
          Competitor website as a bare host (lower-cased, scheme, path and a
          leading "www." removed). Citations of this host or any of its subdomains
          are attributed to the competitor. Empty when not set.
        example: globex.example
        maxLength: 255
        type: string
      name:
        description: |-
          Competitor name, trimmed. Counted as a mention when it appears in an
          answer as a whole word, case-insensitively. Competitors saved with a blank
          name are dropped.
        example: Globex CRM
        maxLength: 120
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOCompetitorTimelinePoint:
    properties:
      by_company:
        additionalProperties:
          format: float64
          type: number
        description: |-
          Per company (brand and each competitor, keyed by name): the share of
          that day's non-error answers mentioning the company, percentage 0..100
          with one decimal. Empty object on a day without answers.
        type: object
      day:
        description: UTC calendar day, YYYY-MM-DD. Every day of the window is present.
        example: "2026-10-30"
        format: date
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEODashboard:
    properties:
      brand_mentions:
        description: Non-error answers in the window that mention the brand.
        example: 53
        type: integer
      by_provider:
        description: Visibility per engine, sorted by engine name. Always an array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOProviderVisibility'
        type: array
      competitor_timeline:
        description: |-
          One point per UTC day of the window with per-company visibility, oldest
          first. Always an array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCompetitorTimelinePoint'
        type: array
      days:
        description: 'Window length in days: 7, 30 or 90.'
        enum:
        - 7
        - 30
        - 90
        example: 30
        type: integer
      failed_answers:
        description: |-
          Answers in the window that record a failed provider call. They are
          excluded from every percentage.
        example: 4
        type: integer
      from:
        description: First day of the window (UTC, YYYY-MM-DD, inclusive).
        example: "2026-10-02"
        format: date
        type: string
      last_run_at:
        description: |-
          When the most recent run (in any window) finished, or started if it is
          still running (RFC 3339); omitted when no run exists.
        example: "2026-10-30T06:03:41Z"
        type: string
      share_of_voice:
        description: Share of voice across the brand and its competitors. Always an
          array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOShareOfVoiceEntry'
        type: array
      timeline:
        description: One point per UTC day of the window, oldest first. Always an
          array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOTimelinePoint'
        type: array
      to:
        description: 'Exclusive end of the window (UTC, YYYY-MM-DD): the day after
          today.'
        example: "2026-11-01"
        format: date
        type: string
      total_answers:
        description: All answers recorded in the window, failed calls included.
        example: 120
        type: integer
      visibility:
        description: |-
          brand_mentions as a percentage of the non-error answers, 0..100 with
          one decimal; 0 without answers.
        example: 45.7
        maximum: 100
        minimum: 0
        type: number
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOProfile:
    properties:
      brand_aliases:
        description: |-
          Alternative brand spellings that also count as a brand mention. Trimmed,
          blanks dropped, de-duplicated case-insensitively; always an array.
        example:
        - Acme
        - AcmeCRM
        items:
          type: string
        type: array
      brand_name:
        description: |-
          Brand name searched for in every answer (whole word, case-insensitive).
          Trimmed; required, at most 120 characters.
        example: Acme CRM
        maxLength: 120
        type: string
      competitors:
        description: |-
          Tracked competitors in the order they were saved; that order is the
          order of the comparison tables in the dashboard and citation report.
          Always an array.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AEOCompetitor'
        type: array
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: |-
          What the business does, in plain words. Used only as context for prompt
          generation. Trimmed; at most 2000 characters; empty when not set.
        example: Self-hosted CRM for small sales and support teams.
        maxLength: 2000
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      owned_domains:
        description: |-
          Domains the brand owns, as bare hosts (lower-cased, scheme, path and a
          leading "www." removed). A citation of one of these hosts or of any
          subdomain counts as an owned citation. Always an array.
        example:
        - acme.example
        - docs.acme.example
        items:
          type: string
        type: array
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOPrompt:
    properties:
      answer_count:
        description: |-
          Number of non-error answers for this prompt in the requested window.
          Computed per request; filled only by the list endpoint.
        example: 40
        readOnly: true
        type: integer
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      created_by_id:
        description: |-
          ID of the user who created the prompt. Server-assigned; omitted when
          unknown.
        example: 1
        readOnly: true
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      is_active:
        description: |-
          Whether the prompt is included in full runs (POST /aeo/runs and the
          daily schedule). New prompts are always active; toggled through
          PUT /aeo/prompts/{id}. At most 100 prompts may be active at once.
        example: true
        type: boolean
      last_run_at:
        description: |-
          Time of the most recent answer for this prompt in the requested window
          (RFC 3339). Filled only by the list endpoint; omitted when there is none.
        example: "2026-10-30T06:00:12Z"
        readOnly: true
        type: string
      mention_count:
        description: |-
          Number of those answers that mention the brand. Computed per request;
          filled only by the list endpoint.
        example: 17
        readOnly: true
        type: integer
      text:
        description: |-
          The question sent to every configured engine. Trimmed, 1 to 500
          characters, unique case-insensitively among live (not deleted) prompts.
        example: What is the best self-hosted CRM for a small sales team?
        maxLength: 500
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      visibility:
        description: |-
          Share of the non-error answers in the requested window (?days=) that
          mention the brand, as a percentage 0..100 rounded to one decimal; 0 when
          there are no answers. Computed per request, never stored. Only the list
          endpoint fills it; other responses carry 0.
        example: 42.5
        maximum: 100
        minimum: 0
        readOnly: true
        type: number
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOProviderStatus:
    properties:
      configured:
        description: |-
          Whether the engine takes part in runs: an API key is set for the five
          named engines, a base URL for the custom engine. Keys are never returned.
        example: true
        type: boolean
      model:
        description: |-
          Model id the engine is called with (admin setting first, then the
          AEO_<ENGINE>_MODEL environment variable, then the built-in default).
          Empty when the custom engine has no model configured.
        example: claude-opus-5
        type: string
      name:
        description: |-
          Engine name: anthropic, openai, gemini, kimi, perplexity, and last the
          custom engine under its operator-configured name (AEO_CUSTOM_NAME,
          "custom" when unset). Not a closed set.
        example: anthropic
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOProviderVisibility:
    properties:
      answers:
        description: Non-error answers from this engine in the window.
        example: 30
        type: integer
      mentions:
        description: Of those, answers that mention the brand.
        example: 12
        type: integer
      provider:
        description: |-
          Engine name as stored on the answers (see AEOAnswer.provider). Only
          engines with at least one non-error answer in the window are listed,
          sorted by name.
        example: openai
        type: string
      visibility:
        description: mentions / answers as a percentage 0..100, one decimal.
        example: 40
        maximum: 100
        minimum: 0
        type: number
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEORun:
    properties:
      completed_at:
        description: |-
          When the run reached a terminal status (RFC 3339); omitted while it is
          running.
        example: "2026-10-30T06:03:41Z"
        readOnly: true
        type: string
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      failed_queries:
        description: |-
          Number of provider calls that failed or whose answer could not be
          stored. 0 while running.
        example: 0
        readOnly: true
        type: integer
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      started_at:
        description: When the run was started (UTC, RFC 3339).
        example: "2026-10-30T06:00:00Z"
        readOnly: true
        type: string
      status:
        description: |-
          Run state. "running" while provider calls are in flight; then
          "completed" (no call failed), "partial" (some failed) or "failed" (every
          call failed). A run interrupted by shutdown ends "failed" when no answer
          was recorded and "partial" otherwise. A run still "running" after 6
          hours, or left running by a previous process, is marked "failed".
        enum:
        - running
        - completed
        - failed
        - partial
        example: running
        readOnly: true
        type: string
      total_queries:
        description: |-
          Number of provider calls in the run: prompts in the run times the
          engines configured when it started.
        example: 24
        readOnly: true
        type: integer
      trigger:
        description: |-
          What started the run: "manual" for POST /aeo/runs and
          POST /aeo/prompts/{id}/run, "scheduled" for the daily scheduler.
        enum:
        - manual
        - scheduled
        example: manual
        readOnly: true
        type: string
      triggered_by_id:
        description: ID of the user who started a manual run; omitted for scheduled
          runs.
        example: 1
        readOnly: true
        type: integer
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOShareOfVoiceEntry:
    properties:
      company:
        description: |-
          Company name: the brand first, then each competitor in profile order.
          Before a profile exists, the competitor names found in the answers,
          alphabetically.
        example: Acme CRM
        type: string
      is_brand:
        description: True for the brand's own entry.
        example: true
        type: boolean
      mentions:
        description: |-
          Non-error answers in the window that mention this company (counted once
          per answer, however often the name occurs).
        example: 55
        type: integer
      share:
        description: |-
          This company's mentions as a percentage of all companies' mentions in
          the table, 0..100 with one decimal.
        example: 61.1
        maximum: 100
        minimum: 0
        type: number
      visibility:
        description: |-
          This company's mentions as a percentage of all non-error answers in the
          window, 0..100 with one decimal.
        example: 45.8
        maximum: 100
        minimum: 0
        type: number
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AEOTimelinePoint:
    properties:
      by_provider:
        additionalProperties:
          format: float64
          type: number
        description: |-
          Visibility per engine name that day (percentage 0..100, one decimal).
          Only engines with a non-error answer that day are present; empty object
          on a day without answers.
        type: object
      day:
        description: UTC calendar day, YYYY-MM-DD. Every day of the window is present.
        example: "2026-10-30"
        format: date
        type: string
      overall:
        description: |-
          Visibility over all engines that day (percentage 0..100, one decimal);
          0 on a day without answers.
        example: 45.8
        maximum: 100
        minimum: 0
        type: number
    type: object
  github_com_florinel-chis_gophercrm_internal_models.APIKey:
    description: 'A personal API key, presented as `Authorization: ApiKey <key>`.
      Only a hash of the key is stored: the plaintext is returned once, by POST /api-keys,
      and never again.'
    properties:
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      expires_at:
        description: |-
          Expiry time (RFC 3339); requests with the key are rejected from this
          instant on. Absent when the key never expires. Set only at creation.
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      is_active:
        description: |-
          False once the key is revoked (DELETE /api-keys/{id} or PUT with
          is_active=false); the owner can set it back to true. An inactive key is
          rejected at authentication.
        example: true
        type: boolean
      last_used_at:
        description: |-
          Time the key last authenticated a request (RFC 3339), updated on a best-
          effort basis. Absent when the key has never been used. Read-only.
        example: "2026-10-30T11:00:00Z"
        readOnly: true
        type: string
      name:
        description: Owner-chosen label, 3 to 100 characters.
        example: CI pipeline
        type: string
      prefix:
        description: |-
          First 8 hexadecimal characters of the key's random part (the characters
          after "gcrm_"), so a key can be recognised without exposing it. Read-only.
        example: 3f9a1c2b
        readOnly: true
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      user:
        description: |-
          Not populated by the API-key endpoints: always serialised as an empty
          placeholder user object (id 0, every string empty, role "" included),
          so it is documented as a plain object rather than a User. Use user_id.
        type: object
      user_id:
        description: ID of the owning user, always the account that created the key.
          Read-only.
        example: 7
        readOnly: true
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationDryRunReport:
    description: The simulated outcome of an automation rule (or an unsaved draft)
      against one record. Nothing is written, sent or notified.
    properties:
      draft:
        description: True when an unsaved rule body was simulated (POST /automation/rules/dry-run).
        example: false
        type: boolean
      entity_id:
        description: ID of the record simulated against.
        example: 12
        type: integer
      entity_type:
        description: Kind of the record simulated against.
        enum:
        - lead
        - deal
        example: lead
        type: string
      rule_id:
        description: ID of the simulated rule; 0 for a draft.
        example: 12
        type: integer
      rule_version:
        description: Version of the simulated rule; 0 for a draft.
        example: 3
        type: integer
      simulated_end:
        description: 'The simulated end (RFC 3339, UTC): the start plus every wait
          that was reached.'
        example: "2026-11-02T08:00:00Z"
        type: string
      simulated_start:
        description: 'The simulated start (RFC 3339, UTC): the time of the request.'
        example: "2026-10-31T08:00:00Z"
        type: string
      steps:
        description: The steps that would run, in execution order; always an array,
          possibly empty.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationDryRunStep'
        type: array
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationDryRunStep:
    description: 'One line of a dry-run report: what a step would do, at the simulated
      time. Nothing in it was written.'
    properties:
      details:
        additionalProperties: true
        description: 'What the step would touch, by step type: wait resume_at; condition
          result, branch (next, jump or stop) and next_position for a jump; create_task
          assignee_id, due_date and lead_id or customer_id; assign_owner from_owner_id
          and to_owner_id; send_email and notify recipient_id. Always an object, possibly
          empty.'
        type: object
      error_code:
        description: recipient_unavailable when the step would be skipped; omitted
          otherwise.
        enum:
        - recipient_unavailable
        example: recipient_unavailable
        type: string
      outcome:
        description: 'Would-be result: succeeded, waiting (a wait step; the simulated
          clock moves on), or skipped when no active staff recipient or owner is available.'
        enum:
        - succeeded
        - waiting
        - skipped
        example: succeeded
        type: string
      position:
        description: 1-based position of the step. Steps skipped by a condition branch
          do not appear.
        example: 1
        type: integer
      simulated_at:
        description: 'The simulated time the step would run at (RFC 3339, UTC): the
          dry run''s start plus every earlier wait.'
        example: "2026-10-31T08:00:00Z"
        type: string
      step_type:
        description: Type of the step.
        enum:
        - wait
        - condition
        - create_task
        - assign_owner
        - send_email
        - notify
        example: create_task
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationRule:
    description: 'An admin-defined follow-up rule: a lead or deal trigger (or a daily
      UTC schedule) and up to 20 ordered steps.'
    properties:
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      created_by_id:
        description: ID of the admin who created the rule; omitted when unknown. Read-only.
        example: 1
        readOnly: true
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: Free-text description for admins, at most 65535 bytes; an empty
          string when none.
        example: Creates a call-back task for every lead from the website.
        type: string
      enabled:
        description: Whether the rule starts new runs. A new rule is disabled unless
          the create body sends true; a PUT without enabled keeps the stored value.
        example: true
        type: boolean
      entity_type:
        description: Kind of record the rule runs on.
        enum:
        - lead
        - deal
        example: lead
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      name:
        description: Rule name, trimmed, 1 to 200 characters.
        example: Welcome new web leads
        maxLength: 200
        type: string
      schedule_completed_on:
        description: 'Schedule rules: the UTC day (YYYY-MM-DD) whose pass last finished;
          omitted when none. Server-maintained, read-only.'
        example: "2026-10-30"
        readOnly: true
        type: string
      schedule_cursor:
        description: 'Schedule rules: the last record id handed out in the pass in
          progress; 0 otherwise. Server-maintained, read-only.'
        example: 0
        readOnly: true
        type: integer
      schedule_pass_on:
        description: 'Schedule rules: the UTC day (YYYY-MM-DD) of the pass in progress;
          omitted when none. Server-maintained, read-only.'
        example: "2026-10-31"
        readOnly: true
        type: string
      steps:
        description: The ordered steps, by position (1 to 20 of them). Replaced wholesale,
          with new ids, by every PUT.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationStep'
        type: array
      trigger:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationTrigger'
        description: The trigger configuration; which fields apply depends on trigger_type.
      trigger_type:
        description: What starts a run. Lead rules take lead_created, lead_updated,
          lead_status_changed or schedule; deal rules take deal_created, deal_updated,
          deal_stage_changed or schedule. Writes made by an automation step never
          start a run.
        enum:
        - lead_created
        - lead_updated
        - lead_status_changed
        - deal_created
        - deal_updated
        - deal_stage_changed
        - schedule
        example: lead_created
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      version:
        description: Starts at 1 and is incremented by every PUT /automation/rules/{id}
          (enabling or disabling does not change it); every run records the version
          it started from. Read-only.
        example: 3
        readOnly: true
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationRun:
    description: One execution of an automation rule against one lead or deal. It
      never carries the rule's trigger or steps, only the rule's name.
    properties:
      attempts:
        description: Step attempts that failed or were released so far (never reset).
          An attempt that fails with attempts already at 2 fails the run with error_code
          step_failed. Read-only.
        example: 0
        readOnly: true
        type: integer
      cancel_reason:
        description: 'Why a cancelled run was cancelled: the rule was changed, disabled
          or deleted, an admin cancelled it (manual), or the record was deleted. Omitted
          unless the run is cancelled. Read-only.'
        enum:
        - rule_changed
        - rule_disabled
        - rule_deleted
        - manual
        - record_deleted
        example: manual
        readOnly: true
        type: string
      claimed_at:
        description: When an executor last claimed the run (RFC 3339); omitted when
          not set. Read-only.
        example: "2026-10-30T08:00:01Z"
        readOnly: true
        type: string
      created_at:
        description: When the run was started (RFC 3339). Read-only.
        example: "2026-10-30T08:00:00Z"
        readOnly: true
        type: string
      dedupe_key:
        description: 'Unique key that stops a run being started twice: evt:<event_id>:rule:<rule_id>
          for an event run, sch:<rule_id>:<YYYY-MM-DD>:<entity_id> for a schedule
          run. Read-only.'
        example: evt:1042:rule:12
        readOnly: true
        type: string
      entity_id:
        description: ID of the lead or deal the run acts on. Read-only.
        example: 12
        readOnly: true
        type: integer
      entity_type:
        description: Kind of record the run acts on. Read-only.
        enum:
        - lead
        - deal
        example: lead
        readOnly: true
        type: string
      error_code:
        description: 'Why a failed run failed: step_failed (a step kept failing) or
          email_unconfirmed (an email may or may not have been sent and is never retried).
          Omitted unless the run failed. Read-only.'
        enum:
        - step_failed
        - email_unconfirmed
        example: step_failed
        readOnly: true
        type: string
      event_id:
        description: ID of the lead or deal event that started the run; omitted for
          a schedule run. Read-only.
        example: 1042
        readOnly: true
        type: integer
      finished_at:
        description: When the run reached completed, failed or cancelled (RFC 3339);
          omitted while it is active. Read-only.
        example: "2026-10-30T08:00:05Z"
        readOnly: true
        type: string
      id:
        description: Unique identifier of the run. Read-only.
        example: 88
        readOnly: true
        type: integer
      next_position:
        description: 1-based position of the next step to execute. Read-only.
        example: 2
        readOnly: true
        type: integer
      resume_at:
        description: When a waiting run resumes (RFC 3339); omitted when not set.
          Read-only.
        example: "2026-10-31T08:00:00Z"
        readOnly: true
        type: string
      rule_deleted:
        description: True when the rule has been deleted since (or is gone). Read-only.
        example: false
        readOnly: true
        type: boolean
      rule_id:
        description: ID of the rule the run executes. Read-only.
        example: 12
        readOnly: true
        type: integer
      rule_name:
        description: The rule's current name (also for a soft-deleted rule; empty
          when the rule row is gone), filled in by the run reads; it has no column.
          Read-only.
        example: Welcome new web leads
        readOnly: true
        type: string
      rule_version:
        description: The rule version the run was started from. Read-only.
        example: 3
        readOnly: true
        type: integer
      status:
        description: 'Lifecycle status: pending (queued), running (an executor holds
          it), waiting (paused by a wait step until resume_at), and the final completed,
          failed and cancelled. Read-only.'
        enum:
        - pending
        - running
        - waiting
        - completed
        - failed
        - cancelled
        example: waiting
        readOnly: true
        type: string
      steps:
        description: The step log, by position. Only returned by GET /automation/runs/{id}
          and POST /automation/runs/{id}/cancel; omitted from the list. Read-only.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationRunStep'
        readOnly: true
        type: array
      updated_at:
        description: When the run row was last written (RFC 3339). Read-only.
        example: "2026-10-30T08:00:05Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationRunStep:
    description: The log row of one executed step of a run. It holds ids, outcomes
      and error codes, never personal data.
    properties:
      details:
        additionalProperties: true
        description: 'Ids and statuses the step touched, never names or addresses.
          Keys by step type: wait resume_at; condition result, branch (next, jump
          or stop) and next_position for a jump; create_task assignee_id, due_date,
          lead_id or customer_id and task_id; assign_owner from_owner_id and to_owner_id;
          send_email and notify recipient_id, plus notification_id for notify. Always
          an object, possibly empty. Read-only.'
        readOnly: true
        type: object
      error_code:
        description: 'Why the step was skipped or failed: recipient_unavailable (no
          active staff user to receive or own it), mail_failed (delivery failed; the
          run continues) or email_unconfirmed. Omitted otherwise. Read-only.'
        enum:
        - recipient_unavailable
        - mail_failed
        - email_unconfirmed
        example: recipient_unavailable
        readOnly: true
        type: string
      executed_at:
        description: When the step was executed (RFC 3339). Read-only.
        example: "2026-10-30T08:00:02Z"
        readOnly: true
        type: string
      id:
        description: Unique identifier of the log row. Read-only.
        example: 501
        readOnly: true
        type: integer
      outcome:
        description: 'Result: succeeded, skipped (the recipient was unavailable),
          failed (the email could not be delivered, or was left unconfirmed), sending
          (an email is being handed to the mail relay) or waiting (a wait step paused
          the run). Read-only.'
        enum:
        - succeeded
        - skipped
        - failed
        - sending
        - waiting
        example: succeeded
        readOnly: true
        type: string
      position:
        description: 1-based position of the executed step in the rule version the
          run started from. Read-only.
        example: 1
        readOnly: true
        type: integer
      run_id:
        description: ID of the run. Read-only.
        example: 88
        readOnly: true
        type: integer
      step_type:
        description: Type of the executed step. Read-only.
        enum:
        - wait
        - condition
        - create_task
        - assign_owner
        - send_email
        - notify
        example: create_task
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationScheduleFilter:
    description: Narrows the records a schedule rule visits on each daily pass; an
      empty field is no filter.
    properties:
      stage:
        description: 'Deal rules only: visit only deals in this stage. Omitted or
          empty means any stage; set on a lead rule it is refused (invalid_value).'
        enum:
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        example: proposal
        type: string
      status:
        description: 'Lead rules only: visit only leads in this status. Omitted or
          empty means any status; set on a deal rule it is refused (invalid_value).'
        enum:
        - new
        - contacted
        - qualified
        - unqualified
        - converted
        example: contacted
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationStep:
    description: One ordered step of an automation rule.
    properties:
      config:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationStepConfig'
        description: The step configuration as stored, with defaults filled in (recipient
          owner, else stop); which fields apply depends on step_type.
      created_at:
        description: When the step row was written (RFC 3339). Read-only.
        example: "2026-10-30T08:00:00Z"
        readOnly: true
        type: string
      id:
        description: Unique identifier of the step row. Read-only; a PUT of the rule
          replaces the steps with new ids.
        example: 301
        readOnly: true
        type: integer
      position:
        description: 1-based position of the step in the rule, the order of the steps
          array in the request. Read-only.
        example: 1
        readOnly: true
        type: integer
      rule_id:
        description: ID of the rule the step belongs to. Read-only.
        example: 12
        readOnly: true
        type: integer
      step_type:
        description: 'What the step does: wait pauses the run, condition tests the
          record and stops or jumps when false, create_task creates a task, assign_owner
          changes the record''s owner, send_email emails a staff user, notify creates
          an in-app notification.'
        enum:
        - wait
        - condition
        - create_task
        - assign_owner
        - send_email
        - notify
        example: create_task
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationStepConfig:
    description: 'Configuration of one automation step. Which fields apply depends
      on step_type: wait (duration_minutes), condition (field, operator, value, currency,
      else, else_position), create_task (title, description, priority, due_in_days,
      recipient, user_id), assign_owner (user_id), send_email (subject, body, recipient,
      user_id), notify (title, body, recipient, user_id).'
    properties:
      body:
        description: 'send_email (required) and notify (optional): the body template,
          at most 65535 bytes, with the notify placeholders. An email is sent as plain
          text to the recipient''s address.'
        example: Please contact {{ lead.first_name }} {{ lead.last_name }} today.
        type: string
      currency:
        description: 'condition on amount_cents only: the ISO currency (three upper-case
          letters) the amount is in. Required for amount_cents and refused on any
          other field; a deal in another currency makes the condition false, amounts
          in different currencies are never compared.'
        example: EUR
        type: string
      description:
        description: 'create_task only: the task description template, at most 65535
          bytes, with the task placeholders of title.'
        example: Lead status is {{ lead.status }}.
        type: string
      due_in_days:
        description: 'create_task only: the new task is due this many days after the
          step runs, 0 to 365.'
        example: 2
        maximum: 365
        minimum: 0
        type: integer
      duration_minutes:
        description: 'wait: how long the run pauses, in minutes, 1 to 129600 (90 days).
          The waits of one rule may add up to at most 90 days.'
        example: 1440
        maximum: 129600
        minimum: 1
        type: integer
      else:
        description: 'condition: what happens when the condition is false. stop ends
          the run; jump continues at else_position. Empty is stored as stop.'
        enum:
        - stop
        - jump
        example: jump
        type: string
      else_position:
        description: 'condition with else jump only: the 1-based position to continue
          at, which must come after the condition step and be at most the step count.
          Refused (not_applicable) with else stop.'
        example: 4
        maximum: 20
        minimum: 2
        type: integer
      field:
        description: 'condition: the record field compared. Lead rules: status, source,
          classification, company (compared as strings) and owner_id (a number). Deal
          rules: stage, source, currency (strings), amount_cents (money, needs currency)
          and probability, owner_id (numbers). Names, addresses and notes are never
          comparable.'
        enum:
        - status
        - source
        - classification
        - company
        - owner_id
        - stage
        - currency
        - amount_cents
        - probability
        example: status
        type: string
      operator:
        description: 'condition: the comparison. String fields take eq, neq, in, not_in,
          contains (case-insensitive substring), is_empty and is_not_empty; number
          and money fields take eq, neq, gt, gte, lt and lte.'
        enum:
        - eq
        - neq
        - in
        - not_in
        - contains
        - is_empty
        - is_not_empty
        - gt
        - gte
        - lt
        - lte
        example: eq
        type: string
      priority:
        description: 'create_task only: the new task''s priority; empty means medium.'
        enum:
        - low
        - medium
        - high
        example: high
        type: string
      recipient:
        description: 'create_task, send_email, notify: who receives the task, the
          email or the notification. owner is the record''s owner at execution time;
          user is the staff user named by user_id. Empty is stored as owner. assign_owner
          always stores user.'
        enum:
        - owner
        - user
        example: owner
        type: string
      subject:
        description: 'send_email only (required): the subject template, at most 255
          characters and no line break, with the notify placeholders.'
        example: Lead {{ lead.first_name }} needs attention
        maxLength: 255
        type: string
      title:
        description: 'create_task and notify (required): the title template, at most
          255 characters and no line break. Placeholders are written as {{ name }}.
          A notify title may use lead.id, lead.first_name, lead.last_name, lead.email,
          lead.phone, lead.company, lead.status, lead.source (lead rules) or deal.id,
          deal.title, deal.stage, deal.amount, deal.currency, deal.source (deal rules),
          plus owner.first_name, owner.last_name, owner.email; a task title only lead.id,
          lead.status, lead.source (lead rules) or the deal placeholders (deal rules).'
        example: Follow up with lead {{ lead.id }}
        maxLength: 255
        type: string
      user_id:
        description: The staff user (active, not a customer) named by recipient user,
          and the new owner of an assign_owner step, where it is required. Refused
          (not_applicable) with recipient owner. An unknown, deactivated or customer
          user is refused with unknown_reference (400 INVALID_REFERENCE when it is
          the first refusal).
        example: 7
        type: integer
      value:
        description: 'condition: the value compared against, as raw JSON whose type
          depends on the operator: a string for eq/neq/contains on a string field,
          a non-empty array of strings for in/not_in, a number for every operator
          on a number or money field (amount_cents in minor units), and no value (omitted
          or null) for is_empty/is_not_empty. The schema therefore names no type;
          an object is always refused.'
    type: object
  github_com_florinel-chis_gophercrm_internal_models.AutomationTrigger:
    description: Trigger configuration of an automation rule. from and to apply to
      status or stage change triggers; hour_utc, filters and stale_days to the schedule
      trigger.
    properties:
      filters:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.AutomationScheduleFilter'
        description: 'Schedule trigger only: narrows the records each pass visits.
          Refused (not_applicable) on an event trigger.'
      from:
        description: 'Only for lead_status_changed and deal_stage_changed: start only
          when the previous value was this lead status (lead rules) or deal stage
          (deal rules). Omitted or empty means any; on any other trigger type it is
          refused (not_applicable).'
        enum:
        - new
        - contacted
        - qualified
        - unqualified
        - converted
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        example: new
        type: string
      hour_utc:
        description: 'Schedule trigger only: the UTC hour (0-23) from which the daily
          pass may start; it starts at the first worker tick at or after that hour.
          Always present in responses (0 for event triggers); a non-zero value on
          an event trigger is refused (not_applicable).'
        example: 8
        maximum: 23
        minimum: 0
        type: integer
      stale_days:
        description: 'Schedule trigger only: visit only records whose updated_at is
          more than this many days old; 0 or omitted means any age. Must not be negative;
          refused (not_applicable) on an event trigger.'
        example: 14
        minimum: 0
        type: integer
      to:
        description: 'Only for lead_status_changed and deal_stage_changed: start only
          when the new value is this lead status (lead rules) or deal stage (deal
          rules). Omitted or empty means any; on any other trigger type it is refused
          (not_applicable).'
        enum:
        - new
        - contacted
        - qualified
        - unqualified
        - converted
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        example: qualified
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.BulkStatusUpdateResult:
    description: 'Result of an all-or-nothing bulk status update: every listed record
      was updated.'
    properties:
      updated:
        description: 'Number of records updated: the count of distinct ids in the
          request (a repeated id is updated once).'
        example: 3
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.Company:
    properties:
      address:
        description: Street address, at most 255 characters.
        example: 1 Industrial Way
        type: string
      city:
        description: City, at most 100 characters.
        example: Springfield
        type: string
      country:
        description: Country, free text, at most 100 characters.
        example: USA
        type: string
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      customer_count:
        description: |-
          Number of live customers linked to the company. Computed by the company
          endpoints; 0 where the company is embedded in another record (a lead's
          company_record, a deal's company). Read-only.
        example: 4
        readOnly: true
        type: integer
      deal_count:
        description: |-
          Number of live deals linked to the company, whoever owns them. Computed
          like customer_count. Read-only.
        example: 2
        readOnly: true
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      domain:
        description: |-
          Normalised domain: lower case, without scheme, path, query, a leading
          "www." or a trailing dot. Empty when not set. Unique among live
          (not deleted) companies.
        example: acme.com
        type: string
      employee_range:
        description: Head-count band, or empty when unknown.
        enum:
        - 1-10
        - 11-50
        - 51-200
        - 201-500
        - 501-1000
        - 1000+
        - ""
        example: 51-200
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      industry:
        description: Industry, free text, at most 100 characters; may be empty.
        example: Manufacturing
        type: string
      lead_count:
        description: |-
          Number of live leads linked to the company, whoever owns them. Computed
          like customer_count. Read-only.
        example: 9
        readOnly: true
        type: integer
      name:
        description: Company name, trimmed, 1 to 200 characters. Required.
        example: Acme Corporation
        type: string
      notes:
        description: Free-text notes, at most 65535 bytes (UTF-8 bytes, not characters).
        example: Key account; renewal in Q3.
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: |-
          The account manager's user record, loaded by the company endpoints;
          omitted when unowned or when the owner account no longer exists.
      owner_id:
        description: Account manager (a user id). Omitted when the company is unowned.
        example: 7
        type: integer
      phone:
        description: Switchboard phone number, free text, at most 50 characters.
        example: +1 555 0100
        type: string
      postal_code:
        description: Postal code, at most 20 characters.
        example: "62701"
        type: string
      state:
        description: State or region, at most 100 characters.
        example: IL
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      website:
        description: Website as entered (trimmed); an http or https URL, or empty.
        example: https://www.acme.com
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.ConfigurationCategory:
    description: Category a configuration entry is listed under.
    enum:
    - general
    - leads
    - customers
    - tickets
    - tasks
    - security
    - integration
    - ui
    - deals
    type: string
    x-enum-varnames:
    - CategoryGeneral
    - CategoryLeads
    - CategoryCustomers
    - CategoryTickets
    - CategoryTasks
    - CategorySecurity
    - CategoryIntegration
    - CategoryUI
    - CategoryDeals
  github_com_florinel-chis_gophercrm_internal_models.ConfigurationType:
    description: 'Declared type of a configuration entry: it decides which JSON values
      PUT /configurations/{key} accepts (string: a JSON string; boolean: true/false;
      integer: a whole number; float, json, array: any JSON value, stored as JSON
      text) and how value is encoded.'
    enum:
    - string
    - boolean
    - integer
    - float
    - json
    - array
    type: string
    x-enum-varnames:
    - ConfigTypeString
    - ConfigTypeBoolean
    - ConfigTypeInteger
    - ConfigTypeFloat
    - ConfigTypeJSON
    - ConfigTypeArray
  github_com_florinel-chis_gophercrm_internal_models.Customer:
    description: 'A customer: a person the business serves, created directly or by
      converting a lead. Deleting one erases its personal data in place (GDPR Article
      17).'
    properties:
      address:
        description: Street address, free text.
        example: Strada Exemplu 1
        type: string
      assigned_to:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: |-
          The account named by assigned_to_id. Not embedded by the customer
          endpoints; absent unless an endpoint loads it.
      assigned_to_id:
        description: |-
          ID of the staff account that manages the relationship; absent while
          unassigned. Set by POST /customers/{id}/assign (admin or sales accounts
          only) or, when leads.conversion.auto_assign_owner is on, by a lead
          conversion to the lead's owner.
        example: 7
        type: integer
      city:
        description: City, free text.
        example: Cluj-Napoca
        type: string
      company:
        description: Free-text company name as entered; independent of company_id.
        example: Acme SRL
        type: string
      company_id:
        description: |-
          ID of the linked company record; absent when the customer has no link.
          Independent of the free-text company field.
        example: 3
        type: integer
      company_record:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
        description: |-
          The company named by company_id, embedded only by some reads (for
          example GET /customers/{id}); absent otherwise.
      country:
        description: Country, free text (no code list is enforced).
        example: Romania
        type: string
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      email:
        description: |-
          Email address, unique among all customers, erased ones included (409 on
          a duplicate). Required on create.
        example: ana.popescu@example.com
        format: email
        type: string
      first_name:
        description: Given name. Required on create.
        example: Ana
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      last_name:
        description: Family name. Required on create.
        example: Popescu
        type: string
      notes:
        description: |-
          Free-text notes. A lead conversion stores the notes sent with the
          conversion request here.
        example: Prefers email contact.
        type: string
      phone:
        description: Phone number, free text; "" when unknown.
        example: +40 721 000 000
        type: string
      position:
        description: Job title, free text.
        example: Purchasing manager
        type: string
      postal_code:
        description: Postal code, free text.
        example: "400000"
        type: string
      state:
        description: State, county or region, free text.
        example: Cluj
        type: string
      tickets:
        description: |-
          Tickets of the customer. Not embedded by the customer endpoints (use
          GET /customers/{id}/tickets); absent unless an endpoint loads them.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Ticket'
        type: array
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: |-
          The login named by user_id, embedded only by some reads (for example
          GET /customers/{id}); absent otherwise.
      user_id:
        description: |-
          ID of the customer's own login (a user account), if any; absent when
          none. No API operation sets it. When it names a customer-role account,
          erasing either erases both. Read-only.
        example: 15
        readOnly: true
        type: integer
      website:
        description: |-
          Web site: "" or an absolute http/https URL of at most 255 characters,
          trimmed by the server.
        example: https://acme.example
        maxLength: 255
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.Deal:
    properties:
      amount_cents:
        description: |-
          Deal value in minor units of currency (cents for EUR), an integer from
          0 to 1000000000000 (10^12). Sums are meaningful per currency only.
        example: 1250000
        maximum: 1000000000000
        minimum: 0
        type: integer
      closed_at:
        description: |-
          When the deal entered won or lost (UTC, RFC 3339). Set by the server on
          entering a closed stage, cleared on returning to an open one; omitted
          while the deal is open. Read-only.
        example: "2026-10-15T09:30:00Z"
        readOnly: true
        type: string
      company:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
        description: |-
          The linked company, loaded by the deal endpoints (its customer_count,
          lead_count and deal_count are 0 here, not computed). Omitted when there
          is no link or the company no longer exists.
      company_id:
        description: |-
          Linked company. Omitted when there is none; cleared when the company
          is deleted.
        example: 12
        type: integer
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      currency:
        description: |-
          ISO 4217 code: exactly three upper-case ASCII letters. Defaults to the
          deals.default_currency setting (EUR as shipped) on create.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Customer'
        description: |-
          The linked customer, loaded by the deal endpoints; omitted when there
          is no link or the customer was erased (soft-deleted).
      customer_id:
        description: |-
          Linked customer. Omitted when there is none. Erasing the customer
          keeps the link.
        example: 31
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      expected_close_date:
        description: |-
          Expected close date as a calendar date, YYYY-MM-DD (no time, no zone).
          Omitted when not set.
        example: "2026-12-31"
        format: date
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      lead:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Lead'
        description: The linked lead, under the same visibility rule as lead_id.
      lead_id:
        description: |-
          Linked lead. Omitted when there is none AND whenever the caller may not
          see that lead (admins see every lead, sales users only the leads they
          own); decided on every read.
        example: 55
        type: integer
      lost_reason:
        description: |-
          Why the deal was lost, at most 255 characters. Kept only while the
          stage is lost; empty otherwise.
        example: ""
        type: string
      notes:
        description: Free-text notes, at most 65535 bytes (UTF-8 bytes, not characters).
        example: Decision expected after the board meeting.
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: The owner's user record, loaded by the deal endpoints.
      owner_id:
        description: |-
          Staff user working the deal. Never null: defaults to the caller; only
          an admin may name somebody else. Sales users see only their own deals.
        example: 7
        type: integer
      probability:
        description: |-
          Win probability in percent, 0 to 100. Takes the stage's default when a
          stage is entered without an explicit value (qualification 10, proposal
          40, negotiation 70); won is always 100 and lost always 0.
        example: 40
        maximum: 100
        minimum: 0
        type: integer
      source:
        description: Where the deal came from, free text, at most 100 characters.
        example: referral
        type: string
      stage:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
        description: |-
          Pipeline stage. Defaults to qualification on create. Every change is
          recorded in the stage history (GET /deals/{id}/history).
        example: proposal
      title:
        description: Deal title, trimmed, 1 to 200 characters. Required.
        example: Acme rollout 2027
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealDashboardPipeline:
    properties:
      stages:
        description: |-
          The pipeline stages, exactly as GET /deals/pipeline returns them for
          the caller (a sales user's own deals only).
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealPipelineStage'
        type: array
      won_this_month:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealWonSummary'
        description: |-
          Deals whose closed_at falls in the current calendar month (UTC) and
          that are in the won stage, for the same owner scope.
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealPipeline:
    properties:
      stages:
        description: |-
          All five stages in pipeline order (qualification, proposal,
          negotiation, won, lost), empty ones included.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealPipelineStage'
        type: array
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealPipelineStage:
    properties:
      count:
        description: Number of live (not deleted) deals in the stage, over all currencies.
        example: 3
        type: integer
      stage:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
        description: |-
          The stage this entry aggregates. The five stages always appear, in
          pipeline order.
        example: proposal
      totals:
        description: |-
          One total per currency, sorted by currency code; an empty array, never
          null, when the stage holds no deal.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealPipelineTotal'
        type: array
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealPipelineTotal:
    properties:
      amount_cents:
        description: |-
          Sum of amount_cents of the stage's live deals in this currency, in
          minor units.
        example: 1250000
        type: integer
      currency:
        description: |-
          ISO 4217 code of this total; one entry per currency present in the
          stage.
        example: EUR
        type: string
      weighted_cents:
        description: |-
          Probability-weighted amount in minor units: round_half_up(sum of
          amount_cents x probability / 100), integer arithmetic, rounded once on
          the sum, never per deal.
        example: 500000
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealStage:
    enum:
    - qualification
    - proposal
    - negotiation
    - won
    - lost
    type: string
    x-enum-varnames:
    - DealStageQualification
    - DealStageProposal
    - DealStageNegotiation
    - DealStageWon
    - DealStageLost
  github_com_florinel-chis_gophercrm_internal_models.DealStageChange:
    properties:
      changed_at:
        description: When the change was written (UTC, RFC 3339).
        example: "2026-10-01T08:00:00Z"
        type: string
      changed_by:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
        description: |-
          The acting user's full record (including email), loaded by GET
          /deals/{id}/history; omitted when that account no longer exists.
      changed_by_id:
        description: User who made the change.
        example: 7
        type: integer
      deal_id:
        description: The deal this row belongs to.
        example: 88
        type: integer
      from_stage:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
        description: |-
          Stage before the change; null on the first row, written when the deal
          was created.
        example: qualification
        x-nullable: true
      id:
        description: History row id, increasing in write order.
        example: 301
        type: integer
      to_stage:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
        description: Stage after the change.
        example: proposal
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealWonSummary:
    properties:
      count:
        description: Number of deals won in the period, over all currencies.
        example: 2
        type: integer
      totals:
        description: |-
          The amounts won per currency, sorted by currency code; an empty array,
          never null, when nothing was won.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealWonTotal'
        type: array
    type: object
  github_com_florinel-chis_gophercrm_internal_models.DealWonTotal:
    properties:
      amount_cents:
        description: |-
          Sum of amount_cents of the deals won in the period in this currency,
          in minor units.
        example: 990000
        type: integer
      currency:
        description: ISO 4217 code of this total.
        example: EUR
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.Form:
    properties:
      allowed_domains:
        description: |-
          Origin allowlist: bare host names with an optional port, lower-cased,
          matched exactly (subdomains must be listed one by one). Empty allows
          every origin. A definition requested from another origin is a 404; a
          submission from another origin is stored as spam (reason domain). At
          most 20, each at most 255 characters. Reads return [] when there are
          none; the POST /forms and PUT /forms/{id} responses echo the request and
          carry null when the list was omitted or sent as null.
        example:
        - www.example.com
        - localhost:5173
        items:
          type: string
        type: array
        x-nullable: true
      captcha_enabled:
        description: |-
          Require a reCAPTCHA v3 token with each submission. Takes effect only
          when the server has both reCAPTCHA keys; otherwise it is ignored.
        example: false
        type: boolean
      confirmation_body:
        description: |-
          Plain-text body of the confirmation mail. The {confirmation_link}
          placeholder is replaced by the link, which is appended when the
          placeholder is missing; empty means a built-in text.
        example: 'Hello, please confirm your address: {confirmation_link}'
        type: string
      confirmation_subject:
        description: |-
          Subject of the confirmation mail, at most 255 characters; empty means
          "Confirm your email address".
        example: Please confirm your email address
        maxLength: 255
        type: string
      consent_text:
        description: |-
          Consent statement shown with the form. When non-empty, a submission must
          carry consent=true or it is rejected with a field error on "consent".
        example: I agree to be contacted about my enquiry.
        type: string
      content_url:
        description: |-
          Link inserted for {content_link} in the follow-up mail (for gated
          content). At most 512 characters; not checked for a scheme.
        example: https://www.example.com/files/guide.pdf
        maxLength: 512
        type: string
      create_lead:
        description: |-
          Whether an accepted submission feeds a lead: the newest live lead with
          the same address gains a note, otherwise a new lead (status new, owner
          default_owner_id, source the form name) is created.
        example: true
        type: boolean
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      created_by_id:
        description: ID of the user who created the form; server-assigned and immutable.
        example: 1
        readOnly: true
        type: integer
      default_owner_id:
        description: |-
          Owner of the leads the form creates; 0 means none. Required when
          create_lead is true; any non-zero value names an active admin or sales
          user (checked on save only).
        example: 2
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: Internal description for staff; never exposed by the public endpoints.
        example: Contact form on the pricing page.
        type: string
      double_opt_in:
        description: |-
          Double opt-in: a submission is stored as pending and a confirmation
          mail with a single-use link valid for 48 hours goes to the submitted
          address; the lead, the notification and the follow-up mail wait until
          the link is confirmed.
        example: false
        type: boolean
      fields:
        description: |-
          Ordered field definitions (1 to 50), normalised on save (names trimmed,
          max_length defaulted and clamped).
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormFieldDef'
        type: array
      follow_up_body:
        description: |-
          Plain-text body of the follow-up mail; {content_link} is replaced by
          content_url. Empty means a built-in text containing the link.
        example: 'Thanks for your interest. Download the guide here: {content_link}'
        type: string
      follow_up_subject:
        description: |-
          Subject of the follow-up mail sent to the submitter once the submission
          is accepted; empty means no follow-up mail is sent. At most 255
          characters.
        example: Your download link
        maxLength: 255
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      name:
        description: |-
          Form name, trimmed; at most 255 characters. Shown to visitors, used as
          the source of the leads the form creates (cut to 100 characters) and in
          notification subjects.
        example: Website contact form
        maxLength: 255
        type: string
      notify_emails:
        description: |-
          Staff addresses that receive one notification mail per accepted
          submission (on arrival, or on confirmation for double opt-in forms). At
          most 20, each at most 255 characters and shaped like an address; trimmed.
          Reads return [] when there are none; the POST /forms and PUT /forms/{id}
          responses echo the request and carry null when the list was omitted or
          sent as null.
        example:
        - sales@example.com
        items:
          type: string
        type: array
        x-nullable: true
      public_id:
        description: |-
          Public identifier used in every public URL (/forms/public/{key}): 22
          random URL-safe base64 characters assigned at creation and never changed,
          so embeds keep working across edits.
        example: q3VZr0n8TjK1bWcY5xL2aQ
        readOnly: true
        type: string
      redirect_url:
        description: |-
          Page the visitor is sent to when submit_action is redirect: required
          then, and must start with http:// or https://. At most 512 characters;
          stored unchecked for message forms.
        example: https://www.example.com/thank-you
        maxLength: 512
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormStatus'
        description: |-
          Publication state; only a published form is served by the public
          endpoints. Defaults to draft.
        example: published
      submit_action:
        description: |-
          What the visitor sees after submitting: message shows thank_you_message
          in place, redirect sends the browser to redirect_url. Defaults to
          message.
        enum:
        - message
        - redirect
        example: message
        type: string
      thank_you_message:
        description: |-
          Message shown after a submission when submit_action is message. When
          empty a default text is shown (a "check your inbox" text for double
          opt-in forms).
        example: Thanks, we will be in touch within one business day.
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.FormFieldDef:
    properties:
      help_text:
        description: Help text rendered under the input; omitted when empty.
        example: We only use this to reply to you.
        type: string
      label:
        description: |-
          Label shown to the visitor and used in validation messages and lead
          notes; the name is used when it is empty.
        example: Work email
        type: string
      max_length:
        description: |-
          Longest accepted value in characters. On save, 0 or absent becomes 1000
          (5000 for textarea), anything above 10000 becomes 10000, and lead-mapped
          fields are narrowed to their column: email 255, first_name and last_name
          100, phone 50, company 200, position 100. Stored definitions therefore
          always carry the enforced limit.
        example: 255
        type: integer
      name:
        description: |-
          Machine name: the input name, the key of the submitted value and, for
          first_name, last_name, name, email, phone, company and position, the lead
          column it fills. Must match ^[a-z][a-z0-9_]{0,49}$ (trimmed first) and be
          unique within the form. The one email field must be named "email".
        example: email
        type: string
      options:
        description: |-
          Choices of a select field (1 to 50, none blank); the submitted value must
          equal one of them exactly. Omitted for other types, which may not have
          options.
        example:
        - 1-10
        - 11-50
        - 51+
        items:
          type: string
        type: array
      placeholder:
        description: Placeholder text for the input; omitted when empty.
        example: you@company.example
        type: string
      required:
        description: Whether a value must be submitted; for a checkbox, that it is
          ticked.
        example: true
        type: boolean
      type:
        description: |-
          Input type. A form has exactly one field of type email. Only select may
          have options; hidden carries a prefilled value and cannot be required.
        enum:
        - text
        - email
        - phone
        - textarea
        - select
        - checkbox
        - hidden
        example: email
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.FormStatus:
    enum:
    - draft
    - published
    - archived
    type: string
    x-enum-varnames:
    - FormStatusDraft
    - FormStatusPublished
    - FormStatusArchived
  github_com_florinel-chis_gophercrm_internal_models.FormSubmission:
    properties:
      confirmed_at:
        description: When the double opt-in link was confirmed (RFC 3339); null otherwise.
        example: "2026-10-30T09:15:00Z"
        readOnly: true
        type: string
        x-nullable: true
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      data:
        additionalProperties:
          type: string
        description: |-
          Submitted values keyed by field name: every field of the definition is
          present, values are trimmed, checkboxes are "true" or "false" and the
          email is lower-cased. Emptied ({}) when the linked lead is erased.
        readOnly: true
        type: object
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      email:
        description: |-
          Submitted address, lower-cased. After erasure of the linked lead it is
          that lead's placeholder address.
        example: jane@company.example
        readOnly: true
        type: string
      form_id:
        description: ID of the form that was submitted.
        example: 4
        readOnly: true
        type: integer
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      ip_address:
        description: |-
          Client IP as resolved through the trusted proxies (TRUSTED_PROXIES).
          Emptied when the linked lead is erased.
        example: 203.0.113.24
        readOnly: true
        type: string
      lead_id:
        description: |-
          Lead the submission created or added a note to; null for spam and
          pending submissions and for forms with create_lead off.
        example: 57
        readOnly: true
        type: integer
        x-nullable: true
      referrer:
        description: |-
          Page the form was submitted from, as reported by the embed script
          (page_url; client-supplied, not verified), cut to 512 characters.
          Emptied when the linked lead is erased.
        example: https://www.example.com/pricing
        readOnly: true
        type: string
      spam_reason:
        description: |-
          Protection layer that caught a spam submission: time_trap (submitted
          under 3 seconds or over 24 hours after the definition was served),
          domain (origin not in allowed_domains), honeypot (decoy input filled) or
          captcha (token missing, rejected or unverifiable). Empty string for every
          other status.
        enum:
        - ""
        - honeypot
        - time_trap
        - captcha
        - domain
        example: ""
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.FormSubmissionStatus'
        description: |-
          Lifecycle state: received (final on arrival), pending (double opt-in
          confirmation outstanding), confirmed (link confirmed) or spam (caught by
          a protection layer).
        example: received
        readOnly: true
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
      user_agent:
        description: |-
          Browser User-Agent header, cut to 255 characters. Emptied when the
          linked lead is erased.
        example: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5)
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.FormSubmissionStatus:
    enum:
    - received
    - pending
    - confirmed
    - spam
    type: string
    x-enum-varnames:
    - FormSubmissionReceived
    - FormSubmissionPending
    - FormSubmissionConfirmed
    - FormSubmissionSpam
  github_com_florinel-chis_gophercrm_internal_models.Label:
    description: A coloured tag that can be attached to tasks. Labels are hard-deleted.
    properties:
      color:
        description: 'Colour as #RRGGBB (six hex digits behind a hash).'
        example: '#FF8800'
        type: string
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      name:
        description: Display name, trimmed, 1 to 50 characters and unique case-insensitively.
        example: Follow-up
        maxLength: 50
        type: string
      task_count:
        description: |-
          Number of live (not soft-deleted) tasks carrying the label, computed on
          read and never stored. Filled in by GET /labels and PUT /labels/{id}; 0
          in the POST /labels response and in labels embedded in a task. Read-only.
        example: 4
        readOnly: true
        type: integer
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.Lead:
    properties:
      classification:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.LeadClassification'
        description: Triage classification; unclassified when not set.
        example: lead
      company:
        description: |-
          Free-text employer name as typed or submitted by a form, independent of
          company_id. The column holds 200 characters; the API does not check the
          length.
        example: Analytical Engines Ltd
        type: string
      company_id:
        description: |-
          Curated company the lead is linked to, independent of the free-text
          company field. Omitted when there is no link. Erasure and conversion
          keep it; deleting the company clears it.
        example: 12
        type: integer
      company_record:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
        description: |-
          The linked company, loaded only by GET /leads/{id} (its
          customer_count, lead_count and deal_count are 0 there, not computed);
          omitted elsewhere.
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Customer'
        description: |-
          The converted customer. The lead endpoints never load it, so it is
          omitted.
      customer_id:
        description: |-
          Customer this lead was converted into. Set by POST /leads/{id}/convert,
          read-only otherwise; omitted while the lead is unconverted.
        example: 31
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      email:
        description: |-
          Email address, validated as an address when sent. Empty when the lead
          was created with a phone number only (a create needs an email or a
          phone). Not unique: one person may be captured more than once. Erasure
          replaces it with a random address in the reserved .invalid domain.
        example: ada@example.com
        type: string
      external_id:
        description: |-
          Identifier of the lead in an external system (imports). Omitted when
          empty; not unique.
        example: crm-legacy-1042
        type: string
      first_name:
        description: |-
          Given name. Required on create (any non-empty string); an update
          cannot clear it. The column holds 100 characters; the API does not
          check the length.
        example: Ada
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      last_name:
        description: |-
          Family name. Required on create; an update cannot clear it. The column
          holds 100 characters; the API does not check the length.
        example: Lovelace
        type: string
      notes:
        description: |-
          Free-text notes: staff text plus one block per public-form submission
          from the lead's address (oldest form blocks are trimmed whole to stay
          within the column). Writes through the API are refused above 65535
          bytes (UTF-8 bytes, not characters).
        example: Met at the trade fair; wants a demo.
        type: string
      owner:
        description: |-
          The owner's account. Always present in the JSON. GET /leads/{id}, the
          admin GET /leads (except with the classification filter),
          GET /leads?external_id= for admin and sales, GET /companies/{id}/leads and the dashboard fill it in with the User
          object (see the User schema); elsewhere (create and update responses, a
          sales user's list) it is a zero-valued placeholder (id 0, every string
          empty, role "" included), which is not a valid User, so this property is
          documented as a plain object. Use owner_id.
        type: object
      owner_id:
        description: |-
          Staff user who owns the lead. A sales user sees and edits only the
          leads it owns; only an admin may reassign a lead.
        example: 7
        type: integer
      phone:
        description: |-
          Phone number, free text, may be empty. The column holds 50 characters;
          the API does not check the length.
        example: +44 20 7946 0000
        type: string
      position:
        description: |-
          Job title, free text, may be empty (100-character column, not checked
          by the API).
        example: CTO
        type: string
      source:
        description: |-
          Where the lead came from, free text (100-character column, not checked
          by the API). Leads created by a public form carry the form's name.
        example: website
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.LeadStatus'
        description: |-
          Pipeline status. Defaults to new on create. converted is set only by
          POST /leads/{id}/convert; any other write that asks for it is refused.
        example: new
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.LeadClassification:
    enum:
