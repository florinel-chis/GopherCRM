  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchange email and password for a JWT bearer token and the authenticated
        user. After 5 consecutive failed attempts the account is locked for 15 minutes;
        while locked, and for a deactivated account, the response is the same 401
        with the same generic message as a wrong password, so no account state is
        disclosed. The remember_me field is accepted but does not currently alter
        the token's lifetime.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated; JWT and user returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.AuthResponse'
              type: object
        "400":
          description: Malformed body or failed field validation
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: Invalid email or password, account locked, or account deactivated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Rate limit exceeded (10 requests per minute per IP)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
