          fill in customer; omitted elsewhere and when the ticket is unassigned.
      assigned_to_id:
        description: ID of the assigned support or admin user. POST /tickets assigns
          the caller when it is not given. Omitted when the ticket is unassigned.
        example: 5
        type: integer
      comments:
        description: The ticket's comments, oldest first, each with its author. Only
          loaded by GET /tickets/{id} and PUT /tickets/{id}; omitted elsewhere. Customer
          callers never receive internal notes here.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TicketComment'
        type: array
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      customer:
        description: The customer record. Always present in the JSON. GET /tickets,
          GET /tickets/{id} and PUT /tickets/{id} fill it in with the Customer object
          (see the Customer schema); POST /tickets, GET /tickets/my and GET /customers/{id}/tickets
          return a zero-valued placeholder instead (id 0, every string empty, email
          "" included), which is not a valid Customer, so this property is documented
          as a plain object. Use customer_id.
