  github_com_florinel-chis_gophercrm_internal_models.User:
    description: 'A login account: staff (admin, sales, support) or a customer''s
      own login. The password hash and the failed-login counter are never returned.'
    properties:
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      email:
        description: |-
          Login email address, unique among all accounts, including erased ones
          (erasure replaces the address, which frees it for reuse).
        example: jane.doe@example.com
        format: email
        type: string
      first_name:
        description: Given name.
        example: Jane
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      is_active:
        description: |-
          False for a deactivated account: it cannot log in, and its bearer tokens and
          API keys are rejected. Changed only by an admin.
        example: true
        type: boolean
      last_login_at:
        description: |-
          Time of the last successful password login (RFC 3339). Absent when the
          account has never logged in. Server-maintained, read-only.
        example: "2026-10-30T08:15:00Z"
        readOnly: true
        type: string
      last_name:
        description: Family name.
        example: Doe
        type: string
      locked_until:
        description: |-
          End of the login lockout set after 5 consecutive failed logins (15 minutes,
          RFC 3339). Absent when no lock is recorded; it may lie in the past, since a
          lapsed lock is cleared only by the next login attempt. Server-maintained,
          read-only.
        example: "2026-10-30T08:30:00Z"
        readOnly: true
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.UserRole'
        description: Role of the account; only an admin can change it (PUT /users/{id},
          POST /users).
        example: sales
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
