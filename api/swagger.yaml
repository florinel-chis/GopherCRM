info:
  contact: {}
  description: CRM API for managing users, leads, customers, tickets, tasks and API
    keys.
  title: GopherCRM API
  version: "1.0"
paths:
  /api-keys:
    get:
      description: List the API keys owned by the authenticated user. Scoped to the
        caller's own keys only — there is no admin-wide view and no pagination or
        filtering. Revoked (inactive) keys are included; the plaintext key is never
        returned, only its prefix.
      produces:
      - application/json
      responses:
        "200":
          description: API keys retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
