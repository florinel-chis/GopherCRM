  /dashboard/leads-by-status:
    get:
      description: Distribution of leads across the lead statuses, as chart data with
        a single "Leads" dataset. Every status the model defines is always present,
        in the canonical order new, contacted, qualified, unqualified, converted,
        with a zero count when no lead holds it; a status found in the data but unknown
        to the model is appended afterwards rather than dropped. The counts are system-wide
        and are not narrowed to the caller's own records. Restricted to the admin,
        sales and support roles; customer-role callers receive 403.
      produces:
      - application/json
      responses:
        "200":
          description: Lead status distribution retrieved successfully
