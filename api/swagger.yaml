  /tickets:
    get:
      description: 'One page of tickets with their customer and assignee. Roles: admin
        and sales see every ticket; support sees only tickets assigned to them (unassigned
        tickets and other people''s are never listed), a scope applied in the query
        before offset and limit so the tickets, total and meta all reflect it and
        no parameter can widen it; customers get 403. Precedence: for support, the
        assignee scope with optional search and sort; otherwise search (with optional
        sort), then sort_by, then the plain list. search is a substring match (SQL
        LIKE) on title, description and resolution. An unknown sort_by is ignored
        (ascending id) and any sort_order other than asc or desc falls back to asc.
        Pagination: page (1-based) overrides offset when greater than 0; limit defaults
        to 20 and is clamped to 100. Soft-deleted tickets are never listed; comments
        are not included.'
      parameters:
      - description: Page number (1-based); overrides offset when greater than 0
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of tickets to skip
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; non-positive values fall back to 20, larger values
          are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Sort column; unknown values are ignored
        enum:
        - created_at
        - updated_at
        - title
        - status
        - priority
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; anything else falls back to asc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Substring matched against title, description and resolution;
          for support it only narrows the assigned tickets
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
