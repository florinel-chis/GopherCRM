  /products:
    get:
      description: |-
        One page of live products. Roles: admin and sales. Filters combine (AND): search (substring of name or sku; case-insensitive on MySQL/MariaDB with their default collations, and on SQLite for ASCII letters only), is_active and currency. sort_by must be one of the listed columns (any other value is 400) and the id breaks ties in the same direction. Without sort_by the order is created_at descending and sort_order is ignored; with sort_by, a sort_order other than asc or desc becomes desc. Soft-deleted products never appear.
        data is the array of products; meta carries request_id, page (offset / limit + 1, rounded down), per_page and, when not zero, total and total_pages (both are omitted for an empty result).
      parameters:
      - description: 1-based page number; when greater than 0 it overrides offset
          (offset = (page-1) x limit). Non-numeric values are ignored
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of rows to skip; negative or non-numeric values fall back
          to 0
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; 0, negative or non-numeric values fall back to 20,
          values above 100 are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Substring searched in name and sku
        in: query
        name: search
        type: string
      - description: Only active (true) or inactive (false) products; anything strconv.ParseBool
          rejects is 400
        in: query
        name: is_active
        type: boolean
      - description: 'Only products priced in this currency: exactly three upper-case
          ASCII letters, else 400'
        in: query
        name: currency
        type: string
      - default: created_at
        description: Sort column
        enum:
        - id
        - name
        - sku
        - unit_price_cents
        - currency
        - is_active
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction, applied only with sort_by; any other value becomes
          desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of products
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Product'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: 'BAD_REQUEST: sort_by is not an allowed column (''Invalid sort
            column''), is_active is not a boolean (''is_active must be true or false''),
            or currency is not three upper-case letters (''currency must be three
            upper-case letters'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: the Authorization header is missing or is neither
            Bearer <jwt> nor ApiKey <key> (''Missing or invalid authorization header''),
            or the credential is invalid, expired or belongs to a deactivated account
            (''Invalid credentials'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN ''Insufficient permissions'': the caller is not
            admin or sales'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: more than 120 requests per minute (burst
            30) from this client IP, one bucket shared by every authenticated endpoint;
            error.details.retry_after is ''60s'' and no Retry-After or X-RateLimit
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: unexpected failure; the message is always
            ''An unexpected error occurred'''
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: 'Create a catalogue product. Role: admin. name is required (trimmed,
