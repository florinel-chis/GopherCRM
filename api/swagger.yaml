  internal_handler.CreateTaskRequest:
    properties:
      assigned_to_id:
        type: integer
      customer_id:
        type: integer
      description:
        type: string
      due_date:
        type: string
      label_ids:
        description: |-
          LabelIDs attaches existing labels to the new task. Absent or empty means
          no labels; an id that matches no label rejects the whole request. The
          list is capped at 100 ids, the same bound the bulk endpoints use, so a
          single request cannot turn a few client bytes into an arbitrarily large
          IN clause.
        items:
          type: integer
        maxItems: 100
        type: array
      lead_id:
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskPriority'
        enum:
        - low
        - medium
        - high
      title:
        type: string
    required:
