  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: Public. Always answers the same 200 with the same body, whether
        or not an account exists for the email — the same anti-enumeration posture
        as login. When the account exists and is active, a single-use reset token
        valid for one hour is created and a link is emailed; storage or delivery problems
        are logged server-side and never change the response.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Uniform acknowledgement, independent of account existence
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.MessageResponse'
              type: object
        "400":
          description: Malformed body or invalid email format
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Rate limit exceeded (10 requests per minute per IP)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Request a password reset link
      tags:
      - auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: Public. Spends a reset token from the emailed link and sets the
        new password, which must meet the complexity policy (min 10 chars, upper +
        lower + digit + special). Tokens are single-use and expire after one hour;
        an unknown, expired or already-used token yields the same generic 400 without
        disclosing which. On success every refresh token of the account is revoked.
      parameters:
      - description: Password reset confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset; all sessions revoked
