      description: 'Revokes refresh tokens of the authenticated user. With no body
        (or an empty one) every session of the user is revoked; with a refresh_token
        only that token is revoked, and only when it belongs to the caller. Logout
        is idempotent: unknown or already-revoked tokens still yield 200 and disclose
        nothing. The JWT itself stays valid until its expiry — clients must discard
        it.'
