  /products:
    get:
      description: 'One page of live products (admin and sales roles). offset and
        limit go through the shared pagination parser: limit defaults to 20, is capped
        at 100 and is never 0. search matches name and SKU (substring; case-insensitive
        on MySQL and MariaDB, case-sensitive on SQLite). is_active (true|false) and
        currency (three upper-case letters) narrow the result. sort_by must be one
        of the listed columns — any other value is a 400, never interpolated — and
        defaults to created_at; sort_order defaults to desc. Soft-deleted products
        never appear.'
      parameters:
      - description: Page number (1-based); when supplied it overrides offset
        in: query
        name: page
        type: integer
      - default: 0
        description: Result offset, ignored when page is supplied
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size, capped at 100
        in: query
        name: limit
        type: integer
      - description: Substring search across name and SKU
        in: query
        name: search
        type: string
      - description: Only active (true) or inactive (false) products
        in: query
        name: is_active
        type: boolean
      - description: Only products priced in this currency (three upper-case letters)
        in: query
        name: currency
        type: string
      - default: created_at
        description: Sort column
        enum:
        - id
        - name
        - sku
        - unit_price_cents
        - currency
        - is_active
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction; anything else falls back to desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Products retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Product'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: sort_by is not an allowed column, or is_active or currency
            is malformed (BAD_REQUEST)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
