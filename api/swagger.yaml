    get:
      description: 'One page of quotes without their lines (admin and sales roles;
        sales users see only the quotes they own, whatever owner_id says — the owner
        filter is applied inside the query, so meta.total counts only those). Filters
        combine: status, deal_id, customer_id, owner_id (admin only). sort_by must
        be one of the listed columns — any other value is a 400, never interpolated
        — and defaults to created_at; sort_order defaults to desc.'
      parameters:
      - description: Page number (1-based); when supplied it overrides offset
        in: query
        name: page
        type: integer
      - default: 0
        description: Result offset, ignored when page is supplied
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size, capped at 100
        in: query
        name: limit
        type: integer
      - description: Only quotes in this status
        enum:
        - draft
        - sent
        - accepted
        - rejected
        - expired
        in: query
        name: status
        type: string
      - description: Only quotes of this deal
        in: query
        name: deal_id
        type: integer
      - description: Only quotes addressed to this customer
        in: query
        name: customer_id
        type: integer
      - description: Only quotes owned by this user (admin; sales is always narrowed
          to itself)
        in: query
        name: owner_id
        type: integer
      - default: created_at
        description: Sort column
        enum:
        - id
        - title
        - status
        - total_cents
        - currency
        - valid_until
        - sent_at
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction; anything else falls back to desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Quotes retrieved successfully
