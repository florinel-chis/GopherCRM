            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.BulkStatusUpdateResult'
              type: object
        "400":
          description: VALIDATION_ERROR when the id list is missing, empty, longer
            than 100 or holds a 0, or the status is not an allowed value (error.details
            maps the Go field name, e.g. TaskIDs or TaskIDs[0], to a message); BAD_REQUEST
            (message Invalid request format) when the body is not valid JSON; BAD_REQUEST
            when a listed task is completed and the target status is not (error.details.completed_ids)
          schema:
