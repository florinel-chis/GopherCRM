  /deals:
    get:
      description: |-
        One page of live deals with owner, company, customer and lead loaded. Roles: admin (every deal) and sales (only the deals it owns, whatever owner_id says; the filter is applied in the query, so meta.total counts only those). lead_id and lead appear only when the caller may see the linked lead (admins every lead, sales users the leads they own), decided on every read.
        Filters combine (AND): search (substring of title or notes; case-insensitive on MySQL/MariaDB with their default collations, and on SQLite for ASCII letters only), stage, open=true (every stage but won and lost; open=false applies no filter), company_id, customer_id and owner_id. sort_by must be one of the listed columns (any other value is 400) and the id breaks ties in the same direction. Without sort_by the order is created_at descending and sort_order is ignored; with sort_by, a sort_order other than asc or desc becomes desc.
        data is the array of deals; meta carries request_id, page (offset / limit + 1, rounded down), per_page and, when not zero, total and total_pages (both are omitted for an empty result).
      parameters:
      - description: 1-based page number; when greater than 0 it overrides offset
          (offset = (page-1) x limit). Non-numeric values are ignored
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of rows to skip; negative or non-numeric values fall back
          to 0
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; 0, negative or non-numeric values fall back to 20,
          values above 100 are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Substring searched in title and notes
        in: query
        name: search
        type: string
      - description: Only deals in this stage; an unknown value is 400
        enum:
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        in: query
        name: stage
        type: string
      - description: 'true: only deals whose stage is neither won nor lost; false:
          no filter. Anything strconv.ParseBool rejects is 400'
        in: query
        name: open
        type: boolean
      - description: Only deals linked to this company; must be a positive integer
        in: query
        minimum: 1
        name: company_id
        type: integer
      - description: Only deals linked to this customer; must be a positive integer
        in: query
        minimum: 1
        name: customer_id
        type: integer
      - description: Only deals owned by this user; must be a positive integer. Honoured
          for admins; a sales caller is always narrowed to itself
        in: query
        minimum: 1
        name: owner_id
        type: integer
      - default: created_at
        description: Sort column
        enum:
        - id
        - title
        - stage
        - amount_cents
        - probability
        - expected_close_date
        - closed_at
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction, applied only with sort_by; any other value becomes
          desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
