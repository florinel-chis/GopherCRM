  /tasks:
    get:
      description: 'List tasks. Admins see all tasks and may use search and sorting;
        every other role is silently narrowed to the tasks assigned to them, and the
        search, sort_by and sort_order parameters are ignored for them — EXCEPT when
        label_id is given, which is the one non-admin path that honours sort_by and
        sort_order. label_id filters to the tasks carrying that label and takes precedence
        over search: when both are sent, search is ignored. An unparseable or non-positive
        label_id is ignored, and a label_id that matches no label simply yields an
        empty page rather than a 404.'
      parameters:
      - description: Page number (1-based); overrides offset when greater than 0
        in: query
        name: page
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Sort column; ignored unless one of the allowed values, and ignored
          entirely for non-admin callers
        enum:
        - created_at
        - updated_at
        - title
        - status
        - priority
        - due_date
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; anything else falls back to asc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Free-text search across task fields; admin only, takes precedence
          over sort_by, and is itself overridden by label_id
        in: query
        name: search
        type: string
      - description: Only tasks carrying this label; combinable with sort_by/sort_order
          for every role
        in: query
        name: label_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tasks retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    tasks:
                      items:
                        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Task'
                      type: array
                    total:
                      type: integer
                  type: object
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Too many requests - rate limit exceeded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task (admin, support and sales roles only). Non-admin
        callers may only assign the task to themselves; admins may assign it to any
        active user. A task may reference a lead or a customer, but not both. The
        new task always starts in status "pending" regardless of the request body.
