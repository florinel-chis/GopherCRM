              type: object
        "400":
          description: VALIDATION_ERROR when a binding rule fails (error.details maps
            each failing field, by its Go struct field name such as Title or LabelIDs[0],
            to a message); BAD_REQUEST (message Invalid request format) when the body
            is not valid JSON or a value has the wrong JSON type; BAD_REQUEST when
            the assignee is deactivated or both lead_id and customer_id are given;
            INVALID_REFERENCE when a label id matches no label
          schema:
            allOf:
