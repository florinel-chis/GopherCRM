            rejected here), the new assignee is deactivated, the task would link both
            a lead and a customer, or a completed task would change status; VALIDATION_ERROR
            when a binding rule fails (error.details maps each failing field, by its
            Go struct field name such as Title or LabelIDs[0], to a message); BAD_REQUEST
            (message Invalid request format) when the body is not valid JSON or a
            value has the wrong JSON type; INVALID_REFERENCE when a label id matches
