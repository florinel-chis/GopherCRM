  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Re-authenticates with the current password, then replaces it. The
        new password must be at least 10 characters with an uppercase letter, a lowercase
        letter, a digit and a special character. On success every refresh token of
        the user is revoked, ending all other sessions. A wrong current password is
        a 400 validation failure of the request — the session presenting it is still
        authenticated, so it is not a 401.
      parameters:
      - description: Password change request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed; other sessions revoked
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.MessageResponse'
              type: object
        "400":
          description: Malformed body, wrong current password, or new password fails
            the complexity policy
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Too many requests - rate limit exceeded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Change the authenticated user's password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchange email and password for a JWT bearer token, a refresh token
        and the authenticated user. After 5 consecutive failed attempts the account
        is locked for 15 minutes; while locked, and for a deactivated account, the
        response is the same 401 with the same generic message as a wrong password,
        so no account state is disclosed. The JWT's lifetime is fixed by server configuration;
        the refresh token is a single-use opaque value for POST /auth/refresh, stored
        server-side only as a hash.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated; JWT, refresh token and user returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.AuthResponse'
              type: object
        "400":
          description: Malformed body or failed field validation
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: Invalid email or password, account locked, or account deactivated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Rate limit exceeded (10 requests per minute per IP)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Authenticate and obtain a JWT
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 'Revokes refresh tokens of the authenticated user. With no body
        (or an empty one) every session of the user is revoked; with a refresh_token
        only that token is revoked, and only when it belongs to the caller. Logout
        is idempotent: unknown or already-revoked tokens still yield 200 and disclose
        nothing. The JWT itself stays valid until its expiry — clients must discard
        it.'
