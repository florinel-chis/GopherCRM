      description: List tickets with pagination, optional free-text search and sorting.
        Admin and sales users see every ticket; support users see only tickets assigned
        to them, so unassigned tickets and tickets assigned to anyone else are never
        listed; customer users are rejected. The support scope is applied in the query
        before offset and limit, so the "tickets" array, the "total" count and the
        pagination metadata all reflect it, and no search, sort or pagination parameter
        can widen it. Soft-deleted tickets are never listed. The response data is
        an object with a "tickets" array and a "total" count, alongside pagination
        metadata.
      parameters:
      - description: Page number (1-based); when supplied it overrides offset
        in: query
        name: page
        type: integer
      - default: 0
        description: Result offset, ignored when page is supplied
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size, capped at 100
        in: query
        name: limit
        type: integer
      - description: Sort column; ignored unless one of the allowed values
        enum:
        - created_at
        - updated_at
        - title
        - status
        - priority
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; anything else falls back to asc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
