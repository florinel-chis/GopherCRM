  /companies:
    get:
      description: |-
        One page of live companies, each with its owner and its customer_count, lead_count and deal_count (counted over all live records, whoever owns them). Roles: admin, sales and support.
        search is a substring match on name, domain, industry and city (case-insensitive on MySQL/MariaDB with their default collations, and on SQLite for ASCII letters only). sort_by must be one of the listed columns (any other value is 400) and the id breaks ties in the same direction. Without sort_by the order is created_at descending and sort_order is ignored; with sort_by, a sort_order other than asc or desc (case-insensitive) becomes desc.
        data is the array of companies; meta carries request_id, page (offset / limit + 1, rounded down), per_page and, when not zero, total and total_pages (both are omitted for an empty result).
      parameters:
      - description: 1-based page number; when greater than 0 it overrides offset
          (offset = (page-1) x limit). Non-numeric values are ignored
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of rows to skip; negative or non-numeric values fall back
          to 0
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; 0, negative or non-numeric values fall back to 20,
          values above 100 are clamped to 100
        in: query
        name: limit
        type: integer
      - description: Substring searched in name, domain, industry and city
        in: query
        name: search
        type: string
      - default: created_at
        description: Sort column
        enum:
        - id
        - name
        - domain
        - industry
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction, applied only with sort_by; any other value becomes
          desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page of companies
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: 'BAD_REQUEST: sort_by is not an allowed column (''Invalid sort
            column'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: the Authorization header is missing or is neither
            Bearer <jwt> nor ApiKey <key> (''Missing or invalid authorization header''),
            or the credential is invalid, expired or belongs to a deactivated account
            (''Invalid credentials'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN ''Insufficient permissions'': the caller is not
            admin, sales or support'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: more than 120 requests per minute (burst
            30) from this client IP, one bucket shared by every authenticated endpoint;
            error.details.retry_after is ''60s'' and no Retry-After or X-RateLimit
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: unexpected failure; the message is always
            ''An unexpected error occurred'''
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: |-
        Create a company. Roles: admin and sales.
        Validation, in order: binding (name required, employee_range from its set), column widths (name 200, domain 255, website 255, industry 100, employee_range 20, phone 50, address 255, city, state and country 100, postal_code 20 characters; notes 65535 bytes), then the service: the trimmed name must not be empty, the domain is normalised and must be a bare host, the website must be an http or https URL, the owner must be a live user, and the domain must be free among live companies.
        Owner: a sales user may only name itself and becomes the owner when owner_id is absent or 0; an admin may name any live user, or leave the company unowned by omitting it. The owner may be any live account; its role is not checked.
