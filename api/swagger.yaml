  github_com_florinel-chis_gophercrm_internal_models.DealPipelineTotal:
    properties:
      amount_cents:
        description: |-
          AmountCents is the sum of amount_cents of the stage's deals in this
          currency.
        example: 1250000
        type: integer
      currency:
        example: EUR
        type: string
      weighted_cents:
        description: |-
          WeightedCents is round_half_up(Σ amount_cents × probability / 100),
          rounded once on the sum.
        example: 500000
        type: integer
    type: object
