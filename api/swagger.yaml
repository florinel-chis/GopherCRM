  /auth/change-password:
    post:
      consumes:
      - application/json
      description: |-
        Any authenticated role. Re-authenticates with current_password, then replaces it with new_password (at least 10 characters with an uppercase letter, a lowercase letter, a digit and a special character). The password write, the revocation of the caller's refresh tokens and the renewal of the current session are one transaction: a failure before the commit leaves the password and every session unchanged. A COMMIT whose acknowledgement fails is ambiguous (the change may have been applied) and is reported as a 500 without credentials. The login lockout counter is not touched.
        With a bearer token and the client's current refresh_token in the body, that session is renewed: the token is spent, every other refresh token of the caller is revoked, and the response carries a replacement token, refresh_token and user. A refresh_token that is not a live session of the caller (unknown, revoked, expired, foreign) is 409 SESSION_STALE and nothing changes. Without a refresh_token, or for an API-key request (whose refresh_token is ignored and which never receives session credentials), every refresh token is revoked and only the message is returned.
        Revocation ends renewal, not access: access tokens already issued stay valid until they expire (there is no blocklist). A wrong current password is a 400, not a 401, because the request itself is authenticated. Rate limit: the authenticated tier (120 per minute, burst 30, per client IP).
      parameters:
      - description: Current and new password, optionally the current refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed; refresh tokens revoked; renewed credentials
            when a refresh_token was presented with a bearer token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.ChangePasswordResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: a required field is missing or new_password
            is shorter than 10 characters (details maps the Go field name to a message).
            BAD_REQUEST: malformed JSON (Invalid request format), new_password fails
            the complexity policy, or The current password is incorrect'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or invalid credentials, or the account
            was deactivated or erased during the request'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: 'SESSION_STALE: the presented refresh_token is not a live session
            of the caller; nothing was changed'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: storage failure (nothing changed when it came
            before the commit; a failed COMMIT is ambiguous), or a new_password over
            72 bytes (bcrypt limit)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Change the caller's password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges email and password for an access token (JWT, valid JWT_EXPIRY_HOURS, 24 hours by default), a single-use refresh token for POST /auth/refresh (valid REFRESH_TOKEN_EXPIRY_DAYS, 30 days by default, stored server-side only as a hash) and the user. If the refresh token cannot be stored the login still succeeds without one.
        Every failure is the same 401 with the message Invalid email or password: unknown email, wrong password, locked account and deactivated or erased account cannot be told apart. After 5 consecutive wrong passwords the account is locked for 15 minutes; while locked even the right password is refused, and a lapsed lock starts a fresh five-attempt window. A successful login clears the counter and stamps last_login_at (the returned user still shows the previous value).
        Rate limit: the strict /auth tier, 10 requests per minute with a burst of 5 per client IP, shared by every unauthenticated /auth route.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated; token, refresh_token and user returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.AuthResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: email missing or not an email address, or
            password missing (details maps the Go field name to a message). BAD_REQUEST:
            malformed JSON (Invalid request format)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: Invalid email or password, whatever the cause
            (unknown email, wrong password, locked, deactivated or erased account,
            or a server-side failure while signing the token)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: strict /auth tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Log in and obtain session credentials
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Revokes refresh tokens of the caller (any authenticated role, bearer or API-key). With no body, an empty body or no refresh_token, every refresh token of the caller is revoked; with a refresh_token only that token is revoked, and only when it belongs to the caller. Idempotent: an unknown, already revoked or foreign token still answers 200 and discloses nothing.
        Logout does not invalidate access tokens: an issued JWT stays valid until it expires (there is no blocklist), so the client must discard it. API keys are not affected.
        Rate limit: the authenticated tier, 120 requests per minute with a burst of 30 per client IP, shared by every authenticated route and checked after authentication.
      parameters:
      - description: 'Optional: the one refresh token to revoke'
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handler.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Logged out (message: Logged out successfully)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.MessageResponse'
              type: object
        "400":
          description: 'BAD_REQUEST: a non-empty body that is not valid JSON (Invalid
            request format)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: the refresh tokens could not be revoked'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Log out (revoke refresh tokens)
      tags:
      - auth
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: |-
        Public. Always the same 200 and the same message, whether or not an account exists for the email (anti-enumeration, like login). When an active account exists, its outstanding reset tokens are invalidated, a new single-use token valid for one hour is created and a link to APP_BASE_URL/reset-password?token=... is emailed (only logged when SMTP is not configured). A deactivated account receives nothing. Storage and delivery failures are logged server-side and never change the response.
        Rate limit: the strict /auth tier, 10 requests per minute with a burst of 5 per client IP, shared by every unauthenticated /auth route.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Uniform acknowledgement, independent of whether the account
            exists
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.MessageResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: email missing or not an email address (details
            maps Email to a message). BAD_REQUEST: malformed JSON (Invalid request
            format)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: strict /auth tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Request a password reset link
      tags:
      - auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Public. Spends the token from the emailed link and sets new_password, which must meet the policy (at least 10 characters with an uppercase letter, a lowercase letter, a digit and a special character). The policy is checked before the token is touched, so a weak password leaves the link usable. Tokens are single use and expire after one hour; an unknown, expired or used token, or one whose account is deactivated or erased, is the same generic 400.
        In one transaction the token is claimed, the password written, the login lockout cleared and every refresh token of the account revoked. A failure before the commit rolls all of it back and the link stays usable; when the COMMIT itself fails the outcome is ambiguous (the password may have changed and the link been spent), so a retry may be refused as an invalid or expired link. Issued access tokens stay valid until they expire. Rate limit: the strict /auth tier (10 per minute, burst 5, per client IP).
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset; every refresh token revoked
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.MessageResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: token or new_password missing, or new_password
            shorter than 10 characters (details maps the Go field name to a message).
            BAD_REQUEST: malformed JSON (Invalid request format), new_password fails
            the complexity policy, or Invalid or expired reset token'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: strict /auth tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: storage failure (before the commit: rolled
            back and the link stays usable; a failed COMMIT is ambiguous and the reset
            may have taken effect) or a new_password over 72 bytes (bcrypt limit;
            the token is not spent)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Complete a password reset
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Strict rotation: the presented refresh token is spent and a new access token, a new refresh token and the user are returned, the same shape as login. Clients must keep the replacement from every response; presenting a spent token fails. Of several concurrent refreshes of one token exactly one succeeds.
        Every rejection of the token (unknown, expired, revoked, already spent, or owned by a deactivated or erased account) is the same 401; the reason is never disclosed. A refresh whose owner turns out to be deactivated or erased also revokes the token. An operational failure (database, signing) is 503 SESSION_REFRESH_UNAVAILABLE: when it happened before the commit the rotation was rolled back and the presented token is still usable, so the client keeps it and retries; when the COMMIT itself failed the outcome is ambiguous and the retry may answer 401.
        Rate limit: the strict /auth tier, 10 requests per minute with a burst of 5 per client IP, shared by every unauthenticated /auth route.
      parameters:
      - description: The refresh token to spend
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Rotated; new token, refresh_token and user returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.AuthResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: refresh_token missing or empty (details
            maps RefreshToken to a message). BAD_REQUEST: malformed JSON (Invalid
            request format)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: Invalid or expired refresh token, whatever the
            reason'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: strict /auth tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "503":
          description: 'SESSION_REFRESH_UNAVAILABLE: operational failure; before the
            commit nothing rotated and the presented token is still usable, retry
            later. A failed COMMIT is ambiguous and the retry may answer 401'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Rotate a refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Public self-service sign-up, open only while the security.allow_public_registration setting is true (it ships false; GET /auth/registration reports the current state). The gate fails closed: a setting that cannot be read is treated as false. The account is always created with the customer role and active; the body has no role field and nothing in it can change the role. Elevated roles come only from the admin-guarded POST /users.
        On success the response carries a JWT for the new account and the user, but no refresh token: the client signs in through POST /auth/login to obtain one. Password policy: at least 10 characters with an uppercase letter, a lowercase letter, a digit and a special character (punctuation or symbol); bcrypt rejects more than 72 bytes.
        Rate limit: the strict /auth tier, 10 requests per minute with a burst of 5 per client IP, one bucket shared by every unauthenticated /auth route. No side effects besides the new user row: no mail is sent and no automation event is recorded.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created; token and user returned (no refresh_token)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.AuthResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: a field failed its binding rule (details
            maps each Go field name, e.g. Email, to a message). BAD_REQUEST: malformed
            JSON (Invalid request format), the password fails the complexity policy
            (message names the missing class), or the user could not be stored (the
            underlying message is returned, e.g. a password over 72 bytes)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN: public registration is disabled or the setting
            could not be read'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: 'CONFLICT: an account already uses this email'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: strict /auth tier exceeded; details.retry_after
            is 60s and no Retry-After header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: the token could not be signed (the account
            has already been created)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Register a new customer account
      tags:
      - auth
  /auth/registration:
    get:
      description: |-
        Public, unauthenticated probe of the security.allow_public_registration setting, so the login and sign-up screens can decide whether to offer registration (the authenticated GET /configurations/ui cannot serve a visitor without a session). A setting that cannot be read is reported as disabled, the same answer the gate on POST /auth/register enforces. Read-only, no side effects.
        Rate limit: the strict /auth tier, 10 requests per minute with a burst of 5 per client IP, shared by every unauthenticated /auth route (so polling it consumes the login budget).
