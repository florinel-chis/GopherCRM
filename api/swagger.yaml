  /tasks:
    get:
      description: 'One page of tasks. Roles: every authenticated role. Admins see
        every task and may use search and sorting. Every other role is silently narrowed
        to the tasks assigned to them, and search, sort_by and sort_order are ignored
        for them, except with label_id, which is the one non-admin path that honours
        sort_by and sort_order. label_id filters to the tasks carrying that label
        and takes precedence over search (search is ignored when both are sent); an
        unparseable or non-positive label_id is ignored, and an unknown one yields
        an empty page rather than 404. Precedence for admins: label_id, then search,
        then sort_by, then the plain list. search matches title or description with
        SQL LIKE. An unknown sort_by is ignored (unsorted, ascending id) and any sort_order
        other than asc or desc falls back to asc. Pagination: page (1-based) overrides
        offset when greater than 0; offset defaults to 0; limit defaults to 20, non-positive
        or unparseable values fall back to the default and anything above 100 is clamped
        to 100. The non-admin path without label_id returns assigned_to as a zero-valued
        object. lead_id and lead are omitted whenever the caller may not see the linked
        lead (admins see every lead, sales users only the leads they own, every other
        role none), decided again on every read.'
      parameters:
      - description: Page number (1-based); overrides offset when greater than 0
        in: query
        name: page
        type: integer
      - default: 0
        description: Number of tasks to skip
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size; clamped to 100
        in: query
        name: limit
        type: integer
      - description: Sort column (admin, or any role with label_id); unknown values
          are ignored
        enum:
        - created_at
        - updated_at
        - title
        - status
        - priority
        - due_date
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; anything else falls back to asc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Substring matched against title and description (admin only;
          ignored when label_id is given)
        in: query
        name: search
        type: string
      - description: Only tasks carrying this label; non-admins still see only their
          own tasks
        in: query
        name: label_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: One page of tasks; meta carries page, per_page, total and total_pages
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.TaskListData'
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            invalid, expired or revoked credentials
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: TOO_MANY_REQUESTS - per-IP rate limit for authenticated traffic
            exceeded; error.details.retry_after is 60s
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; details are logged, never
            returned
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: 'Create a task. Roles: admin, sales and support (customers get
        403 before the body is read). Non-admin callers may only assign the task to
        themselves; admins may assign it to any active user. The task always starts
        in status pending, whatever the body says, and priority defaults to medium.
        A task may link a lead or a customer, but not both. lead_id must name a lead
        the caller may see (admins any lead, sales users only the leads they own,
        every other role none); a hidden lead is answered with 404 exactly like a
        missing one. label_ids attaches existing labels (a repeated id is attached
        once); any id that matches no label rejects the whole request. The checks
        run in this order: role, body binding, self-assignment, assignee (exists,
        active), lead, customer, lead-and-customer conflict, labels. No automation
        event and no notification is produced. lead_id and lead are omitted whenever
        the caller may not see the linked lead (admins see every lead, sales users
        only the leads they own, every other role none), decided again on every read.'
      parameters:
      - description: Task to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateTaskRequest'
      produces:
      - application/json
      responses:
