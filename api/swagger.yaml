        Sorting: sort_by is one of id, text, is_active, created_at, updated_at; any other value is answered with 400 BAD_REQUEST ("Invalid sort column: <value>"). sort_order is asc or desc; anything else means desc. Without sort_by the order is created_at descending whatever sort_order says. Ties are broken by id in the same direction.
        Roles: admin, sales, support.
      parameters:
      - default: 30
        description: Reporting window in days; 7, 30 or 90, anything else means 30
        enum:
        - 7
        - 30
        - 90
        in: query
        name: days
        type: integer
      - default: false
        description: true returns only active prompts; unparseable values mean false
        in: query
        name: active_only
        type: boolean
      - default: 0
        description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
