      consumes:
      - application/json
      description: |-
        Rename an API key and/or change whether it is active. Only the fields present in the body are applied; a body carrying neither `name` nor `is_active` is rejected with 400 rather than treated as a successful no-op. Only the owner may update a key — there is no admin override, and a key belonging to another user is rejected with 403.

        Setting `is_active` to true on a revoked key **reactivates** it. Revocation is an owner-controlled flag, not a tombstone, so the owner who turned it off may turn it back on; the plaintext key is unchanged and starts working again. Callers wanting an irreversible kill should create a new key and stop using the old one. Expiry is not affected by this endpoint: an expired key stays unusable no matter what `is_active` says, because expiry is checked separately at authentication time.
