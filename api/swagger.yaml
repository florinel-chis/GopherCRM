  github_com_florinel-chis_gophercrm_internal_models.Task:
    description: A to-do item assigned to one user, optionally linked to a lead or
      a customer (never both) and carrying labels.
    properties:
      assigned_to:
        description: The assignee's user record. Always present in the JSON. GET /tasks/{id},
          PUT /tasks/{id}, GET /tasks/upcoming and the admin and label-filtered GET
          /tasks listings fill it in with the User object (see the User schema). POST
          /tasks, GET /tasks/my and the non-admin GET /tasks without label_id return
          a zero-valued placeholder instead (id 0, every string empty, role "" included,
          timestamps 0001-01-01T00:00:00Z), which is not a valid User, so this property
          is documented as a plain object. Use assigned_to_id.
        type: object
      assigned_to_id:
        description: ID of the user the task is assigned to. Non-admins may only create
          tasks for themselves and only admins may change it.
        example: 7
        type: integer
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Customer'
        description: The linked customer. Only loaded by GET /tasks/{id} and PUT /tasks/{id}
          (and omitted from the PUT response when that request changed customer_id);
          omitted everywhere else.
      customer_id:
        description: ID of the linked customer. Omitted when the task has no customer
          link. A task links a lead or a customer, never both.
        example: 3
        type: integer
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: Free-text details; an empty string when none were given.
        example: Customer asked for a quote on the 50-seat plan.
        type: string
      due_date:
        description: Due date and time (RFC 3339). Omitted when the task has no due
          date; once set it cannot be cleared through PUT /tasks/{id}.
        example: "2026-11-05T09:00:00Z"
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      labels:
        description: Labels attached to the task. Omitted when the task has none,
          and not loaded (so omitted) by GET /tasks/upcoming. The embedded labels
          carry task_count 0.
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Label'
        type: array
      lead:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Lead'
        description: 'The linked lead, under the same visibility rule as lead_id:
          omitted whenever lead_id is omitted.'
      lead_id:
        description: ID of the linked lead. Omitted when the task has no lead link,
          and also when the caller may not see that lead (admins see every lead, sales
          users only the leads they own, every other role none); this is decided on
          every read. A task links a lead or a customer, never both.
        example: 12
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskPriority'
        description: Priority; medium when not given on create.
        example: medium
      status:
        allOf:
        - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.TaskStatus'
        description: Workflow status. New tasks always start as pending; a completed
          task cannot move to another status.
        example: pending
      title:
        description: Short summary of the task. Always present. The column is 255
          characters wide; the API does not check the length before the write.
        example: Call back about the renewal
        type: string
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.TaskPriority:
