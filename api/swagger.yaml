  /leads/bulk/status:
    post:
      consumes:
      - application/json
      description: 'Set the same status on up to 100 leads in one all-or-nothing transaction.
        Roles: admin and sales (route guard; support and customers get 403 before
        the body is read); sales users may only update leads they own. Repeated ids
        are collapsed. If any listed lead is missing (404, error.details.missing_ids)
        or, for sales, not owned by the caller (403, error.details.forbidden_ids),
        nothing is written; missing ids are reported before ownership. status converted
        is refused with 400 VALIDATION_ERROR and error.details {field: status}: a
        lead becomes converted only through POST /leads/{id}/convert. Side effects:
        every updated lead records a lead_updated automation event, plus lead_status_changed
        when its status actually changed (origin bulk), in the same transaction, from
        which the automation worker later starts runs of the enabled rules with a
        matching trigger; and, once the id, status and role checks have passed, an
        audit row is written to the bulk operation log and marked completed or failed.'
      parameters:
      - description: Lead IDs and the status to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.BulkLeadStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Every listed lead was updated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.BulkStatusUpdateResult'
              type: object
        "400":
          description: VALIDATION_ERROR when the id list is missing, empty, longer
            than 100 or holds a 0, or the status is not an allowed value (error.details
            maps the Go field name, e.g. LeadIDs or LeadIDs[0], to a message); BAD_REQUEST
            (message Invalid request format) when the body is not valid JSON; VALIDATION_ERROR
            with details.field status for status converted
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            invalid, expired or revoked credentials
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - admin or sales role required; or a sales user listed
            leads it does not own (error.details.forbidden_ids)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: NOT_FOUND - one or more leads do not exist (error.details.missing_ids)
