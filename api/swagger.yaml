        may use search and sorting; every other role is silently narrowed to the tasks
        assigned to them, and the search, sort_by and sort_order parameters are ignored
        for them.
      parameters:
      - default: 1
        description: Page number (1-based); non-numeric or non-positive values fall
          back to 1
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size; values outside 1-100 fall back to 20
        in: query
        name: per_page
        type: integer
      - description: Sort column; ignored unless one of the allowed values, and ignored
          entirely for non-admin callers
        enum:
        - created_at
        - updated_at
        - title
        - status
        - priority
        - due_date
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction; anything else falls back to asc
        enum:
