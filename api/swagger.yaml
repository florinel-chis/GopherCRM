  github_com_florinel-chis_gophercrm_internal_models.Customer:
    properties:
      address:
        type: string
      assigned_to:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
      assigned_to_id:
        description: |-
          AssignedToID is the staff account that owns this relationship — the
          account manager, not the customer's own login (that is UserID above).
          Nullable because a customer may sit unassigned in the pool.

          It is a foreign key to an internal account, NOT personal data about the
          customer, so the erasure in repository/customer_repository.go deliberately
          leaves it alone: who handled the account is business history, and the
          staff member has their own independent erasure path.
        type: integer
      city:
        type: string
      company:
        type: string
      company_id:
        description: |-
          CompanyID links the customer to a curated Company record. Like
          AssignedToID it is a business link, not personal data, so the erasure in
          repository/customer_repository.go leaves it alone. The free-text Company
          column above stays as entered.
        type: integer
      company_record:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
      country:
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      notes:
        type: string
      phone:
        type: string
      position:
        type: string
      postal_code:
        type: string
      state:
        type: string
      tickets:
        items:
          $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Ticket'
        type: array
      updated_at:
        type: string
      user:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
      user_id:
        type: integer
      website:
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.Deal:
    properties:
      amount_cents:
        type: integer
      closed_at:
        description: |-
          ClosedAt is set when the stage becomes won or lost and cleared when it
          leaves them.
        type: string
      company:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Company'
      company_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      customer:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Customer'
      customer_id:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      expected_close_date:
        description: |-
          ExpectedCloseDate is a calendar date. It is stored in a DATE column as
          midnight in the process's local zone (the MySQL DSN uses loc=Local, so
          that is the value that round-trips exactly on every engine) and exposed
          as YYYY-MM-DD; see MarshalJSON.
        example: "2026-12-31"
        format: date
        type: string
      id:
        type: integer
      lead:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Lead'
      lead_id:
        type: integer
      lost_reason:
        description: LostReason is kept only while the stage is lost.
        type: string
      notes:
        type: string
      owner:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.User'
      owner_id:
        description: |-
          OwnerID is the staff account working the deal. Never null: it defaults
          to the caller, and only an admin may name somebody else.
        type: integer
      probability:
        description: |-
          Probability carries no column default on purpose: a GORM default would
          replace an explicit 0 on create, and a lost deal is stored at 0.
        type: integer
      source:
        type: string
      stage:
        $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.DealStage'
      title:
        type: string
      updated_at:
        type: string
    type: object
