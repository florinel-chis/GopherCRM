  github_com_florinel-chis_gophercrm_internal_models.Notification:
    description: An in-app message for one staff user, created by the notify step
      of an automation rule.
    properties:
      body:
        description: Body rendered from the notify step's body template; an empty
          string when the step has no body.
        example: Please contact the lead within one business day.
        type: string
      created_at:
        description: When the notification was created (RFC 3339). Read-only.
        example: "2026-10-30T08:00:00Z"
        readOnly: true
        type: string
      entity_id:
        description: ID of the lead or deal the notification is about.
        example: 12
        type: integer
      entity_type:
        description: Type of the record the notification is about.
        enum:
        - lead
        - deal
        example: lead
        type: string
      id:
        description: Unique identifier, assigned by the server. Read-only.
        example: 31
        readOnly: true
        type: integer
      read_at:
        description: When the caller marked it read (RFC 3339); omitted while unread.
        example: "2026-10-30T08:15:00Z"
        type: string
      run_id:
        description: ID of the automation run that created the notification; omitted
          when there is none.
        example: 88
        type: integer
      title:
        description: Title rendered from the notify step's title template (placeholders
          substituted), cut to 255 characters.
        example: 'New lead assigned: Ada Lovelace'
        type: string
      updated_at:
        description: When the row was last written (RFC 3339), e.g. when it was marked
          read. Read-only.
        example: "2026-10-30T08:15:00Z"
        readOnly: true
        type: string
      user_id:
        description: ID of the staff user the notification is addressed to; always
          the caller on these endpoints.
        example: 7
        type: integer
    type: object
  github_com_florinel-chis_gophercrm_internal_models.Product:
    properties:
      created_at:
        description: When the record was created (RFC 3339 date-time), set by the
          server. Read-only.
        example: "2026-10-01T09:30:00Z"
        readOnly: true
        type: string
      currency:
        description: |-
          ISO 4217 code: exactly three upper-case ASCII letters. Defaults to the
          deals.default_currency setting (EUR as shipped). A product can be added
          only to quotes in the same currency.
        example: EUR
        maxLength: 3
        minLength: 3
        type: string
      deleted_at:
        description: Soft-deletion time (RFC 3339 date-time) or null. Always present
          in the JSON. Reads exclude soft-deleted rows, so records returned by the
          API carry null here. Read-only.
        format: date-time
        readOnly: true
        type: string
        x-nullable: true
      description:
        description: |-
          Free-text description, at most 65535 bytes (UTF-8 bytes, not
          characters). Not copied onto quote lines.
        example: Business-hours support for twelve months.
        type: string
      id:
        description: Unique identifier, assigned by the server on creation. Read-only.
        example: 42
        readOnly: true
        type: integer
      is_active:
        description: |-
          Whether the product can be added to quote lines. Defaults to true on
          create; existing lines of an inactive product are kept.
        example: true
        type: boolean
      name:
        description: |-
          Product name, trimmed, 1 to 200 characters. Copied onto a quote line
          as its description when the line is added.
        example: Annual support plan
        type: string
      sku:
        description: |-
          Optional stock-keeping code, trimmed, at most 64 characters; empty when
          not set. Not unique.
        example: SUP-ANNUAL
        type: string
      unit_price_cents:
        description: |-
          Price of one unit in minor units of currency (cents for EUR), 0 to
          1000000000000 (10^12). 0 is a free item. Copied onto a quote line when
          the line is added.
        example: 120000
        maximum: 1000000000000
        minimum: 0
        type: integer
      updated_at:
        description: When the record was last written (RFC 3339 date-time), set by
          the server on every update. Read-only.
        example: "2026-10-02T14:05:00Z"
        readOnly: true
        type: string
    type: object
  github_com_florinel-chis_gophercrm_internal_models.QuoteCustomerSummary:
