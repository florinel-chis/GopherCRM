                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get a customer
      tags:
      - customers
    put:
      consumes:
      - application/json
      description: 'Admin and sales (checked in the handler; support and customer
        get 403). Any live customer may be updated; there is no ownership check. Text
        fields apply only when non-empty, so they cannot be cleared here; website
        is the exception: omitted or null leaves it unchanged, an empty string clears
        it, otherwise it is trimmed and must be an absolute http or https URL with
        a host, at most 255 characters. company_id: omitted or null leaves the link
        unchanged, 0 clears it, any other value must name a live company. The account
        manager is changed through POST /customers/{id}/assign. The whole row is written
        back.'
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated customer
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Customer'
              type: object
        "400":
          description: 'BAD_REQUEST: Invalid customer ID, malformed JSON (Invalid
            request format), or an invalid website (the message says why). VALIDATION_ERROR:
            email is not an email address (details maps Email to a message). INVALID_REFERENCE:
            company_id names no live company'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN: the caller is neither admin nor sales (Insufficient
            permissions to update customers)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: 'NOT_FOUND: no live customer with this id'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: 'CONFLICT: another customer already uses this email'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded (120 per minute,
            burst 30, per client IP); details.retry_after is 60s and no Retry-After
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
