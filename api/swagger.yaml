  /customers/export:
    get:
      description: |-
        Admin only (route guard, repeated in the handler), deliberately narrower than the list, which sales and support can read: one request egresses the personal data of the whole customer base, so data minimisation keeps it from the roles that work one record at a time.
        The success body is NOT the JSON envelope: it is the raw CSV, Content-Type text/csv; charset=utf-8 and Content-Disposition attachment; filename=customers-export.csv. Errors raised before the file starts (401, 403, 429, 500) still use the JSON envelope. Every row is read before the first byte is written, so a database failure is a JSON 500, never a truncated file.
        Columns, in this order: id, first_name, last_name, email, phone, company, address, notes, assigned_to_id, created_at, updated_at, website. Timestamps are RFC 3339; an unassigned customer has an empty assigned_to_id. A text cell starting with =, @, a tab or a carriage return, or with + or - followed by anything other than a plain number, is prefixed with an apostrophe so spreadsheets do not run it as a formula.
        Not paginated: every live customer matching search is included; erased customers never are. Without sort_by the rows come in ascending id order; with an allowed sort_by they are ordered by that column, then id, in the requested direction.
      parameters:
      - description: Substring matched against first_name, last_name, email, company,
          phone and notes
        in: query
        name: search
        type: string
      - description: Sort column; any other value is ignored (ascending id order)
        enum:
        - created_at
        - updated_at
        - first_name
        - last_name
        - email
        - company
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction, used only with sort_by; any other value falls
          back to asc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - text/csv
      - application/json
      responses:
        "200":
          description: The CSV file (raw body, not the JSON envelope)
          schema:
            type: string
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN: the caller is not an admin (Insufficient permissions)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded (120 per minute,
            burst 30, per client IP); details.retry_after is 60s and no Retry-After
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: the customers could not be read'
