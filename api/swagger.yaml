  github_com_florinel-chis_gophercrm_internal_models.Form:
    properties:
      allowed_domains:
        items:
          type: string
        type: array
      captcha_enabled:
        type: boolean
      confirmation_body:
        type: string
      confirmation_subject:
        type: string
      consent_text:
        type: string
      content_url:
        type: string
      create_lead:
        description: |-
          CreateLead deliberately carries NO `default:true` column tag. GORM
          substitutes a literal column default whenever the Go field holds its zero
