            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      summary: Authenticate and obtain a JWT
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Public self-service registration. The account is always created
        with the customer role — the request body carries no role field and no client
        input can influence it. Elevated roles are assignable only through the admin-guarded
        POST /users endpoint. On success a JWT for the new account is returned alongside
        the user. The password must be at least 10 characters and contain an uppercase
        letter, a lowercase letter, a digit and a special character.
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RegisterRequest'
      produces:
