            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: 'NOT_FOUND: no live quote has this id (''Quote not found'')'
          schema:
            allOf:
