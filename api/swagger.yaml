  /deals/pipeline:
    get:
      description: The live deals aggregated per stage (admin and sales roles; sales
        users always get their own deals only, whatever owner_id says, as on GET /deals).
        data.stages lists all five stages in pipeline order — qualification, proposal,
        negotiation, won, lost — each present even when empty (count 0, totals []).
        count is the number of deals in the stage; totals holds one entry per currency,
        sorted by currency code, and amounts in different currencies are never added
        together. amount_cents is the sum of the deals' amounts; weighted_cents is
        round_half_up(sum of amount_cents × probability / 100), computed with integer
        arithmetic and rounded once on each stage-and-currency total, not per deal.
        Soft-deleted deals are not counted. owner_id (admin only) and company_id narrow
        the aggregate; a malformed or zero id is a 400, as on the list, and an id
        that matches nothing yields empty stages.
