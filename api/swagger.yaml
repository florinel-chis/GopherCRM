  /deals:
    get:
      description: 'One page of deals (admin and sales roles; sales users see only
        the deals they own, whatever owner_id says). data is the array of deals, each
        with its owner, company, customer and lead (lead_id and lead only when the
        caller may see that lead, as on GET /deals/{id}); meta carries the pagination.
        search matches title and notes (substring; case-insensitive on MySQL and MariaDB,
        case-sensitive on SQLite). Filters combine: stage, company_id, customer_id,
        owner_id (admin only) and open=true, which selects every stage but won and
        lost. sort_by must be one of the listed columns — any other value is a 400,
        never interpolated — and defaults to created_at; sort_order defaults to desc.
        page (1-based) overrides offset when supplied.'
      parameters:
      - description: Page number (1-based); when supplied it overrides offset
        in: query
        name: page
        type: integer
      - default: 0
        description: Result offset, ignored when page is supplied
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size, capped at 100
        in: query
        name: limit
        type: integer
      - description: Substring search across title and notes
        in: query
        name: search
        type: string
      - description: Only deals in this stage
        enum:
        - qualification
        - proposal
        - negotiation
        - won
        - lost
        in: query
        name: stage
        type: string
      - description: 'true: only deals whose stage is neither won nor lost'
        in: query
        name: open
        type: boolean
      - description: Only deals linked to this company
        in: query
        name: company_id
        type: integer
      - description: Only deals linked to this customer
        in: query
        name: customer_id
        type: integer
      - description: Only deals owned by this user (admin; sales is always narrowed
          to itself)
        in: query
        name: owner_id
        type: integer
      - default: created_at
        description: Sort column
        enum:
        - id
        - title
        - stage
        - amount_cents
        - probability
        - expected_close_date
        - closed_at
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction; anything else falls back to desc
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deals retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Deal'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: sort_by is not an allowed column, or stage, open or an id filter
            is malformed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - admin or sales role required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Too many requests - rate limit exceeded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List deals
      tags:
      - deals
    post:
      consumes:
      - application/json
      description: Create a deal (admin and sales roles only). title is trimmed and
        required, 1 to 200 characters. stage defaults to qualification. amount_cents
        is an integer in minor units, 0 to 1000000000000 (10^12 cents; a larger value
        is a 400); currency is three upper-case letters and defaults to the deals.default_currency
        configuration (EUR as shipped) when omitted. probability is 0 to 100 and defaults
        per stage (qualification 10, proposal 40, negotiation 70); won is always 100
        and lost always 0. expected_close_date is YYYY-MM-DD. lost_reason is stored
        only when the stage is lost. company_id, customer_id and lead_id are optional
        and must name live rows (400 INVALID_REFERENCE otherwise; 0 means none); lead_id
        must moreover name a lead the caller may see — admins any lead, sales users
        only the leads they own — and a lead the caller may not see is the same 400
        INVALID_REFERENCE as a missing one. owner_id defaults to the caller; sales
        users may only name themselves (403 otherwise), admins any live user. A first
        history row (from_stage null) is written in the same transaction; when the
        stage is won or lost, closed_at is set.
      parameters:
      - description: Deal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.DealRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Deal created, with owner, company, customer and lead preloaded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Deal'
              type: object
        "400":
          description: Invalid request data, a value longer than its column, a bad
            currency, probability or date, or an unknown company_id, customer_id,
            lead_id or owner_id (INVALID_REFERENCE)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - admin or sales role required; sales may only own
            deals themselves
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
