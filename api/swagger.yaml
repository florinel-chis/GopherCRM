            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN ''Insufficient permissions'': the caller is not
            admin or sales'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: more than 120 requests per minute (burst
            30) from this client IP, one bucket shared by every authenticated endpoint;
            error.details.retry_after is ''60s'' and no Retry-After or X-RateLimit
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: unexpected failure; the message is always
            ''An unexpected error occurred'''
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List quotes
      tags:
      - quotes
    post:
      consumes:
      - application/json
      description: |-
        Create a draft quote. Roles: admin and sales.
        Rules: title required (trimmed, 1 to 200 characters); notes at most 65535 bytes; valid_until YYYY-MM-DD; currency three upper-case letters, defaulting to the deals.default_currency setting (EUR as shipped). At least one of deal_id and customer_id is required. With deal_id: the deal must be live (else 400 INVALID_REFERENCE), owned by the caller when the caller is sales (403), and neither won nor lost (409); without customer_id the deal's customer is used, possibly none (such a quote cannot be emailed); a customer_id different from the deal's customer is 400 VALIDATION_ERROR. customer_id must name a live customer. owner_id defaults to the caller; a sales user may only name itself; the owner must be a live user.
        The quote starts as a draft with no lines and totals of 0, whatever else was sent; its first status-history row (from_status null, to_status draft) is written in the same transaction. No automation event is recorded for quotes.
        The response is the quote re-read with its number, lines and the customer, deal and owner summaries.
      parameters:
      - description: The quote to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.QuoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Quote created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.QuoteJSON'
              type: object
        "400":
          description: 'VALIDATION_ERROR: a binding rule failed (message ''Validation
            failed'', error.details maps the Go field name to a message), or a rule
            checked by the handler or the service failed (the message names it, no
            details). BAD_REQUEST: the body is not valid JSON for the schema (''Invalid
            request format''): title over 200 characters or blank, notes over 65535
            bytes, a malformed valid_until, neither deal_id nor customer_id, or a
            customer_id that is not the deal''s customer. INVALID_REFERENCE: deal_id,
            customer_id or owner_id names no live row'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: the Authorization header is missing or is neither
            Bearer <jwt> nor ApiKey <key> (''Missing or invalid authorization header''),
            or the credential is invalid, expired or belongs to a deactivated account
            (''Invalid credentials'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN ''Insufficient permissions'': the caller is not
            admin or sales; a sales user named another owner (''You can only assign
            quotes to yourself'') or quoted a deal it does not own (''You can only
            work on your own deals and quotes'')'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: 'CONFLICT: the deal is won or lost'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: more than 120 requests per minute (burst
            30) from this client IP, one bucket shared by every authenticated endpoint;
            error.details.retry_after is ''60s'' and no Retry-After or X-RateLimit
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: unexpected failure; the message is always
