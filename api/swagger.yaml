  /api-keys:
    get:
      description: 'Any authenticated role. Returns every key of the caller as a bare
        array, revoked and expired ones included, with no pagination, filtering or
        sorting parameters. There is no admin-wide view: each user sees only their
        own keys. Only the prefix of each key is returned, never the key or its hash.'
      produces:
      - application/json
      responses:
        "200":
          description: The caller's keys
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.APIKey'
                  type: array
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded (120 per minute,
            burst 30, per client IP); details.retry_after is 60s and no Retry-After
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: the keys could not be read'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List the caller's API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: |-
        Any authenticated role, through a bearer token or an existing API key; the key always belongs to the caller. The plaintext key (gcrm_ followed by 64 hexadecimal characters) is returned only in this response: only an HMAC of it is stored, so it can never be shown again. Use it as `Authorization: ApiKey <key>`; the gcrm_ prefix may be sent or left off. The key acts with the owner's role and stops working when it is revoked, when it expires, or when the owner is deactivated or erased.
        expires_at is optional: an RFC 3339 timestamp (for example 2026-12-31T23:59:59Z) that must lie in the future; omitted or empty, the key never expires. Expiry cannot be changed afterwards. There is no limit on the number of keys per user.
      parameters:
      - description: Key name and optional expiry
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Key created; key holds the plaintext, shown only this once
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.CreateAPIKeyResponse'
              type: object
