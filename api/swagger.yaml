  /tasks/bulk/status:
    post:
      consumes:
      - application/json
      description: 'Set the same status on up to 100 tasks in one all-or-nothing transaction.
        Roles: every authenticated role; admins may update any task, every other role
        only tasks assigned to them. Repeated ids are collapsed. If any listed task
        is missing (404, error.details.missing_ids), not assigned to a non-admin caller
        (403, error.details.forbidden_ids) or completed while the target status is
        not completed (400, error.details.completed_ids), nothing is written; the
        checks report in that order. No automation event is recorded; once the id,
        status and role checks have passed, an audit row is written to the bulk operation
        log and marked completed or failed.'
      parameters:
      - description: Task IDs and the status to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.BulkTaskStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Every listed task was updated
          schema:
