  /forms:
    get:
      description: |-
        One page of form definitions (soft-deleted forms excluded), each with the number of live submissions it has collected, spam included.
        Pagination: offset (default 0) and limit (default 20, capped at 100; non-positive or unparseable values fall back to the default). meta carries page, per_page, total and total_pages.
        Filtering and sorting: status is draft, published or archived; sort_by is id, name, status, created_at or updated_at; sort_order is asc or desc, anything else means desc. Without sort_by the order is created_at descending whatever sort_order says; ties are broken by id. An unknown status or sort column is answered with 400 VALIDATION_ERROR (message "Validation failed", error.details {"status": "..."} or {"sort_by": "..."}).
        Roles: admin, sales, support.
      parameters:
      - default: 0
        description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Page size, capped at 100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 'Filter by publication state (unknown value: 400)'
        enum:
        - draft
        - published
        - archived
        in: query
        name: status
        type: string
      - description: 'Sort column (unknown value: 400)'
        enum:
        - id
        - name
        - status
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort direction; ignored without sort_by
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Forms retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_handler.FormListItem'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIMeta'
              type: object
        "400":
          description: VALIDATION_ERROR - unknown status filter or sort column
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            an invalid or expired token or API key
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: FORBIDDEN - role is not admin, sales or support (the customer
            role is always refused)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS - moderate tier: 120 requests/min, burst
            30, per client IP, shared by every authenticated route; error.details.retry_after
            is ''60s''; no Retry-After header'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: INTERNAL_ERROR - unexpected failure; the cause is never echoed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List forms
      tags:
      - forms
    post:
      consumes:
      - application/json
      description: |-
        Create a form definition. The server assigns the public identifier used by the embed script and records the caller as author. The definition is normalised and validated before it is stored: name trimmed and non-blank; 1 to 50 fields with unique machine names matching ^[a-z][a-z0-9_]{0,49}$; exactly one field of type email, named "email"; select fields with 1 to 50 non-blank options and no options on other types; hidden fields never required; max_length defaulted and clamped (see FormFieldDef); a redirect action needs an http(s) redirect_url; notification addresses shaped like email addresses; allowed domains bare hosts. Omitting create_lead means true, and then default_owner_id must name an active admin or sales user. status defaults to draft, submit_action to message. The response is the stored form.
        Roles: admin, sales.
        Errors: 400 VALIDATION_ERROR (message "Validation failed", error.details maps the failing Go struct field name, e.g. Name or Fields, to a message) when a binding rule fails; 400 BAD_REQUEST ("Invalid request format") for a body that is not valid JSON or does not match the field types; 400 VALIDATION_ERROR without error.details (the member is omitted) when a definition rule fails (the message states the rule, e.g. "a form that creates leads needs a default owner: invalid form definition: validation failed"); 400 VALIDATION_ERROR (message "Validation failed") with error.details {"default_owner_id": "..."} when the lead owner does not exist, is deactivated or is not an admin or sales user.
      parameters:
      - description: Form definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateFormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Form created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Form'
              type: object
        "400":
          description: VALIDATION_ERROR or BAD_REQUEST - invalid body or form definition
            (see description)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: UNAUTHORIZED - missing or malformed Authorization header, or
            an invalid or expired token or API key
