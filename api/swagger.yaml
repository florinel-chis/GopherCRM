  /dashboard/sales-performance:
    get:
      description: 'Lead CONVERSIONS over time, as chart data with a single "Conversions"
        dataset: the number of leads that reached the converted status in each bucket
        of the chosen window. It is a count of conversions, not revenue or pipeline
        value, of which this CRM tracks neither. A lead carries no dedicated converted_at
        column, so its updated_at stands in for the conversion time — a converted
        lead edited later moves to the bucket of that edit. Buckets are calendar-aligned
        and end with the one containing the current instant: week gives the last 12
        ISO weeks labelled by their Monday (2026-08-03), month the last 12 months
        (2026-08), quarter the last 8 quarters (2026-Q3), year the last 5 years (2026).
        An unrecognised period falls back to month. The counts are system-wide and
        are not narrowed to the caller''s own leads. Restricted to the admin, sales
        and support roles; customer-role callers receive 403.'
      parameters:
      - default: month
        description: Bucket size and window length
        enum:
        - week
        - month
        - quarter
        - year
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Conversion time series retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
