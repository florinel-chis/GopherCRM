  /forms/public/{key}/submissions:
    post:
      consumes:
      - application/json
      description: Accepts a submission for a published form. The body carries the
        field values, the consent flag, the challenge handed out with the definition,
        the honeypot input and, when the form uses reCAPTCHA, the client token. Field-level
        problems come back as 400 with a field name to message map in error.details.
        A submission caught by a spam layer is answered exactly like a genuine one,
        so the response says nothing about which layers exist. Unauthenticated and
        cross-origin; bodies are capped at 64 KB.
