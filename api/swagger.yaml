  /quotes/{id}/email:
    post:
      description: Send the quote as a plaintext rendering (number, title, every line,
        totals, validity) to the linked customer's current address (admin and sales
        roles; sales users only their own quotes). The body is empty. Only a sent
        or accepted quote can be emailed (409 CONFLICT otherwise); a quote without
        a customer, or whose customer was erased, is a 409 CONFLICT and no mail is
        sent. The subject is fixed ("Quote Q-000042 from GopherCRM"). No transaction
        is held during the delivery; on success last_emailed_at is stamped by a conditional
        update that matches only while the quote is still sent or accepted and no
        revision to draft committed in between — otherwise 409 CONFLICT with last_emailed_at
        unchanged. A mailer failure is 502 MAIL_DELIVERY_FAILED.
      parameters:
      - description: Quote ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: The quote with last_emailed_at set
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
