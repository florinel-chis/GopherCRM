  /configurations/{key}:
    get:
      description: 'Admin only (route guard, repeated in the handler). Returns one
        entry by its key. A sensitive entry (is_sensitive) is masked: its value is
        always empty and is_set reports whether one is stored. The key ui is not reachable
        here: GET /configurations/ui answers it.'
      parameters:
      - description: Configuration key, e.g. security.allow_public_registration
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The entry
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.ConfigurationResponse'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: 'FORBIDDEN: the caller is not an admin (Insufficient permissions)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: 'NOT_FOUND: no entry with this key'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: 'TOO_MANY_REQUESTS: authenticated tier exceeded (120 per minute,
            burst 30, per client IP); details.retry_after is 60s and no Retry-After
            header is sent'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
          description: 'INTERNAL_ERROR: the entry could not be read'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get a configuration entry (admin)
      tags:
      - configurations
    put:
      consumes:
      - application/json
      description: |-
        Admin only (route guard, repeated in the handler). Sets the value of an existing entry and returns it. Checks, in order: the entry exists (404), is not read-only (400), the value is in valid_values when the entry has that list (for an array entry every element must be listed), and the value matches the declared type: a string entry takes only a JSON string, a boolean entry only true or false, an integer entry only a whole number (a fraction is refused, not truncated); float, json and array entries accept any JSON value and store its JSON text. The AEO provider entries integration.aeo.{engine}_model and integration.aeo.{engine}_base_url are trimmed and checked further: a model name of at most 120 characters, a base URL that is an absolute https URL with a valid host and port and without credentials, query, fragment or zone identifier.
        A sensitive entry (is_sensitive) takes the plaintext secret, stores it encrypted (AES-256-GCM, key derived from API_KEY_SECRET or JWT_SECRET) and is returned masked; send an empty string to clear it. Changes take effect on the next read of the setting, without a restart.
      parameters:
      - description: Configuration key, e.g. security.allow_public_registration
        in: path
        name: key
        required: true
        type: string
      - description: The new value; any JSON value except null, falsy values included
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SetConfigurationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated entry
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.ConfigurationResponse'
              type: object
        "400":
          description: 'VALIDATION_ERROR: value missing (details maps Value to a message).
            BAD_REQUEST: malformed JSON (Invalid request format), Configuration value
            cannot be null, Configuration is read-only, or Invalid value for configuration
            (outside valid_values, wrong type, or a rejected AEO provider setting)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: 'UNAUTHORIZED: missing or malformed Authorization header, or
            an invalid, expired or revoked credential, or a deactivated or erased
            account'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
