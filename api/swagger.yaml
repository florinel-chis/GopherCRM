  /customers/{id}/assign:
    post:
      consumes:
      - application/json
      description: |-
        Set the staff account that owns this customer relationship (admin and sales roles only; the route is guarded by middleware.RequireRole(admin, sales) and the handler repeats the check).

        The target account must exist, must be active, and must hold the admin or sales role: customer ownership is a sales function, so support accounts are rejected the same way a support-only ticket assignee is, and a customer-role account is rejected outright — handing it a book of other people's records would be a data-protection incident.

        A missing customer or a missing user is 404. A user that exists but is deactivated or holds the wrong role is 400, because the request identified a real account and was refused on its merits.
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Assignment request
        in: body
        name: request
        required: true
        schema:
