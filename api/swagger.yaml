  /quotes/{id}/status:
    post:
      consumes:
      - application/json
      description: 'Change the status (admin and sales roles; sales users only their
        own quotes). The allowed moves are draft→sent, sent→accepted, sent→rejected,
        sent→expired and sent→draft; any other pair, the same status again included,
        and a transition that lost its race are 400 INVALID_STATUS_TRANSITION and
        write nothing. One transaction: the quote is claimed by a conditional update
        (WHERE status = the stored status), then for draft→sent the line count is
        read with a locking read — zero lines rolls the claim back with 409 CONFLICT
        — and one history row is written. accepted is refused with 409 CONFLICT once
        valid_until lies in the past (local date). sent sets sent_at; accepted, rejected
        and expired set closed_at; sent→draft clears both. Accepting a quote does
        not change its deal.'
      parameters:
      - description: Quote ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.QuoteStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The quote after the move
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_models.Quote'
              type: object
        "400":
          description: Invalid quote ID or unknown status (VALIDATION_ERROR); a disallowed
            pair or a lost race (INVALID_STATUS_TRANSITION)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "403":
          description: Forbidden - sales users can only move their own quotes
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "404":
          description: Quote not found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "409":
          description: draft→sent without lines, or accepted after valid_until
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "429":
          description: Too many requests - rate limit exceeded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_florinel-chis_gophercrm_internal_utils.APIError'
              type: object
        "500":
