  /tickets/bulk/status:
    post:
      consumes:
      - application/json
      description: 'Set the same status on up to 100 tickets in one all-or-nothing
        transaction. Roles: admin may update any ticket, support only tickets assigned
        to them; sales (read-only on tickets) and customers get 403 before the body
        is read. Repeated ids are collapsed. If any listed ticket is missing (404,
        error.details.missing_ids), not assigned to a support caller (403, error.details.forbidden_ids)
        or closed while the target status is not closed (400, error.details.closed_ids),
        nothing is written; the checks report in that order. No automation event is
        recorded; once the id, status and role checks have passed, an audit row is
        written to the bulk operation log and marked completed or failed.'
      parameters:
      - description: Ticket IDs and the status to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.BulkTicketStatusRequest'
      produces:
