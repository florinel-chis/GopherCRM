  /customers/{id}/tickets:
    get:
      description: 'One page of one customer''s tickets, in ascending id order. Roles:
        admin and sales get all of the customer''s tickets; support may query any
        customer but gets only that customer''s tickets assigned to them (applied
        in the query before offset and limit, so tickets, total and meta reflect it);
